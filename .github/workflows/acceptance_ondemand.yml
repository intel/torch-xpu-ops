name: OnDemand Acceptance Comparison

# Self-contained orchestration workflow that runs two pipelines (target vs
# baseline) in the same workflow run, then compares their results.
#
# Test scope is fixed to the acceptance comparison scope:
#   * UT  : xpu_p0 (inductor/non-inductor/profiling in container, distributed in baremetal)
#   * E2E : huggingface, timm_models, torchbench
#           (training amp_fp16 + inference bfloat16, accuracy + performance)
#
# Flexibility is on the *component* under test: select one component
# (`triton`, `onednn`) via `test_component`, then set `target_version` /
# `baseline_version` for that component. Other components use their base
# inputs or upstream-pinned defaults.

on:
  workflow_dispatch:
    inputs:
      python:
        type: string
        required: true
        default: '3.10'
        description: Python version (e.g. 3.10, 3.11, 3.12)

      # ----- Test scope (command pattern) -----
      test_pattern:
        type: choice
        options: [test_pt, test_pt_ut, test_pt_e2e, test_pt_smoke]
        default: test_pt
        description: 'Command pattern: test_pt (UT+E2E), test_pt_ut (UT only), test_pt_e2e (E2E only), test_pt_smoke (smoke tests only).'

      # ----- Common base refs -----
      pytorch:
        type: string
        default: 'main'
        description: 'Base PyTorch ref (commit/branch/tag, or `repo@ref`).'
      torch_xpu_ops:
        type: string
        default: 'pinned'
        description: 'Base torch-xpu-ops ref, or `pinned`.'

      # ----- Component under test -----
      test_component:
        type: choice
        options: [onednn, triton]
        default: onednn
        description: 'Which component varies between target and baseline.'
      target_version:
        type: string
        required: true
        description: 'Target ref for the selected test_component.'
      baseline_version:
        type: string
        required: true
        description: 'Baseline ref for the selected test_component.'

      caller:
        type: string
        default: ''
        description: 'Caller id (e.g. onednn-pr-2) for concurrency grouping; a new run cancels the previous one with the same caller.'

      callback_repo:
        type: string
        default: ''
        description: 'owner/name to post the result commit status back to (empty = no callback).'
      callback_sha:
        type: string
        default: ''
        description: 'Commit SHA in callback_repo to attach the result status to.'
      callback_context:
        type: string
        default: ''
        description: 'Commit status context to set in callback_repo on completion.'

permissions: read-all

concurrency:
  group: acceptance-${{ github.event.inputs.caller || format('{0}-{1}-{2}-{3}-{4}', github.event.inputs.test_component, github.event.inputs.test_pattern, github.event.inputs.python, github.event.inputs.target_version, github.event.inputs.baseline_version) }}
  cancel-in-progress: true

run-name: >-
  Acceptance / ${{ inputs.test_component }} [${{ inputs.test_pattern }}] ${{ inputs.target_version }} vs ${{ inputs.baseline_version }} · caller:${{ inputs.caller }}

jobs:
  # ==================================================================
  # TARGET pipeline
  # ==================================================================
  target-build:
    name: target / build
    secrets: inherit
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ inputs.pytorch }}
      torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
      triton: ${{ inputs.test_component == 'triton' && inputs.target_version || '' }}
      onednn: ${{ inputs.test_component == 'onednn' && inputs.target_version || '' }}
      python: ${{ inputs.python }}
      category: target

  target-ut:
    name: target / ut
    if: ${{ inputs.test_pattern == 'test_pt' || inputs.test_pattern == 'test_pt_ut' || inputs.test_pattern == 'test_pt_smoke' }}
    needs: target-build
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: acceptance
      pytorch: ${{ inputs.pytorch }}
      torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
      python: ${{ inputs.python }}
      ut: ${{ inputs.test_pattern == 'test_pt_smoke' && 'op_regression' || 'xpu_p0'}}
      category: target
      skip_summary: true

  target-e2e:
    name: target / e2e
    if: ${{ inputs.test_pattern == 'test_pt' || inputs.test_pattern == 'test_pt_e2e' || inputs.test_pattern == 'test_pt_smoke' }}
    needs: target-build
    secrets: inherit
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: acceptance
      test_type: build-acceptance
      pytorch: ${{ inputs.pytorch }}
      python: ${{ inputs.python }}
      suite: ${{ inputs.test_pattern == 'test_pt_smoke' && 'huggingface' || 'huggingface,timm_models,torchbench'}}
      scenario: accuracy,performance
      category: target
      model: ${{ inputs.test_pattern == 'test_pt_smoke' && 'BertForMaskedLM' || ''}}

  # ==================================================================
  # BASELINE pipeline
  # ==================================================================
  baseline-build:
    name: baseline / build
    secrets: inherit
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ inputs.pytorch }}
      torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
      triton: ${{ inputs.test_component == 'triton' && inputs.baseline_version || '' }}
      onednn: ${{ inputs.test_component == 'onednn' && inputs.baseline_version || '' }}
      python: ${{ inputs.python }}
      category: baseline

  baseline-ut:
    name: baseline / ut
    if: ${{ inputs.test_pattern == 'test_pt' || inputs.test_pattern == 'test_pt_ut' || inputs.test_pattern == 'test_pt_smoke' }}
    needs: baseline-build
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: acceptance
      pytorch: ${{ inputs.pytorch }}
      torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
      python: ${{ inputs.python }}
      ut: ${{ inputs.test_pattern == 'test_pt_smoke' && 'op_regression' || 'xpu_p0'}}
      category: baseline
      skip_summary: true

  baseline-e2e:
    name: baseline / e2e
    if: ${{ inputs.test_pattern == 'test_pt' || inputs.test_pattern == 'test_pt_e2e' || inputs.test_pattern == 'test_pt_smoke' }}
    needs: baseline-build
    secrets: inherit
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: acceptance
      test_type: build-acceptance
      pytorch: ${{ inputs.pytorch }}
      python: ${{ inputs.python }}
      suite: ${{ inputs.test_pattern == 'test_pt_smoke' && 'huggingface' || 'huggingface,timm_models,torchbench'}}
      scenario: accuracy,performance
      category: baseline
      model: ${{ inputs.test_pattern == 'test_pt_smoke' && 'BertForMaskedLM' || ''}}

  # ==================================================================
  # Compare results
  # ==================================================================
  compare-results:
    name: Compare results
    needs: [target-ut, target-e2e, baseline-ut, baseline-e2e]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup python
        uses: ./.github/actions/setup-python
        with:
          python: ${{ inputs.python }}

      - name: Print configuration
        run: |
          {
            echo "## Acceptance comparison"
            echo ""
            echo "| | Value |"
            echo "| --- | --- |"
            echo "| **Component under test** | ${{ inputs.test_component }} |"
            echo "| Target version   | \`${{ inputs.target_version }}\` |"
            echo "| Baseline version | \`${{ inputs.baseline_version }}\` |"
            echo "| Base pytorch     | ${{ inputs.pytorch }} |"
            echo "| Base torch-xpu-ops | ${{ inputs.torch_xpu_ops }} |"
            echo "| Test pattern     | ${{ inputs.test_pattern }} |"
            echo "| Triggered by     | ${{ github.actor }} |"
            echo ""
            echo "Scope: \`${{ inputs.test_pattern }}\` — smoke = op_regression UT + huggingface(BertForMaskedLM); otherwise UT=\`xpu_p0\`, E2E=huggingface,timm_models,torchbench (training amp_fp16 + inference bfloat16, accuracy+performance)."
          } > "${GITHUB_STEP_SUMMARY}"

      - name: Download target E2E logs
        uses: actions/download-artifact@v8
        with:
          pattern: 'Inductor-*-LTS2-XPU-E2E-Data-*-target'
          path: ${{ github.workspace }}/results/target/e2e

      - name: Download target UT logs
        uses: actions/download-artifact@v8
        with:
          pattern: 'Inductor-XPU-UT-Data-*-target'
          path: ${{ github.workspace }}/results/target/ut

      - name: Download target UT failure lists
        uses: actions/download-artifact@v8
        with:
          pattern: 'XPU-UT-Failure-List-*-target'
          path: ${{ github.workspace }}/results/target/ut

      - name: Download baseline E2E logs
        uses: actions/download-artifact@v8
        with:
          pattern: 'Inductor-*-LTS2-XPU-E2E-Data-*-baseline'
          path: ${{ github.workspace }}/results/baseline/e2e

      - name: Download baseline UT logs
        uses: actions/download-artifact@v8
        with:
          pattern: 'Inductor-XPU-UT-Data-*-baseline'
          path: ${{ github.workspace }}/results/baseline/ut

      - name: Download baseline UT failure lists
        uses: actions/download-artifact@v8
        with:
          pattern: 'XPU-UT-Failure-List-*-baseline'
          path: ${{ github.workspace }}/results/baseline/ut

      - name: Ensure result directories exist
        run: |
          mkdir -p "${{ github.workspace }}/results/target/e2e"
          mkdir -p "${{ github.workspace }}/results/target/ut"
          mkdir -p "${{ github.workspace }}/results/baseline/e2e"
          mkdir -p "${{ github.workspace }}/results/baseline/ut"

      - name: Generate acceptance report
        id: report
        env:
          ACC_BASE_DIR: ${{ github.workspace }}/results/baseline
          ACC_TARGET_DIR: ${{ github.workspace }}/results/target
          ACC_COMPONENT: ${{ inputs.test_component }}
          ACC_BASE_LABEL: ${{ inputs.baseline_version }}
          ACC_TARGET_LABEL: ${{ inputs.target_version }}
          ACC_OUT_DIR: ${{ github.workspace }}/comparison
          ACC_SECTIONS: ${{ (inputs.test_pattern == 'test_pt_ut' && 'ut') || (inputs.test_pattern == 'test_pt_e2e' && 'acc,perf') || 'ut,acc,perf' }}
        run: |
          mkdir -p "${{ github.workspace }}/comparison"
          python .github/scripts/acceptance-report/gen_report.py

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/comparison/*.html
            ${{ github.workspace }}/comparison/*.xlsx
          retention-days: 30
          if-no-files-found: warn

  # ==================================================================
  # Report result back to the caller (event-driven commit-status callback)
  # ==================================================================
  report-back:
    name: report back
    needs: [target-ut, target-e2e, baseline-ut, baseline-e2e, compare-results]
    if: ${{ !cancelled() && inputs.callback_repo != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Post result commit status to caller
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          CB_REPO: ${{ inputs.callback_repo }}
          CB_SHA: ${{ inputs.callback_sha }}
          CB_CONTEXT: ${{ inputs.callback_context }}
          CALLER: ${{ inputs.caller }}
          COMPONENT: ${{ inputs.test_component }}
          PATTERN: ${{ inputs.test_pattern }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_TUT: ${{ needs.target-ut.result }}
          R_TE2E: ${{ needs.target-e2e.result }}
          R_BUT: ${{ needs.baseline-ut.result }}
          R_BE2E: ${{ needs.baseline-e2e.result }}
          R_CMP: ${{ needs.compare-results.result }}
        run: |
          [ -n "$CB_SHA" ] && [ -n "$CB_CONTEXT" ] || { echo "No callback sha/context; skipping."; exit 0; }
          # The concurrency group (caller) is the unique key: only the newest run
          # for this caller owns the status, so an older/superseded run never
          # clobbers the single active run per PR.
          if [ -n "$CALLER" ]; then
            newest=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow acceptance_ondemand.yml \
              --json databaseId,displayTitle,createdAt \
              --jq "[.[] | select((.displayTitle // \"\") | test(\"caller:${CALLER}$\"))] | sort_by(.createdAt) | last | .databaseId // empty" 2>/dev/null || echo "")
            if [ -n "$newest" ] && [ "$newest" != "${GITHUB_RUN_ID}" ]; then
              echo "Superseded: newest run for ${CALLER} is ${newest} (this ${GITHUB_RUN_ID}); skip."; exit 0
            fi
          fi
          state=success
          for r in "$R_TUT" "$R_TE2E" "$R_BUT" "$R_BE2E" "$R_CMP"; do
            case "$r" in success|skipped) ;; *) state=failure ;; esac
          done
          gh api -X POST "repos/${CB_REPO}/statuses/${CB_SHA}" \
            -f state="$state" \
            -f context="$CB_CONTEXT" \
            -f target_url="$RUN_URL" \
            -f description="${COMPONENT} acceptance (${PATTERN}): ${state}"
