name: OnDemand P0 Scope Tests

# Self-contained workflow that runs the P0 acceptance scope against a single
# PyTorch build/wheel (no baseline, no comparison).
#
# Test scope:
#   * UT  : p0 only
#   * E2E : huggingface, timm_models, torchbench (acceptance scope:
#           training amp_fp16 + inference bfloat16, accuracy + performance)
#
# PyTorch source can be a public wheel or the nightly wheel:
#   * release_wheel  -> https://download.pytorch.org/whl/xpu
#   * test_wheel     -> https://download.pytorch.org/whl/test/xpu
#   * nightly_wheel  -> https://download.pytorch.org/whl/nightly/xpu
#   * commit/branch  -> built from source

on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [acceptance]
        description: 'Runner label for the test pool (UT + E2E).'
      pytorch:
        type: string
        default: 'nightly_wheel'
        description: "PyTorch version. 'release_wheel'/'test_wheel'/'nightly_wheel' for public wheels, or 'commit/branch', or 'repo@commit/repo@branch'"
      torch_xpu_ops:
        type: string
        default: 'pinned'
        description: "Torch-xpu-ops ref, 'commit/branch', 'repo@commit/repo@branch', or 'pinned' for pytorch pin"
      triton:
        type: string
        default: ''
        description: "Triton by default is pinned by pytorch, or 'commit/branch', or 'repo@commit/repo@branch'"
      python:
        type: string
        default: '3.10'
        description: "Python version by default is '3.10'"
      run_ut:
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
        description: 'Whether to run the p0 UT job.'

permissions: read-all

run-name: P0-Scope / ${{ inputs.pytorch }}

jobs:
  # ==================================================================
  # Pick ONE runner and reuse for every test job (target & baseline,
  # UT & E2E) so they all execute on the same physical machine.
  # ==================================================================
  pick-runner:
    name: pick-runner
    runs-on: ${{ inputs.runner }}
    outputs:
      runner_id: ${{ steps.runner-info.outputs.runner_id }}
    steps:
      - name: Derive runner id
        id: runner-info
        shell: bash -xe {0}
        run: |
          runner_id="$(echo "${RUNNER_NAME}" | sed 's/-[0-9]\+$//')"
          echo "runner_id=${runner_id}" | tee -a "${GITHUB_OUTPUT}"

  Linux-Ondemand-Build:
    name: linux-build
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build: [build]
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ inputs.pytorch }}
      torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
      triton: ${{ inputs.triton }}
      python: ${{ inputs.python }}

  Linux-Ondemand-UT-Tests:
    name: linux-ut
    if: ${{ inputs.run_ut == 'true' }}
    needs: [pick-runner, Linux-Ondemand-Build]
    secrets: inherit
    permissions: write-all
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: ${{ needs.pick-runner.outputs.runner_id }}
      pytorch: ${{ inputs.pytorch }}
      torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
      python: ${{ inputs.python }}
      ut: p0

  Linux-Ondemand-E2E-Tests:
    name: linux-e2e
    needs: [pick-runner, Linux-Ondemand-Build]
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        suite: [huggingface, timm_models, torchbench]
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: ${{ needs.pick-runner.outputs.runner_id }}
      test_type: ${{ endsWith(inputs.pytorch, '_wheel') && 'wheel-acceptance' || 'build-acceptance' }}
      pytorch: ${{ inputs.pytorch }}
      python: ${{ inputs.python }}
      suite: ${{ matrix.suite }}
      scenario: accuracy,performance

  Linux-Ondemand-E2E-Tests-Summary:
    name: linux-e2e
    needs: [Linux-Ondemand-E2E-Tests]
    if: ${{ ! cancelled() && ! endsWith(needs.Linux-Ondemand-E2E-Tests.result, 'ed') }}
    permissions: write-all
    uses: ./.github/workflows/_linux_e2e_summary.yml
    with:
      test_type: ${{ endsWith(inputs.pytorch, '_wheel') && 'wheel-acceptance' || 'build-acceptance' }}
      python: ${{ inputs.python }}

  Upload-Results:
    name: upload-results
    needs: [Linux-Ondemand-UT-Tests, Linux-Ondemand-E2E-Tests]
    if: ${{ ! cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download UT logs
        uses: actions/download-artifact@v4
        with:
          pattern: 'Inductor-XPU-UT-Data-*'
          path: ${{ github.workspace }}/results/ut
      - name: Download UT failure lists
        uses: actions/download-artifact@v4
        with:
          pattern: 'XPU-UT-Failure-List-*'
          path: ${{ github.workspace }}/results/ut
      - name: Download E2E logs
        uses: actions/download-artifact@v4
        with:
          pattern: 'Inductor-*-LTS2-XPU-E2E-Data-*'
          path: ${{ github.workspace }}/results/e2e
      - name: Upload consolidated results
        uses: actions/upload-artifact@v4
        with:
          name: P0-Scope-Results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/results/**
          retention-days: 30
          if-no-files-found: warn