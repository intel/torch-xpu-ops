name: Nightly-OnDemand Tests

on:
  schedule:
    # GMT+8 21:00 every workday
    - cron: '10 13 * * 0-4' # build from source
    - cron: '30 13 * * 0-4' # nightly wheel
    # GMT+8 00:00 Saturday
    - cron: '10 16 * * 5' # build from source
    - cron: '30 16 * * 5' # nightly wheel
  workflow_dispatch:
    inputs:
      pytorch:
        type: string
        default: 'main'
        description: Pytorch version, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        type: string
        default: ''
        description: Torch-xpu-ops by default is the run triggered branch, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      triton:
        type: string
        default: ''
        description: Triton by default is pinned by pytorch, or 'commit/branch', or 'repo@commit/repo@branch'
      python:
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.yaml
      runner:
        type: string
        default: ''
        description: Linux test runner label for UT, E2E and microbench. Empty uses the `runner` entries of .github/ci-config/defaults.yaml
      ut:
        type: string
        default: ''
        description: UT scope. 'op_regression,op_extended,op_ut,skipped_ut,xpu_profiling,torch_xpu,op_regression_dev1,xpu_distributed,upstream_distributed,upstream_inductor,upstream_default,microbench,windows'. Delimiter is comma
      suite:
        type: string
        default: ''
        description: Dynamo benchmarks test suite. 'huggingface,timm_models,torchbench'. Delimiter is comma
      dt:
        type: string
        default: ''
        description: Data precision of the test. 'float32,bfloat16,float16,amp_bf16,amp_fp16,int8'. Delimiter is comma
      mode:
        type: string
        default: ''
        description: Test mode. 'inference,training'. Delimiter is comma
      scenario:
        type: string
        default: ''
        description: Test scenario. 'accuracy,performance'. Delimiter is comma
      model:
        type: string
        default: ''
        description: Model. Will only run this one mode if set
      ut_auto_issue:
        type: boolean
        default: false
        description: Analyse this run's UT failures. Evidence only - an on-demand run files no issues

permissions: read-all

run-name: ${{ (contains(github.event.schedule, '13') && 'Nightly') || (contains(github.event.schedule, '16') && 'Weekly') || 'On-demand' }} / ${{ (contains(github.event.schedule, '10') && 'Build-from-source') || (contains(github.event.schedule, '30') && 'Nightly-wheel') || inputs.pytorch }}

jobs:
  config:
    name: config
    if: ${{ github.repository_owner == 'intel' || github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # (build|wheel)-(nightly|weekly|ondemand)
      test_type: ${{ steps.scope.outputs.test_type }}
      pytorch: ${{ steps.scope.outputs.pytorch }}
      torch_xpu_ops: ${{ steps.scope.outputs.torch_xpu_ops }}
      triton: ${{ steps.scope.outputs.triton }}
      python: ${{ steps.scope.outputs.python }}
      ut: ${{ steps.scope.outputs.ut }}
      suite: ${{ steps.scope.outputs.suite }}
      scenario: ${{ steps.scope.outputs.scenario }}
      run_ut: ${{ steps.scope.outputs.run_ut }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      run_microbench: ${{ steps.scope.outputs.run_microbench }}
      run_windows: ${{ steps.scope.outputs.run_windows }}
      runner_ut: ${{ steps.ci-config.outputs.ut }}
      runner_accuracy: ${{ steps.ci-config.outputs.accuracy }}
      runner_performance: ${{ steps.ci-config.outputs.performance }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Select runners
        id: ci-config
        uses: ./.github/actions/ci-config
        with:
          runner: ${{ inputs.runner }}
      - name: Resolve test scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REF_NAME: ${{ github.ref_name }}
          IN_PYTORCH: ${{ inputs.pytorch }}
          IN_TORCH_XPU_OPS: ${{ inputs.torch_xpu_ops }}
          IN_TRITON: ${{ inputs.triton }}
          IN_PYTHON: ${{ inputs.python }}
          IN_UT: ${{ inputs.ut }}
          IN_SUITE: ${{ inputs.suite }}
          IN_SCENARIO: ${{ inputs.scenario }}
        run: |
          # comma list -> JSON array, dropping empty and the given non-matrix entries
          to_json() { tr ',' '\n' <<< "$1" | { grep -vxE "${2:-}|" || true; } | jq -Rnc '[inputs]'; }
          has() { tr ',' '\n' <<< "$1" | grep -qx "$2" && echo true || echo false; }
          if [ "${EVENT}" == "schedule" ]; then
            case "${SCHEDULE}" in
              "10 13 * * 0-4") test_type="build-nightly" ;;
              "30 13 * * 0-4") test_type="wheel-nightly" ;;
              "10 16 * * 5")   test_type="build-weekly" ;;
              "30 16 * * 5")   test_type="wheel-weekly" ;;
              *) echo "No such scheduler: ${SCHEDULE}"; exit 1 ;;
            esac
            if [[ "${test_type}" == build-* ]]; then
              pytorch="main"; torch_xpu_ops="main"
            else
              pytorch="nightly_wheel"; torch_xpu_ops="pinned"
            fi
            ut_list="basic,op_ut,skipped_ut,xpu_profiling,xpu_distributed"
            # weekly also runs the upstream UT scopes
            if [[ "${test_type}" == *-weekly ]]; then
              ut_list+=",upstream_distributed,upstream_inductor,upstream_default"
            fi
            ut="$(to_json "${ut_list}")"
            suite="$(to_json huggingface,timm_models,torchbench)"
            scenario="$(to_json accuracy,performance)"
            triton=""; python=""
            run_microbench=false; run_windows=true
          else
            pytorch="${IN_PYTORCH}"
            torch_xpu_ops="${IN_TORCH_XPU_OPS:-${REF_NAME}}"
            [[ "${pytorch}" == *_wheel ]] && test_type="wheel-ondemand" || test_type="build-ondemand"
            ut="$(to_json "${IN_UT}" 'microbench|windows')"
            suite="$(to_json "${IN_SUITE}")"
            scenario="$(to_json "${IN_SCENARIO:-accuracy,performance}")"
            triton="${IN_TRITON}"; python="${IN_PYTHON}"
            run_microbench="$(has "${IN_UT}" microbench)"
            run_windows="$(has "${IN_UT}" windows)"
          fi
          {
            echo "test_type=${test_type}"
            echo "pytorch=${pytorch}"
            echo "torch_xpu_ops=${torch_xpu_ops}"
            echo "triton=${triton}"
            echo "python=${python}"
            echo "ut=${ut}"
            echo "suite=${suite}"
            echo "scenario=${scenario}"
            echo "run_ut=$([ "${ut}" != "[]" ] && echo true || echo false)"
            echo "run_e2e=$([ "${suite}" != "[]" ] && echo true || echo false)"
            echo "run_microbench=${run_microbench}"
            echo "run_windows=${run_windows}"
          } | tee -a "${GITHUB_OUTPUT}"

  linux-build:
    name: linux-build
    needs: config
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build: [build]
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ needs.config.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.config.outputs.torch_xpu_ops }}
      triton: ${{ needs.config.outputs.triton }}
      python: ${{ needs.config.outputs.python }}

  linux-ut:
    name: linux-ut
    needs: [config, linux-build]
    if: ${{ needs.config.outputs.run_ut == 'true' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: ${{ fromJSON(needs.config.outputs.ut) }}
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: ${{ needs.config.outputs.runner_ut }}
      pytorch: ${{ needs.config.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.config.outputs.torch_xpu_ops }}
      python: ${{ needs.config.outputs.python }}
      ut: ${{ matrix.ut_name }}

  linux-e2e:
    name: linux-e2e
    needs: [config, linux-build]
    if: ${{ needs.config.outputs.run_e2e == 'true' }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.config.outputs.suite) }}
        scenario: ${{ fromJSON(needs.config.outputs.scenario) }}
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: ${{ needs.config.outputs[format('runner_{0}', matrix.scenario)] }}
      test_type: ${{ needs.config.outputs.test_type }}
      pytorch: ${{ needs.config.outputs.pytorch }}
      python: ${{ needs.config.outputs.python }}
      suite: ${{ matrix.suite }}
      scenario: ${{ matrix.scenario }}
      dt: ${{ inputs.dt }}
      mode: ${{ inputs.mode }}
      model: ${{ inputs.model }}

  linux-microbench:
    name: linux-microbench
    needs: [config, linux-build]
    # Temporarily disabled; re-enable with: needs.config.outputs.run_microbench == 'true'
    if: false
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/_linux_op_benchmark.yml
    with:
      runner: ${{ needs.config.outputs.runner_performance }}
      pytorch: ${{ needs.config.outputs.pytorch }}
      python: ${{ needs.config.outputs.python }}

  windows-build:
    name: windows-build
    needs: config
    if: ${{ needs.config.outputs.run_windows == 'true' }}
    secrets: inherit
    uses: ./.github/workflows/_windows_build.yml
    with:
      runner: windows-build
      pytorch: ${{ needs.config.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.config.outputs.torch_xpu_ops }}
      triton: ${{ needs.config.outputs.triton }}
      python: ${{ needs.config.outputs.python }}

  windows-ut:
    name: windows-ut
    needs: [config, windows-build]
    secrets: inherit
    uses: ./.github/workflows/_windows_ut.yml
    with:
      runner: windows-test
      ut: 'op_extended,test_xpu,op_ut'
      pytorch: ${{ needs.config.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.config.outputs.torch_xpu_ops }}
      python: ${{ needs.config.outputs.python }}

  ut-report:
    name: ut-report
    needs: [linux-ut, windows-ut]
    # run when at least one UT job finished with success or failure
    if: >-
      ${{ !cancelled()
      && (!endsWith(needs.linux-ut.result, 'ed') || !endsWith(needs.windows-ut.result, 'ed')) }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_ut_report.yml

  ut-auto-issue:
    name: ut-auto-issue
    needs: [config, linux-ut, ut-report]
    # Not success(): the UT job fails whenever there are new failures, which is
    # precisely when this needs to run.
    if: >-
      ${{ !cancelled()
      && needs.config.outputs.run_ut == 'true'
      && needs.config.outputs.pytorch != 'nightly_wheel'
      && (github.event_name == 'schedule' || inputs.ut_auto_issue) }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/_ut_auto_issue.yml
    with:
      run_id: ${{ github.run_id }}
      test_type: ${{ needs.config.outputs.test_type }}
      # Off unless the repo variable is set to 'true', so filing can be stopped
      # without a PR. Never on for on-demand runs: their torch commit is
      # arbitrary, so the baseline comparison means nothing.
      create_issues: ${{ github.event_name == 'schedule' && vars.UT_AUTO_ISSUE_ENABLED == 'true' }}

  linux-e2e-summary:
    name: linux-e2e-summary
    needs: [config, linux-e2e]
    if: ${{ !cancelled() && !endsWith(needs.linux-e2e.result, 'ed') }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_e2e_summary.yml
    with:
      test_type: ${{ needs.config.outputs.test_type }}
