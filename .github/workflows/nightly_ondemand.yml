name: Nightly-OnDemand Tests

on:
  schedule:
    # GMT+8 21:00 every workday
    - cron: '10 13 * * 0-4' # build from source
    - cron: '30 13 * * 0-4' # nightly wheel
    # GMT+8 00:00 Saturday
    - cron: '10 16 * * 5' # build from source
    - cron: '30 16 * * 5' # nightly wheel
  workflow_dispatch:
    inputs:
      pytorch:
        type: string
        default: 'main'
        description: Pytorch version, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        type: string
        default: ''
        description: Torch-xpu-ops by default is the run triggered branch, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      triton:
        type: string
        default: ''
        description: Triton by default is pinned by pytorch, or 'commit/branch', or 'repo@commit/repo@branch'
      python:
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.json
      ut:
        type: string
        default: ''
        description: UT scope. 'op_regression,op_extended,op_ut,skipped_ut,xpu_profiling,torch_xpu,op_regression_dev1,xpu_distributed,upstream_distributed,upstream_inductor,upstream_default,microbench,windows'. Delimiter is comma
      suite:
        type: string
        default: ''
        description: Dynamo benchmarks test suite. 'huggingface,timm_models,torchbench'. Delimiter is comma
      dt:
        type: string
        default: ''
        description: Data precision of the test. 'float32,bfloat16,float16,amp_bf16,amp_fp16,int8'. Delimiter is comma
      mode:
        type: string
        default: ''
        description: Test mode. 'inference,training'. Delimiter is comma
      scenario:
        type: string
        default: ''
        description: Test scenario. 'accuracy,performance'. Delimiter is comma
      model:
        type: string
        default: ''
        description: Model. Will only run this one mode if set
      ut_auto_issue:
        type: boolean
        default: false
        description: Analyse this run's UT failures. Evidence only - an on-demand run files no issues
      microbench_base:
        type: string
        default: 'nightly'
        description: "Microbench (ut=microbench). 'nightly': simulate a nightly (state not published, no issues); a commit/branch: A/B of the B wheel against it; 'none': A/A with the B wheel"
      microbench_cases:
        type: string
        default: ''
        description: "Microbench cases: core, all, pr (PR-tier), or comma separated op names. Empty: all for 'nightly', core otherwise"
      microbench_reference_run:
        type: string
        default: ''
        description: "Microbench: read the reference state of this run id (test states of on-demand runs)"
      microbench_prev_run:
        type: string
        default: ''
        description: "Microbench nightly: use the wheel of this run id as the previous nightly P (default: the latest scheduled main run)"

permissions: read-all

run-name: ${{ (contains(github.event.schedule, '13') && 'Nightly') || (contains(github.event.schedule, '16') && 'Weekly') || 'On-demand' }} / ${{ (contains(github.event.schedule, '10') && 'Build-from-source') || (contains(github.event.schedule, '30') && 'Nightly-wheel') || inputs.pytorch }}

jobs:
  Conditions-Filter:
    name: conditions-filter
    if: ${{ github.repository_owner == 'intel' || github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      # Test type, (build or wheel)-(nightly, weekly or ondemand)
      test_type: ${{ steps.inputs-check.outputs.test_type }}
      pytorch: ${{ steps.inputs-check.outputs.pytorch }}
      torch_xpu_ops: ${{ steps.inputs-check.outputs.torch_xpu_ops }}
      ut: ${{ steps.inputs-check.outputs.ut }}
      suite: ${{ steps.inputs-check.outputs.suite }}
      scenario: ${{ steps.inputs-check.outputs.scenario }}
      triton: ${{ steps.inputs-check.outputs.triton }}
      python: ${{ steps.inputs-check.outputs.python }}
      microbench_flow: ${{ steps.inputs-check.outputs.microbench_flow }}
      microbench_pytorch_sha: ${{ steps.microbench-sha.outputs.pytorch_sha }}
      microbench_xpu_ops_sha: ${{ steps.microbench-sha.outputs.xpu_ops_sha }}
      microbench_xpu_ops_ref: ${{ steps.microbench-sha.outputs.xpu_ops_ref }}
      microbench_xpu_ops_repo: ${{ steps.microbench-sha.outputs.xpu_ops_repo }}
      microbench_base_sha: ${{ steps.microbench-sha.outputs.base_sha }}
      microbench_base_ref: ${{ steps.microbench-sha.outputs.base_ref }}
    steps:
      - name: Inputs check
        id: inputs-check
        run: |
          if [ "${{ github.event_name }}" == "schedule" ];then
            if [ "${{ github.event.schedule }}" == "10 13 * * 0-4" ];then
              test_type="build-nightly"
              pytorch="main"
              torch_xpu_ops="main"
            elif [ "${{ github.event.schedule }}" == "30 13 * * 0-4" ];then
              test_type="wheel-nightly"
              pytorch="nightly_wheel"
              torch_xpu_ops="pinned"
            elif [ "${{ github.event.schedule }}" == "10 16 * * 5" ];then
              test_type="build-weekly"
              pytorch="main"
              torch_xpu_ops="main"
            elif [ "${{ github.event.schedule }}" == "30 16 * * 5" ];then
              test_type="wheel-weekly"
              pytorch="nightly_wheel"
              torch_xpu_ops="pinned"
            else
              echo "No such scheduler: ${{ github.event.schedule }}"
              exit 1
            fi
            ut='["basic","op_ut","skipped_ut","xpu_profiling","xpu_distributed"]'
            suite='["huggingface","timm_models","torchbench"]'
            # Weekly also runs the upstream UT scopes
            if [[ "${test_type}" == *"-weekly" ]];then
              ut='["basic","op_ut","skipped_ut","xpu_profiling","xpu_distributed","upstream_distributed","upstream_inductor","upstream_default"]'
            fi
            scenario='["accuracy","performance"]'
            triton=''
            python=''
            # microbench needs a source build (previous nightly wheel vs this one)
            microbench=$([[ "${test_type}" == build-* ]] && echo true || echo false)
          else
            pytorch="${{ inputs.pytorch }}"
            if [ -z ${{ inputs.torch_xpu_ops }} ];then
              torch_xpu_ops="${{ github.ref_name }}"
            else
              torch_xpu_ops="${{ inputs.torch_xpu_ops }}"
            fi
            if [[ "${{ inputs.pytorch }}" == *"_wheel" ]];then
              test_type="wheel-ondemand"
            else
              test_type="build-ondemand"
            fi
            ut="$(echo ${{ inputs.ut }} |sed -E 's/(microbench,|,microbench)//g;s/(,windows|windows,)//g;s/,/","/g;s/^/["/;s/$/"]/')"
            suite="$(echo ${{ inputs.suite }} |sed 's/,/","/g;s/^/["/;s/$/"]/')"
            if [ -n "${{ inputs.scenario }}" ];then
              scenario="$(echo ${{ inputs.scenario }} |sed 's/,/","/g;s/^/["/;s/$/"]/')"
            else
              scenario='["accuracy","performance"]'
            fi
            triton="${{ inputs.triton }}"
            python="${{ inputs.python }}"
            microbench=$([[ ",${{ inputs.ut }}," == *",microbench,"* && "${{ inputs.pytorch }}" != *"_wheel" ]] && echo true || echo false)
          fi
          # microbench flow: nightly | ab | aa, empty without microbench
          microbench_flow=""
          if [ "${microbench}" == "true" ]; then
            case "${{ github.event_name == 'schedule' && 'nightly' || inputs.microbench_base }}" in
              nightly|"") microbench_flow=nightly ;;
              none) microbench_flow=aa ;;
              *) microbench_flow=ab ;;
            esac
          fi
          echo "test_type=${test_type}" >> ${GITHUB_OUTPUT}
          echo "pytorch=${pytorch}" >> ${GITHUB_OUTPUT}
          echo "torch_xpu_ops=${torch_xpu_ops}" >> ${GITHUB_OUTPUT}
          echo "ut=${ut}" >> ${GITHUB_OUTPUT}
          echo "suite=${suite}" >> ${GITHUB_OUTPUT}
          echo "scenario=${scenario}" >> ${GITHUB_OUTPUT}
          echo "triton=${triton}" >> ${GITHUB_OUTPUT}
          echo "python=${python}" >> ${GITHUB_OUTPUT}
          echo "microbench_flow=${microbench_flow}" >> ${GITHUB_OUTPUT}
      - name: Resolve PyTorch and xpu-ops commits for microbench
        id: microbench-sha
        if: ${{ steps.inputs-check.outputs.microbench_flow != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolved once to full SHAs: linux-build and microbench-build-base
          # (the on-demand base, or P') build the same PyTorch commit, the
          # benchmark code is checked out at the B commit, and the records
          # hold the exact xpu-ops commits. A ref is a branch, a tag, a full
          # or short SHA, or repo@ref (a fork); the repository is kept.
          resolve() {  # ref, default repo URL -> "<repo URL> <sha>"
            local REF="$1" REPO="$2" SHA=""
            if [[ "$REF" == *"https://"* ]]; then REPO="${REF%@*}"; REF="${REF##*@}"; fi
            REPO="${REPO%.git}"
            if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              SHA="$REF"
            elif [[ "$REPO" == https://github.com/* ]]; then
              SHA=$(gh api -H "Accept: application/vnd.github.sha" "repos/${REPO#https://github.com/}/commits/${REF}" 2>/dev/null || true)
            fi
            if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              SHA=$(git ls-remote "$REPO" "refs/heads/$REF" "refs/tags/$REF" | head -n 1 | cut -f1)
            fi
            if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::cannot resolve '$1' to a commit of ${REPO}" >&2
              return 1
            fi
            echo "$REPO $SHA"
          }
          OUT=$(resolve "${{ steps.inputs-check.outputs.pytorch }}" https://github.com/pytorch/pytorch)
          echo "pytorch_sha=${OUT#* }" >> "${GITHUB_OUTPUT}"
          XPU_REPO="https://github.com/${{ github.repository }}"
          XPU="${{ steps.inputs-check.outputs.torch_xpu_ops }}"
          if [ "$XPU" != "pinned" ]; then
            OUT=$(resolve "$XPU" "$XPU_REPO")
            XPU_REPO="${OUT% *}"
            XPU_SHA="${OUT#* }"
            echo "xpu_ops_sha=${XPU_SHA}" >> "${GITHUB_OUTPUT}"
            # repo@sha: linux-build clones the repository of the ref (a fork too)
            echo "xpu_ops_ref=${XPU_REPO}@${XPU_SHA}" >> "${GITHUB_OUTPUT}"
            # owner/name: repository of the benchmark code checkout
            if [[ "$XPU_REPO" == https://github.com/* ]]; then
              echo "xpu_ops_repo=${XPU_REPO#https://github.com/}" >> "${GITHUB_OUTPUT}"
            fi
          fi
          if [ "${{ steps.inputs-check.outputs.microbench_flow }}" == "ab" ]; then
            # the base defaults to the repository of the B commit
            OUT=$(resolve "${{ inputs.microbench_base }}" "$XPU_REPO")
            echo "base_sha=${OUT#* }" >> "${GITHUB_OUTPUT}"
            echo "base_ref=${OUT% *}@${OUT#* }" >> "${GITHUB_OUTPUT}"
          fi

  Linux-Nightly-Ondemand-Build:
    needs: [Conditions-Filter]
    name: linux-build
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build: [build]
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      pytorch_sha: ${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}
      torch_xpu_ops: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_ref || needs.Conditions-Filter.outputs.torch_xpu_ops }}
      triton: ${{ needs.Conditions-Filter.outputs.triton }}
      python: ${{ needs.Conditions-Filter.outputs.python }}

  Linux-Nightly-Ondemand-UT-Tests:
    name: linux-ut
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Build]
    if: ${{ github.event_name == 'schedule' || contains(inputs.ut, 'p') }}
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: ${{ fromJSON(needs.Conditions-Filter.outputs.ut) }}
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: ${{ (matrix.ut_name == 'xpu_distributed' || matrix.ut_name == 'upstream_distributed') && 'distributed' || 'bmg-test' }}
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.Conditions-Filter.outputs.torch_xpu_ops }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      ut: ${{ matrix.ut_name }}

  Linux-Nightly-Ondemand-UT-Auto-Issue:
    name: linux-ut-auto-issue
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-UT-Tests]
    # Not success(): the UT job fails whenever there are new failures, which is
    # precisely when this needs to run.
    # `contains(inputs.ut, 'p')` mirrors the UT job's own gate: with no UT job
    # there are no artifacts to analyse.
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'schedule'
              || (inputs.ut_auto_issue && contains(inputs.ut, 'p')))
          && needs.Conditions-Filter.outputs.pytorch != 'nightly_wheel' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/_ut_auto_issue.yml
    with:
      run_id: ${{ github.run_id }}
      test_type: ${{ needs.Conditions-Filter.outputs.test_type }}
      # Off unless the repo variable is set to 'true'. Kept as a variable rather
      # than hardcoded so filing can be stopped without merging a PR. Never on
      # for an on-demand run: its torch commit is arbitrary, so the baseline
      # comparison behind `regression` and `new_case_failure` means nothing.
      create_issues: ${{ github.event_name == 'schedule' && vars.UT_AUTO_ISSUE_ENABLED == 'true' }}

  Linux-Nightly-Ondemand-E2E-Tests:
    name: linux-e2e
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Build]
    if: ${{ github.event_name == 'schedule' || contains(inputs.suite, 'e') }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.Conditions-Filter.outputs.suite) }}
        scenario: ${{ fromJSON(needs.Conditions-Filter.outputs.scenario) }}
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: ${{ matrix.scenario == 'performance' && 'pvc-1550' || 'pvc' }}
      test_type: ${{ needs.Conditions-Filter.outputs.test_type }}
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      suite: ${{ matrix.suite }}
      dt: ${{ github.event_name == 'schedule' && '' || inputs.dt }}
      mode: ${{ github.event_name == 'schedule' && '' || inputs.mode }}
      scenario: ${{ matrix.scenario }}
      model: ${{ github.event_name == 'schedule' && '' || inputs.model }}
  Linux-Nightly-Ondemand-E2E-Tests-Summary:
    name: linux-e2e
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-E2E-Tests]
    if: ${{ !cancelled() && !endsWith(needs.Linux-Nightly-Ondemand-E2E-Tests.result, 'ed') }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_e2e_summary.yml
    with:
      test_type: ${{ needs.Conditions-Filter.outputs.test_type }}

  # Microbench. Nightly: every case of this
  # nightly wheel N (sharded), compared with the reference data of earlier
  # nightlies; suspects are rechecked against the previous nightly wheel P;
  # confirmed regressions with candidate commits are attributed with P'
  # (P's xpu-ops built with N's PyTorch); the check job appends the night to
  # the reference state and the auto-issue job files issues. On demand: a
  # nightly simulation, an A/B against a commit or an A/A (microbench_base).
  Linux-Microbench-Select:
    name: microbench-select
    needs: [Conditions-Filter]
    if: ${{ needs.Conditions-Filter.outputs.microbench_flow != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.select.outputs.shards }}
      mode_label: ${{ steps.select.outputs.mode_label }}
    env:
      FLOW: ${{ needs.Conditions-Filter.outputs.microbench_flow }}
      B_SHA: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_sha }}
      BASE_SHA: ${{ needs.Conditions-Filter.outputs.microbench_base_sha }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Setup python
        uses: ./.github/actions/setup-python
        with:
          python: ${{ needs.Conditions-Filter.outputs.python }}
      - name: Install dependencies
        run: uv pip install pyyaml numpy
      - name: Select cases
        id: select
        run: |
          cd test
          SPEC="${{ github.event_name == 'schedule' && 'all' || inputs.microbench_cases }}"
          [ -z "$SPEC" ] && SPEC=$([ "$FLOW" == "nightly" ] && echo all || echo core)
          ARGS=(--flow "$FLOW" --spec "$SPEC" --out ../selection.json --summary "${GITHUB_STEP_SUMMARY}"
                --pytorch-sha "${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}" --head "${B_SHA:-HEAD}"
                --shards "$([ "$FLOW" == "nightly" ] && echo "${{ vars.MICROBENCH_NIGHTLY_SHARDS || 4 }}" || echo 1)")
          [ -n "$BASE_SHA" ] && ARGS+=(--base "$BASE_SHA")
          python -m microbench select "${ARGS[@]}"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            LABEL="ondemand ${FLOW}: B=${{ needs.Conditions-Filter.outputs.torch_xpu_ops }} (${B_SHA:0:12})"
            [ -n "$BASE_SHA" ] && LABEL="$LABEL, base=${{ inputs.microbench_base }} (${BASE_SHA:0:12})"
            echo "mode_label=${LABEL}, cases=${SPEC}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload selection
        uses: actions/upload-artifact@v7
        with:
          name: microbench-selection-${{ github.run_id }}
          path: selection.json
          overwrite: true
          retention-days: 90

  # microbench / microbench-run (nightly-vs-reference), one job per shard
  Linux-Microbench-Nightly:
    name: microbench
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Build, Linux-Microbench-Select]
    if: ${{ needs.Conditions-Filter.outputs.microbench_flow == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.Linux-Microbench-Select.outputs.shards) }}
    permissions:
      actions: read
      contents: read
    secrets: inherit
    uses: ./.github/workflows/_linux_microbench.yml
    with:
      scope: nightly-vs-reference
      python: ${{ needs.Conditions-Filter.outputs.python }}
      selection_artifact: microbench-selection-${{ github.run_id }}
      artifact_id: ${{ github.run_id }}
      pytorch_sha: ${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}
      head_sha: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_sha }}
      head_repo: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_repo }}
      shard: ${{ matrix.shard }}
      shards: ${{ strategy.job-total }}
      reference_run: ${{ inputs.microbench_reference_run }}
      prev_run_id: ${{ inputs.microbench_prev_run }}
      coverage: true
      # measurement and A/A stop after 9 h; the recheck has its own 2 h
      # (ci-run --recheck-budget-min)
      budget_min: '540'

  # Base wheel, torch only: the on-demand base or P' (the previous nightly's
  # xpu-ops with this nightly's PyTorch)
  Linux-Microbench-Build-Base:
    name: microbench-build-base
    needs: [Conditions-Filter, Linux-Microbench-Nightly]
    if: >-
      ${{ !cancelled() && (needs.Conditions-Filter.outputs.microbench_flow == 'ab' ||
      needs.Linux-Microbench-Nightly.outputs.need_attribution == 'true') }}
    secrets: inherit
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      pytorch_sha: ${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}
      torch_xpu_ops: ${{ needs.Linux-Microbench-Nightly.outputs.prev_xpu_ops_sha || needs.Conditions-Filter.outputs.microbench_base_ref }}
      triton: ${{ needs.Conditions-Filter.outputs.triton }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      torch_only: true
      category: baseline
      # not Torch-XPU-Wheel-*: the test jobs of this run must not install it
      wheel_artifact: Microbench-Base-Wheel

  # microbench / microbench-run (pr-vs-base | ondemand | nightly-xpu-ops-vs-pytorch)
  Linux-Microbench-Compare:
    name: microbench
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Build, Linux-Microbench-Select, Linux-Microbench-Nightly, Linux-Microbench-Build-Base]
    if: >-
      ${{ !cancelled() &&
      needs.Linux-Nightly-Ondemand-Build.result == 'success' &&
      needs.Linux-Microbench-Select.result == 'success' &&
      (needs.Linux-Microbench-Build-Base.result == 'success' || needs.Conditions-Filter.outputs.microbench_flow == 'aa') }}
    permissions:
      actions: read
      contents: read
    secrets: inherit
    uses: ./.github/workflows/_linux_microbench.yml
    with:
      scope: ${{ fromJSON('{"nightly":"nightly-xpu-ops-vs-pytorch","ab":"pr-vs-base","aa":"ondemand"}')[needs.Conditions-Filter.outputs.microbench_flow] }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      selection_artifact: microbench-selection-${{ github.run_id }}
      artifact_id: ${{ github.run_id }}
      pytorch_sha: ${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}
      head_sha: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_sha }}
      head_repo: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_repo }}
      base_sha: ${{ needs.Conditions-Filter.outputs.microbench_base_sha }}
      prev_run_id: ${{ needs.Linux-Microbench-Nightly.outputs.prev_run_id }}
      budget_min: '120'

  # microbench / microbench-check (nightly | ondemand)
  Linux-Microbench-Check:
    name: microbench
    needs: [Conditions-Filter, Linux-Microbench-Select, Linux-Microbench-Nightly, Linux-Microbench-Compare]
    # nightly: merge whatever shards finished (a failed shard only loses its
    # cases for tonight), with or without attribution
    if: >-
      ${{ !cancelled() && (needs.Linux-Microbench-Compare.result == 'success' ||
      (needs.Conditions-Filter.outputs.microbench_flow == 'nightly' && needs.Linux-Microbench-Nightly.result != 'skipped')) }}
    permissions:
      actions: read
      contents: read
    secrets: inherit
    uses: ./.github/workflows/_linux_microbench_check.yml
    with:
      scope: ${{ needs.Conditions-Filter.outputs.microbench_flow == 'nightly' && 'nightly' || 'ondemand' }}
      artifact_id: ${{ github.run_id }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      head_sha: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_sha }}
      head_repo: ${{ needs.Conditions-Filter.outputs.microbench_xpu_ops_repo }}
      base_sha: ${{ needs.Conditions-Filter.outputs.microbench_base_sha }}
      mode_label: ${{ needs.Linux-Microbench-Select.outputs.mode_label }}
      test_type: ${{ needs.Conditions-Filter.outputs.test_type }}
      # only scheduled main runs, or a maintainer's rebuild dispatch
      # on main (MICROBENCH_REFERENCE_WRITE_DISPATCH), publish the state
      write_state: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (vars.MICROBENCH_REFERENCE_WRITE_DISPATCH == 'true' && (inputs.microbench_base || 'nightly') == 'nightly')) }}
      reference_run: ${{ inputs.microbench_reference_run }}

  # Issues for confirmed nightly regressions
  Linux-Microbench-Auto-Issue:
    name: microbench-auto-issue
    needs: [Linux-Microbench-Check]
    if: ${{ !cancelled() && needs.Linux-Microbench-Check.outputs.has_regressions == 'true' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/_microbench_auto_issue.yml
    with:
      run_id: ${{ github.run_id }}
      # Off unless the repo variable is 'true'; never for on-demand runs
      create_issues: ${{ github.event_name == 'schedule' && vars.MICROBENCH_AUTO_ISSUE_ENABLED == 'true' }}

  Windows-Nightly-Ondemand-Build:
    name: windows-build
    needs: [Conditions-Filter]
    if: ${{ github.event_name == 'schedule' || contains(inputs.ut, 'windows') }}
    secrets: inherit
    uses: ./.github/workflows/_windows_build.yml
    with:
      python: ${{ needs.Conditions-Filter.outputs.python }}
      runner: windows-build
