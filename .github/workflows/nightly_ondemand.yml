name: Nightly-OnDemand Tests

on:
  workflow_dispatch:
    inputs:
      omix_version:
        type: choice
        options:
          - '0.6.0'
          - '0.5.0'
        default: '0.6.0'
        description: 'OMIX version under test (0.6.0 from run 45097895764, 0.5.0 from run 45097842215)'
      runner:
        type: string
        default: 'bmg-b60'
        description: 'Linux test runner label for UT and E2E (e.g. bmg-b60, pvc-1550)'
      pytorch:
        type: string
        default: 'f571bf6d01e3167d21de5ed3de34be52a47a9d0a'
        description: Pytorch commit matching prebuilt OMIX wheel
      torch_xpu_ops:
        type: string
        default: 'a6aeb5ecf35'
        description: Torch-xpu-ops commit matching prebuilt OMIX wheel
      triton:
        type: string
        default: 'nightly_wheel'
        description: Triton-XPU nightly wheel
      python:
        type: string
        default: '3.12.15'
        description: Python version matching cp312 OMIX wheel
      ut:
        type: string
        default: 'basic,op_ut,skipped_ut,xpu_profiling,xpu_distributed,upstream_distributed,upstream_inductor,upstream_default'
        description: Weekly UT scope
      suite:
        type: string
        default: 'huggingface,timm_models,torchbench'
        description: Dynamo benchmarks test suite
      dt:
        type: string
        default: ''
        description: Data precision filter (empty runs full weekly config)
      mode:
        type: string
        default: ''
        description: Test mode filter (empty runs full weekly config)
      scenario:
        type: string
        default: 'accuracy,performance'
        description: Test scenario
      model:
        type: string
        default: ''
        description: Model filter (empty runs full weekly scope)
      ut_auto_issue:
        type: boolean
        default: false
        description: Analyse this run's UT failures (evidence only, never files issues)

permissions: read-all

run-name: Acceptance / OMIX ${{ inputs.omix_version }} (${{ inputs.runner }}) / Weekly

jobs:
  config:
    name: config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test_type: ${{ steps.scope.outputs.test_type }}
      omix_version: ${{ steps.scope.outputs.omix_version }}
      wheel_run_id: ${{ steps.scope.outputs.wheel_run_id }}
      wheel_artifact: ${{ steps.scope.outputs.wheel_artifact }}
      rhel_omix_repo: ${{ steps.scope.outputs.rhel_omix_repo }}
      expected_sycl_ver: ${{ steps.scope.outputs.expected_sycl_ver }}
      pytorch: ${{ steps.scope.outputs.pytorch }}
      torch_xpu_ops: ${{ steps.scope.outputs.torch_xpu_ops }}
      triton: ${{ steps.scope.outputs.triton }}
      python: ${{ steps.scope.outputs.python }}
      ut: ${{ steps.scope.outputs.ut }}
      suite: ${{ steps.scope.outputs.suite }}
      scenario: ${{ steps.scope.outputs.scenario }}
      run_ut: ${{ steps.scope.outputs.run_ut }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      runner_ut: ${{ steps.scope.outputs.runner_label }}
      image_ut: ${{ steps.scope.outputs.container_image }}
      runner_accuracy: ${{ steps.scope.outputs.runner_label }}
      image_accuracy: ${{ steps.scope.outputs.container_image }}
      runner_performance: ${{ steps.scope.outputs.runner_label }}
      image_performance: ${{ steps.scope.outputs.container_image }}
    steps:
      - name: Resolve OMIX acceptance config and weekly scope
        id: scope
        env:
          IN_OMIX: ${{ inputs.omix_version }}
          IN_RUNNER: ${{ inputs.runner }}
          IN_PYTORCH: ${{ inputs.pytorch }}
          IN_TORCH_XPU_OPS: ${{ inputs.torch_xpu_ops }}
          IN_TRITON: ${{ inputs.triton }}
          IN_PYTHON: ${{ inputs.python }}
          IN_UT: ${{ inputs.ut }}
          IN_SUITE: ${{ inputs.suite }}
          IN_SCENARIO: ${{ inputs.scenario }}
        run: |
          to_json() { tr ',' '\n' <<< "$1" | { grep -vxE "${2:-}|" || true; } | jq -Rnc '[inputs]'; }

          case "${IN_OMIX}" in
            0.6|0.6.0)
              omix_version="0.6.0"
              wheel_run_id="45097895764"
              wheel_artifact="Torch-XPU-Wheel-a4e2d2f8c4ce73a8bc375cb49c655f98ff5fc4ca-45097895764-1"
              rhel_omix_repo="https://laurentides.igk.intel.com/repositories/rhel/8.10/testing-intel-omix/20.0/unified/intel-gpu-8.10.repo"
              expected_sycl_ver="20260300"
              if [[ "${IN_RUNNER}" == *pvc* ]]; then
                container_image="ubuntu:24.04"
              else
                container_image="ubuntu:26.04"
              fi
              ;;
            0.5|0.5.0)
              omix_version="0.5.0"
              wheel_run_id="45097842215"
              wheel_artifact="Torch-XPU-Wheel-a4e2d2f8c4ce73a8bc375cb49c655f98ff5fc4ca-45097842215-1"
              rhel_omix_repo="https://repositories.intel.com/gpu/rhel/8.10/intel-omix/0.5/unified/intel-gpu-8.10.repo"
              expected_sycl_ver="20260200"
              if [[ "${IN_RUNNER}" == *pvc* ]]; then
                container_image="intel/omix:0.5.0-devel-ubuntu24.04"
              else
                container_image="intel/omix:0.5.0-devel-ubuntu26.04"
              fi
              ;;
            *)
              echo "Unsupported omix_version: ${IN_OMIX}" >&2
              exit 1
              ;;
          esac

          ut="$(to_json "${IN_UT}" 'microbench|windows')"
          suite="$(to_json "${IN_SUITE}")"
          scenario="$(to_json "${IN_SCENARIO:-accuracy,performance}")"

          {
            echo "test_type=build-ondemand"
            echo "omix_version=${omix_version}"
            echo "wheel_run_id=${wheel_run_id}"
            echo "wheel_artifact=${wheel_artifact}"
            echo "rhel_omix_repo=${rhel_omix_repo}"
            echo "expected_sycl_ver=${expected_sycl_ver}"
            echo "runner_label=${IN_RUNNER}"
            echo "container_image=${container_image}"
            echo "pytorch=${IN_PYTORCH}"
            echo "torch_xpu_ops=${IN_TORCH_XPU_OPS}"
            echo "triton=${IN_TRITON}"
            echo "python=${IN_PYTHON}"
            echo "ut=${ut}"
            echo "suite=${suite}"
            echo "scenario=${scenario}"
            echo "run_ut=$([ "${ut}" != "[]" ] && echo true || echo false)"
            echo "run_e2e=$([ "${suite}" != "[]" ] && echo true || echo false)"
          } | tee -a "${GITHUB_OUTPUT}"

  linux-build:
    name: linux-build
    needs: config
    secrets:
      WHEEL_DOWNLOAD_TOKEN: ${{ secrets.WHEEL_DOWNLOAD_TOKEN }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        build: [build]
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      omix_version: ${{ needs.config.outputs.omix_version }}
      wheel_run_id: ${{ needs.config.outputs.wheel_run_id }}
      wheel_artifact: ${{ needs.config.outputs.wheel_artifact }}
      rhel_omix_repo: ${{ needs.config.outputs.rhel_omix_repo }}
      expected_sycl_ver: ${{ needs.config.outputs.expected_sycl_ver }}
      pytorch: ${{ needs.config.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.config.outputs.torch_xpu_ops }}
      triton: ${{ needs.config.outputs.triton }}
      python: ${{ needs.config.outputs.python }}

  linux-ut:
    name: linux-ut
    needs: [config, linux-build]
    if: ${{ needs.config.outputs.run_ut == 'true' }}
    secrets:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: ${{ fromJSON(needs.config.outputs.ut) }}
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: ${{ needs.config.outputs.runner_ut }}
      image: ${{ needs.config.outputs.image_ut }}
      omix_version: ${{ needs.config.outputs.omix_version }}
      expected_sycl_ver: ${{ needs.config.outputs.expected_sycl_ver }}
      pytorch: ${{ needs.config.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.config.outputs.torch_xpu_ops }}
      python: ${{ needs.config.outputs.python }}
      ut: ${{ matrix.ut_name }}

  linux-e2e:
    name: linux-e2e
    needs: [config, linux-build]
    if: ${{ needs.config.outputs.run_e2e == 'true' }}
    secrets:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.config.outputs.suite) }}
        scenario: ${{ fromJSON(needs.config.outputs.scenario) }}
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: ${{ needs.config.outputs[format('runner_{0}', matrix.scenario)] }}
      image: ${{ needs.config.outputs[format('image_{0}', matrix.scenario)] }}
      omix_version: ${{ needs.config.outputs.omix_version }}
      expected_sycl_ver: ${{ needs.config.outputs.expected_sycl_ver }}
      test_type: ${{ needs.config.outputs.test_type }}
      pytorch: ${{ needs.config.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.config.outputs.torch_xpu_ops }}
      python: ${{ needs.config.outputs.python }}
      suite: ${{ matrix.suite }}
      scenario: ${{ matrix.scenario }}
      dt: ${{ inputs.dt }}
      mode: ${{ inputs.mode }}
      model: ${{ inputs.model }}

  ut-report:
    name: ut-report
    needs: [linux-ut]
    if: ${{ !cancelled() && !endsWith(needs.linux-ut.result, 'ed') }}
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_ut_report.yml

  linux-e2e-summary:
    name: linux-e2e-summary
    needs: [config, linux-e2e]
    if: ${{ !cancelled() && !endsWith(needs.linux-e2e.result, 'ed') }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_e2e_summary.yml
    with:
      test_type: ${{ needs.config.outputs.test_type }}
