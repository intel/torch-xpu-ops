name: Nightly-OnDemand Tests

on:
  schedule:
    # GMT+8 21:00 every workday
    - cron: '10 13 * * 0-4' # build from source
    - cron: '30 13 * * 0-4' # nightly wheel
    # GMT+8 00:00 Saturday
    - cron: '10 16 * * 5' # build from source
    - cron: '30 16 * * 5' # nightly wheel
  workflow_dispatch:
    inputs:
      pytorch:
        type: string
        default: 'main'
        description: Pytorch version, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        type: string
        default: ''
        description: Torch-xpu-ops by default is the run triggered branch, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      triton:
        type: string
        default: ''
        description: Triton by default is pinned by pytorch, or 'commit/branch', or 'repo@commit/repo@branch'
      python:
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.json
      ut:
        type: string
        default: ''
        description: UT scope. 'op_regression,op_extended,op_ut,skipped_ut,xpu_profiling,torch_xpu,op_regression_dev1,xpu_distributed,upstream_distributed,upstream_inductor,upstream_default,microbench,windows'. Delimiter is comma
      suite:
        type: string
        default: ''
        description: Dynamo benchmarks test suite. 'huggingface,timm_models,torchbench'. Delimiter is comma
      dt:
        type: string
        default: ''
        description: Data precision of the test. 'float32,bfloat16,float16,amp_bf16,amp_fp16,int8'. Delimiter is comma
      mode:
        type: string
        default: ''
        description: Test mode. 'inference,training'. Delimiter is comma
      scenario:
        type: string
        default: ''
        description: Test scenario. 'accuracy,performance'. Delimiter is comma
      model:
        type: string
        default: ''
        description: Model. Will only run this one mode if set
      ut_auto_issue:
        type: boolean
        default: false
        description: Analyse this run's UT failures. Evidence only - an on-demand run files no issues
      microbench_base:
        type: string
        default: ''
        description: "Microbench side A (with ut=microbench). Commit/branch: build it as the base wheel (A/B); 'merge-base': merge-base of torch_xpu_ops and main; empty: A/A with the B wheel"
      microbench_cases:
        type: string
        default: 'selected'
        description: "Microbench cases: selected (from the A..B diff), core, all, pr, or comma separated op names"

permissions: read-all

run-name: ${{ (contains(github.event.schedule, '13') && 'Nightly') || (contains(github.event.schedule, '16') && 'Weekly') || 'On-demand' }} / ${{ (contains(github.event.schedule, '10') && 'Build-from-source') || (contains(github.event.schedule, '30') && 'Nightly-wheel') || inputs.pytorch }}

jobs:
  Conditions-Filter:
    name: conditions-filter
    if: ${{ github.repository_owner == 'intel' || github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      # Test type, (build or wheel)-(nightly, weekly or ondemand)
      test_type: ${{ steps.inputs-check.outputs.test_type }}
      pytorch: ${{ steps.inputs-check.outputs.pytorch }}
      torch_xpu_ops: ${{ steps.inputs-check.outputs.torch_xpu_ops }}
      ut: ${{ steps.inputs-check.outputs.ut }}
      suite: ${{ steps.inputs-check.outputs.suite }}
      scenario: ${{ steps.inputs-check.outputs.scenario }}
      triton: ${{ steps.inputs-check.outputs.triton }}
      python: ${{ steps.inputs-check.outputs.python }}
      microbench: ${{ steps.inputs-check.outputs.microbench }}
      microbench_pytorch_sha: ${{ steps.microbench-sha.outputs.pytorch_sha }}
    steps:
      - name: Inputs check
        id: inputs-check
        run: |
          if [ "${{ github.event_name }}" == "schedule" ];then
            if [ "${{ github.event.schedule }}" == "10 13 * * 0-4" ];then
              test_type="build-nightly"
              pytorch="main"
              torch_xpu_ops="main"
            elif [ "${{ github.event.schedule }}" == "30 13 * * 0-4" ];then
              test_type="wheel-nightly"
              pytorch="nightly_wheel"
              torch_xpu_ops="pinned"
            elif [ "${{ github.event.schedule }}" == "10 16 * * 5" ];then
              test_type="build-weekly"
              pytorch="main"
              torch_xpu_ops="main"
            elif [ "${{ github.event.schedule }}" == "30 16 * * 5" ];then
              test_type="wheel-weekly"
              pytorch="nightly_wheel"
              torch_xpu_ops="pinned"
            else
              echo "No such scheduler: ${{ github.event.schedule }}"
              exit 1
            fi
            ut='["basic","op_ut","skipped_ut","xpu_profiling","xpu_distributed"]'
            suite='["huggingface","timm_models","torchbench"]'
            # Weekly also runs the upstream UT scopes
            if [[ "${test_type}" == *"-weekly" ]];then
              ut='["basic","op_ut","skipped_ut","xpu_profiling","xpu_distributed","upstream_distributed","upstream_inductor","upstream_default"]'
            fi
            scenario='["accuracy","performance"]'
            triton=''
            python=''
            # microbench needs a source build (previous nightly wheel vs this one)
            microbench=$([[ "${test_type}" == build-* ]] && echo true || echo false)
          else
            pytorch="${{ inputs.pytorch }}"
            if [ -z ${{ inputs.torch_xpu_ops }} ];then
              torch_xpu_ops="${{ github.ref_name }}"
            else
              torch_xpu_ops="${{ inputs.torch_xpu_ops }}"
            fi
            if [[ "${{ inputs.pytorch }}" == *"_wheel" ]];then
              test_type="wheel-ondemand"
            else
              test_type="build-ondemand"
            fi
            ut="$(echo ${{ inputs.ut }} |sed -E 's/(microbench,|,microbench)//g;s/(,windows|windows,)//g;s/,/","/g;s/^/["/;s/$/"]/')"
            suite="$(echo ${{ inputs.suite }} |sed 's/,/","/g;s/^/["/;s/$/"]/')"
            if [ -n "${{ inputs.scenario }}" ];then
              scenario="$(echo ${{ inputs.scenario }} |sed 's/,/","/g;s/^/["/;s/$/"]/')"
            else
              scenario='["accuracy","performance"]'
            fi
            triton="${{ inputs.triton }}"
            python="${{ inputs.python }}"
            microbench=$([[ ",${{ inputs.ut }}," == *",microbench,"* && "${{ inputs.pytorch }}" != *"_wheel" ]] && echo true || echo false)
          fi
          echo "test_type=${test_type}" >> ${GITHUB_OUTPUT}
          echo "pytorch=${pytorch}" >> ${GITHUB_OUTPUT}
          echo "torch_xpu_ops=${torch_xpu_ops}" >> ${GITHUB_OUTPUT}
          echo "ut=${ut}" >> ${GITHUB_OUTPUT}
          echo "suite=${suite}" >> ${GITHUB_OUTPUT}
          echo "scenario=${scenario}" >> ${GITHUB_OUTPUT}
          echo "triton=${triton}" >> ${GITHUB_OUTPUT}
          echo "python=${python}" >> ${GITHUB_OUTPUT}
          echo "microbench=${microbench}" >> ${GITHUB_OUTPUT}
      - name: Resolve PyTorch SHA for microbench A/B
        id: microbench-sha
        if: ${{ github.event_name != 'schedule' && steps.inputs-check.outputs.microbench == 'true' && inputs.microbench_base != '' }}
        run: |
          # Resolved once: the B build and the microbench base build use the same commit.
          REF="${{ steps.inputs-check.outputs.pytorch }}"
          REPO="https://github.com/pytorch/pytorch.git"
          if [[ "$REF" == *"https://"* ]]; then REPO="${REF%@*}"; REF="${REF##*@}"; fi
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then SHA="$REF"; else
            SHA=$(git ls-remote "$REPO" "refs/heads/$REF" "refs/tags/$REF" | head -n 1 | cut -f1)
          fi
          if [ -z "$SHA" ]; then echo "::error::cannot resolve pytorch $REF"; exit 1; fi
          echo "pytorch_sha=$SHA" >> "${GITHUB_OUTPUT}"

  Linux-Nightly-Ondemand-Build:
    needs: [Conditions-Filter]
    name: linux-build
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build: [build]
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      pytorch_sha: ${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}
      torch_xpu_ops: ${{ needs.Conditions-Filter.outputs.torch_xpu_ops }}
      triton: ${{ needs.Conditions-Filter.outputs.triton }}
      python: ${{ needs.Conditions-Filter.outputs.python }}

  Linux-Nightly-Ondemand-UT-Tests:
    name: linux-ut
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Build]
    if: ${{ github.event_name == 'schedule' || contains(inputs.ut, 'p') }}
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: ${{ fromJSON(needs.Conditions-Filter.outputs.ut) }}
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: ${{ (matrix.ut_name == 'xpu_distributed' || matrix.ut_name == 'upstream_distributed') && 'distributed' || 'bmg-test' }}
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      torch_xpu_ops: ${{ needs.Conditions-Filter.outputs.torch_xpu_ops }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      ut: ${{ matrix.ut_name }}

  Linux-Nightly-Ondemand-UT-Auto-Issue:
    name: linux-ut-auto-issue
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-UT-Tests]
    # Not success(): the UT job fails whenever there are new failures, which is
    # precisely when this needs to run.
    # `contains(inputs.ut, 'p')` mirrors the UT job's own gate: with no UT job
    # there are no artifacts to analyse.
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'schedule'
              || (inputs.ut_auto_issue && contains(inputs.ut, 'p')))
          && needs.Conditions-Filter.outputs.pytorch != 'nightly_wheel' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/_ut_auto_issue.yml
    with:
      run_id: ${{ github.run_id }}
      test_type: ${{ needs.Conditions-Filter.outputs.test_type }}
      # Off unless the repo variable is set to 'true'. Kept as a variable rather
      # than hardcoded so filing can be stopped without merging a PR. Never on
      # for an on-demand run: its torch commit is arbitrary, so the baseline
      # comparison behind `regression` and `new_case_failure` means nothing.
      create_issues: ${{ github.event_name == 'schedule' && vars.UT_AUTO_ISSUE_ENABLED == 'true' }}

  Linux-Nightly-Ondemand-E2E-Tests:
    name: linux-e2e
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Build]
    if: ${{ github.event_name == 'schedule' || contains(inputs.suite, 'e') }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.Conditions-Filter.outputs.suite) }}
        scenario: ${{ fromJSON(needs.Conditions-Filter.outputs.scenario) }}
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: ${{ matrix.scenario == 'performance' && 'pvc-1550' || 'pvc' }}
      test_type: ${{ needs.Conditions-Filter.outputs.test_type }}
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      suite: ${{ matrix.suite }}
      dt: ${{ github.event_name == 'schedule' && '' || inputs.dt }}
      mode: ${{ github.event_name == 'schedule' && '' || inputs.mode }}
      scenario: ${{ matrix.scenario }}
      model: ${{ github.event_name == 'schedule' && '' || inputs.model }}
  Linux-Nightly-Ondemand-E2E-Tests-Summary:
    name: linux-e2e
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-E2E-Tests]
    if: ${{ !cancelled() && !endsWith(needs.Linux-Nightly-Ondemand-E2E-Tests.result, 'ed') }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_e2e_summary.yml
    with:
      test_type: ${{ needs.Conditions-Filter.outputs.test_type }}

  # Microbench (plan 8.7, 11.2): nightly compares the previous nightly wheel
  # (A) with this one (B); on-demand runs A/B or A/A as requested.
  Linux-Nightly-Ondemand-Microbench-Select:
    name: microbench-select
    needs: [Conditions-Filter]
    if: ${{ needs.Conditions-Filter.outputs.microbench == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      need_base: ${{ steps.select.outputs.need_base }}
      base_source: ${{ steps.select.outputs.base_source }}
      base_sha: ${{ steps.refs.outputs.base_sha }}
      b_sha: ${{ steps.refs.outputs.b_sha }}
      mode_label: ${{ steps.select.outputs.mode_label }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup python
        uses: ./.github/actions/setup-python
        with:
          python: ${{ needs.Conditions-Filter.outputs.python }}
      - name: Install dependencies
        run: uv pip install pyyaml numpy
      - name: Resolve A and B commits
        id: refs
        run: |
          B="${{ needs.Conditions-Filter.outputs.torch_xpu_ops }}"
          BASE="${{ github.event_name == 'schedule' && '' || inputs.microbench_base }}"
          B_SHA=""
          if [[ "$B" != *"https://"* && "$B" != "pinned" ]]; then
            git fetch --no-tags origin "$B" && B_SHA=$(git rev-parse FETCH_HEAD)
          fi
          BASE_SHA=""
          if [ "$BASE" == "merge-base" ]; then
            git fetch --no-tags origin main
            BASE_SHA=$(git merge-base origin/main "${B_SHA:-HEAD}")
          elif [ -n "$BASE" ]; then
            git fetch --no-tags origin "$BASE" && BASE_SHA=$(git rev-parse FETCH_HEAD)
          fi
          echo "b_sha=${B_SHA}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Select cases
        id: select
        run: |
          cd test
          if [ "${{ github.event_name }}" == "schedule" ]; then
            python -m microbench select --spec all --need-base --out ../selection.json --summary "${GITHUB_STEP_SUMMARY}" --github-output /dev/null
            echo "need_base=true" >> "${GITHUB_OUTPUT}"
            echo "base_source=previous_nightly" >> "${GITHUB_OUTPUT}"
            echo "mode_label=nightly: previous nightly wheel (A) vs this nightly (B)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          SPEC="${{ inputs.microbench_cases }}"
          BASE_SHA="${{ steps.refs.outputs.base_sha }}"
          B_SHA="${{ steps.refs.outputs.b_sha }}"
          NEED_BASE=$([ -n "$BASE_SHA" ] && echo true || echo false)
          if [ "${SPEC:-selected}" == "selected" ]; then
            if [ -n "$BASE_SHA" ] && [ -n "$B_SHA" ]; then
              python -m microbench select --repo .. --base "$BASE_SHA" --head "$B_SHA" --cards 1 --out ../selection.json --summary "${GITHUB_STEP_SUMMARY}" --github-output /dev/null
            else
              echo "No A..B diff available (no microbench_base); selecting the core set." >> "${GITHUB_STEP_SUMMARY}"
              python -m microbench select --spec core --out ../selection.json --summary "${GITHUB_STEP_SUMMARY}" --github-output /dev/null
            fi
          else
            python -m microbench select --spec "$SPEC" --out ../selection.json --summary "${GITHUB_STEP_SUMMARY}" --github-output /dev/null
          fi
          echo "need_base=${NEED_BASE}" >> "${GITHUB_OUTPUT}"
          echo "base_source=artifact" >> "${GITHUB_OUTPUT}"
          if [ "$NEED_BASE" == "true" ]; then
            LABEL="ondemand A/B: A=${{ inputs.microbench_base }} (${BASE_SHA:0:12}), B=${{ needs.Conditions-Filter.outputs.torch_xpu_ops }}, cases=${SPEC}"
          else
            LABEL="ondemand A/A: B=${{ needs.Conditions-Filter.outputs.torch_xpu_ops }} on both sides, cases=${SPEC}"
          fi
          echo "mode_label=${LABEL}" >> "${GITHUB_OUTPUT}"
      - name: PRs merged with disable_microbench (last 24h)
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          SINCE=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "### PRs merged with disable_microbench since ${SINCE}"
            gh pr list --repo ${{ github.repository }} --state merged --label disable_microbench \
              --search "merged:>=${SINCE}" --json number,title,url --jq '.[] | "- #\(.number) \(.title)"' || true
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload selection
        uses: actions/upload-artifact@v7
        with:
          name: microbench-selection-${{ github.run_id }}
          path: selection.json
          overwrite: true

  Linux-Nightly-Ondemand-Microbench-Build-Base:
    name: microbench-build-base
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Microbench-Select]
    if: ${{ needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.need_base == 'true' && needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.base_source == 'artifact' }}
    secrets: inherit
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
      pytorch_sha: ${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}
      torch_xpu_ops: ${{ needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.base_sha }}
      triton: ${{ needs.Conditions-Filter.outputs.triton }}
      python: ${{ needs.Conditions-Filter.outputs.python }}
      category: baseline

  Linux-Nightly-Ondemand-Microbench:
    name: linux-microbench
    needs: [Conditions-Filter, Linux-Nightly-Ondemand-Build, Linux-Nightly-Ondemand-Microbench-Select, Linux-Nightly-Ondemand-Microbench-Build-Base]
    if: >-
      ${{ !cancelled() &&
      needs.Linux-Nightly-Ondemand-Microbench-Select.result == 'success' &&
      needs.Linux-Nightly-Ondemand-Build.result == 'success' &&
      (needs.Linux-Nightly-Ondemand-Microbench-Build-Base.result == 'success' ||
       needs.Linux-Nightly-Ondemand-Microbench-Build-Base.result == 'skipped') }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    secrets: inherit
    uses: ./.github/workflows/_linux_microbench.yml
    with:
      runner: bmg-test
      python: ${{ needs.Conditions-Filter.outputs.python }}
      mode: ${{ github.event_name == 'schedule' && 'nightly' || 'ondemand' }}
      mode_label: ${{ needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.mode_label }}
      selection_artifact: microbench-selection-${{ github.run_id }}
      need_base: ${{ needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.need_base }}
      base_source: ${{ needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.base_source }}
      pytorch_sha: ${{ needs.Conditions-Filter.outputs.microbench_pytorch_sha }}
      allow_sha_mismatch: ${{ github.event_name == 'schedule' }}
      head_sha: ${{ needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.b_sha }}
      base_sha: ${{ needs.Linux-Nightly-Ondemand-Microbench-Select.outputs.base_sha }}
      budget_min: ${{ github.event_name == 'schedule' && '780' || '120' }}
      coverage: ${{ github.event_name == 'schedule' }}

  Windows-Nightly-Ondemand-Build:
    name: windows-build
    needs: [Conditions-Filter]
    if: ${{ github.event_name == 'schedule' || contains(inputs.ut, 'windows') }}
    secrets: inherit
    uses: ./.github/workflows/_windows_build.yml
    with:
      python: ${{ needs.Conditions-Filter.outputs.python }}
      runner: windows-build
      torch_xpu_ops: ${{ needs.Conditions-Filter.outputs.torch_xpu_ops }}
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}

  Windows-Nightly-Ondemand-UT-Tests:
    name: windows-ut
    needs: [Conditions-Filter, Windows-Nightly-Ondemand-Build]
    if: ${{ github.event_name == 'schedule' || contains(inputs.ut, 'windows') }}
    secrets: inherit
    uses: ./.github/workflows/_windows_ut.yml
    with:
      ut: 'op_extended,test_xpu,op_ut'
      python: ${{ needs.Conditions-Filter.outputs.python }}
      runner: windows-test
      torch_xpu_ops: ${{ needs.Conditions-Filter.outputs.torch_xpu_ops }}
      pytorch: ${{ needs.Conditions-Filter.outputs.pytorch }}
