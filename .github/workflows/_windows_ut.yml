name: Windows Test

on:
  workflow_call:
    inputs:
      pytorch:
        required: false
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        required: false
        type: string
        default: 'pinned'
        description: Torch-xpu-ops defaults to the wheel/source pin, or 'commit/branch', or 'repo@commit/repo@branch'
      ut:
        required: true
        type: string
        description: UT scope, like _linux_ut.yml. `basic` (op_extended, test_xpu, test_cpp_extensions_aot_xpu) or `op_ut`; a single category of basic also works
      python:
        required: false
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.yaml
      runner:
        required: true
        type: string
        description: Runner label
      category:
        type: string
        default: ''
        description: 'Optional artifact tag; also selects known-failure label scope'
      xpu_version:
        required: false
        type: string
        default: '2026.1'
        description: XPU version

permissions: read-all

jobs:
  ut_test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1000
    env:
      TORCH_SERIALIZATION_DEBUG: "1"
    steps:
      - name: Validate UT scope
        shell: cmd
        run: |
          set UT_NAME=${{ inputs.ut }}
          if "%UT_NAME%" == "basic" exit /b 0
          if "%UT_NAME%" == "op_extended" exit /b 0
          if "%UT_NAME%" == "test_xpu" exit /b 0
          if "%UT_NAME%" == "test_cpp_extensions_aot_xpu" exit /b 0
          if "%UT_NAME%" == "op_ut" exit /b 0
          echo ::error::Unsupported Windows UT scope '%UT_NAME%', expected one of: basic, op_ut, op_extended, test_xpu, test_cpp_extensions_aot_xpu
          exit /b 1
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Prepare test env
        uses: ./.github/actions/windows-testenv
        with:
          pytorch: ${{ inputs.pytorch }}
          torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
          python: ${{ inputs.python }}
          xpu_version: ${{ inputs.xpu_version }}
      - name: Run XPU UT Test
        uses: ./.github/actions/windows-uttest
        with:
          ut_name: ${{ inputs.ut }}
      - name: Record UT job metadata
        if: ${{ ! cancelled() }}
        shell: cmd
        run: |
          if not exist "%GITHUB_WORKSPACE%\ut_log" mkdir "%GITHUB_WORKSPACE%\ut_log"
          rem The summary reads this to know which known-failure labels and
          rem which platform name apply to the artifact.
          echo UT_NAME=${{ inputs.ut }}> "%GITHUB_WORKSPACE%\ut_log\ut_meta.env"
          echo UT_RUNNER=${{ inputs.runner }}>> "%GITHUB_WORKSPACE%\ut_log\ut_meta.env"
          echo UT_CATEGORY=${{ inputs.category }}>> "%GITHUB_WORKSPACE%\ut_log\ut_meta.env"
      - name: Upload UT data
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: UT-Data-windows-${{ inputs.ut }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}-${{ github.run_attempt }}
          path: "${{ github.workspace }}/ut_log"
          if-no-files-found: ignore

  check:
    needs: [ut_test]
    if: ${{ ! cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Check UT failures
        id: ut
        uses: ./.github/actions/ut-check
        with:
          platform: windows
          ut: ${{ inputs.ut }}
          category: ${{ inputs.category }}
          pytorch: ${{ inputs.pytorch }}
      - name: Fail on new failures
        if: ${{ steps.ut.outputs.passed != 'true' }}
        shell: bash {0}
        run: |
          echo "::error::${{ steps.ut.outputs.new_failures }} new UT failures:"
          cat "${{ steps.ut.outputs.work_dir }}"/*/new_failures.txt
          exit 1
