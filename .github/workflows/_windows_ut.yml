name: Windows Test

on:
  workflow_call:
    inputs:
      pytorch:
        required: false
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        required: false
        type: string
        default: 'main'
        description: Torch-xpu-ops main by default, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      ut:
        required: true
        type: string
        default: ''
        description: UT scope. `op_regression,op_regression_dev1,op_extended,op_ut,torch_xpu` Delimiter is comma
      python:
        required: false
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.json
      runner:
        required: true
        type: string
        description: Runner label
      category:
        type: string
        default: ''
        description: 'Optional artifact tag; also selects known-failure label scope'
      xpu_version:
        required: false
        type: string
        default: '2026.1'
        description: XPU version

permissions: read-all

jobs:
  ut_test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1000
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Resolve python version
        uses: ./.github/actions/ci-config
        with:
          python: ${{ inputs.python }}
      - name: Clean old wheel artifacts
        if: ${{ ! endsWith(inputs.pytorch, '_wheel') }}
        shell: cmd
        run: |
          if exist "%GITHUB_WORKSPACE%\wheel_artifact" rmdir /s /q "%GITHUB_WORKSPACE%\wheel_artifact"
      - name: Download Torch Wheel
        if: ${{ ! endsWith(inputs.pytorch, '_wheel') }}
        uses: actions/download-artifact@v8
        with:
          pattern: Torch-XPU-Windows-Binary-${{ github.event.pull_request.number || github.sha }}-*
          path: ${{ github.workspace }}/wheel_artifact
      - name: Install oneAPI (for UT runtime)
        shell: cmd
        run: |
          set XPU_VERSION=${{ inputs.xpu_version }}
          call .github\scripts\install_xpu.bat
          if errorlevel 1 exit /b 1
      - name: Setup Python Environment
        shell: cmd
        run: |
          echo "C:\ProgramData\miniforge3\Scripts" >> "$GITHUB_PATH"
          echo "C:\ProgramData\miniforge3\Library\bin" >> "$GITHUB_PATH"
          call "C:\ProgramData\miniforge3\Scripts\activate.bat"
          rmdir /s /q "C:\ProgramData\miniforge3\envs\windows_ut"
          call conda clean -ay
          call conda remove --all -y -n windows_ut
          call conda create -n windows_ut python=%PYTHON_VERSION% -y
          call conda activate windows_ut
          python -m pip install pyyaml requests pytest-timeout pytest pytest-xdist
          call conda install -y libuv
          call conda install -y rust
          cd ..
          if exist "pytorch" (
            rmdir /s /q pytorch
          )
          set pytorch=${{ inputs.pytorch }}
          set torch_xpu_ops=${{ inputs.torch_xpu_ops }}

          REM Skip pytorch clone for nightly wheel - will be handled after install
          echo %pytorch% | findstr /C:"_wheel" >nul
          if %errorlevel% equ 0 (
            echo "Nightly wheel mode: skipping pytorch clone (will clone after install)"
            goto :setup_done
          )

          echo %pytorch% | findstr /C:"https://" >nul
          if %errorlevel% equ 0 (
              echo %pytorch% | findstr "@" >nul
              if %errorlevel% equ 0 (
                  for /f "tokens=1,2 delims=@" %%a in ("%pytorch%") do (
                      set PYTORCH_REPO=%%a
                      set PYTORCH_COMMIT=%%b
                  )
              ) else (
                  set PYTORCH_REPO=%pytorch%
                  set PYTORCH_COMMIT=main
              )
          ) else (
              set PYTORCH_REPO=https://github.com/pytorch/pytorch.git
              set PYTORCH_COMMIT=%pytorch%
          )

          echo %torch_xpu_ops% | findstr /C:"https://" >nul
          if %errorlevel% equ 0 (
              echo %torch_xpu_ops% | findstr "@" >nul
              if %errorlevel% equ 0 (
                  for /f "tokens=1,2 delims=@" %%a in ("%torch_xpu_ops%") do (
                      set TORCH_XPU_OPS_REPO=%%a
                      set TORCH_XPU_OPS_COMMIT=%%b
                  )
              ) else (
                  set TORCH_XPU_OPS_REPO=%torch_xpu_ops%
                  set TORCH_XPU_OPS_COMMIT=main
              )
          ) else (
              set TORCH_XPU_OPS_REPO=https://github.com/intel/torch-xpu-ops.git
              set TORCH_XPU_OPS_COMMIT=%torch_xpu_ops%
          )
          git clone %PYTORCH_REPO% pytorch
          cd pytorch && git checkout %PYTORCH_COMMIT%
          if %TORCH_XPU_OPS_COMMIT% == 'pinned' (
            echo "Don't replace torch-xpu-ops!"
          ) else (
            echo "Replace torch-xpu-ops!"
            cd third_party
            if exist "torch-xpu-ops" (
              rmdir /s /q torch-xpu-ops
            )
            cd ..
            if "%GITHUB_EVENT_NAME%" == "pull_request" (
              Xcopy ..\torch-xpu-ops third_party\torch-xpu-ops /E/H/Y/F/I
            ) else (
              git clone "%TORCH_XPU_OPS_REPO%" "third_party\torch-xpu-ops"
              cd "third_party\torch-xpu-ops"
              git checkout "%TORCH_XPU_OPS_COMMIT%"
              cd ../..
            )
            powershell -Command "(Get-Content caffe2/CMakeLists.txt) -replace 'checkout --quiet \${TORCH_XPU_OPS_COMMIT}', 'log -n 1' | Set-Content caffe2/CMakeLists.txt"
          )
          :setup_done
      - name: Install PyTorch Wheel and Dependencies
        shell: cmd
        run: |
          call "C:\ProgramData\miniforge3\Scripts\activate.bat"
          call conda activate windows_ut
          set PYTORCH_INPUT=${{ inputs.pytorch }}
          echo %PYTORCH_INPUT% | findstr /C:"_wheel" >nul
          if %errorlevel% equ 0 (
            echo "Installing PyTorch from nightly wheel..."
            python -m pip install torch torchvision torchaudio --pre --index-url https://download.pytorch.org/whl/nightly/xpu
            REM Clone pytorch source at the installed version's commit for test infra
            for /f "delims=" %%v in ('python -c "import torch; print(torch.version.git_version)"') do set TORCH_COMMIT_ID=%%v
            echo "Installed torch commit: %TORCH_COMMIT_ID%"
            cd %GITHUB_WORKSPACE%\..
            git clone https://github.com/pytorch/pytorch.git pytorch
            cd pytorch && git checkout %TORCH_COMMIT_ID%
            REM Prepare torch-xpu-ops for test scripts
            set torch_xpu_ops=${{ inputs.torch_xpu_ops }}
            if "%torch_xpu_ops%" == "pinned" (
              for /f "delims=" %%c in ('type third_party\xpu.txt') do set XPU_OPS_COMMIT=%%c
              cd third_party
              if exist "torch-xpu-ops" rmdir /s /q torch-xpu-ops
              cd ..
              git clone "https://github.com/intel/torch-xpu-ops.git" "third_party\torch-xpu-ops"
              cd "third_party\torch-xpu-ops"
              git checkout "%XPU_OPS_COMMIT%"
              cd ../..
            ) else (
              cd third_party
              if exist "torch-xpu-ops" rmdir /s /q torch-xpu-ops
              cd ..
              git clone "https://github.com/intel/torch-xpu-ops.git" "third_party\torch-xpu-ops"
              cd "third_party\torch-xpu-ops"
              git checkout "%torch_xpu_ops%"
              cd ../..
            )
          ) else (
            REM Install in the loop body: %TORCH_WHL% would expand when cmd
            REM parses this block, before the for has assigned it.
            for /r "%GITHUB_WORKSPACE%\wheel_artifact" %%f in (*.whl) do python -m pip install "%%f"
            python -c "import torch" || exit /b 1
          )
          cd %GITHUB_WORKSPACE%\..\pytorch
          python -m pip install -r .ci\docker\requirements-ci.txt
      - name: Torch Config Check
        shell: cmd
        run: |
          call "C:\ProgramData\miniforge3\Scripts\activate.bat"
          call conda activate windows_ut
          python -c "import torch; print(torch.__config__.show())"
          python -c "import torch; print(torch.__config__.parallel_info())"
          python -c "import torch; print(torch.xpu.device_count())"
      - name: Run XPU OP Extended UT
        if: contains(inputs.ut, 'op_extended') || github.event_name == 'schedule'
        shell: cmd
        continue-on-error: true
        run: |
          call "C:\ProgramData\miniforge3\Scripts\activate.bat"
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          call conda activate windows_ut
          set PYTORCH_TEST_WITH_SLOW=1
          cd ../pytorch/third_party/torch-xpu-ops/test/xpu/extended/
          python run_test_with_skip_mtl.py

          if not exist "%GITHUB_WORKSPACE%\ut_log" mkdir "%GITHUB_WORKSPACE%\ut_log"
          copy op_extended.xml %GITHUB_WORKSPACE%\ut_log /Y
      - name: Run CPP Extensions AOT SYCL UT
        if: contains(inputs.ut, 'test_xpu') || github.event_name == 'schedule'
        shell: cmd
        continue-on-error: true
        run: |
          call "C:\ProgramData\miniforge3\Scripts\activate.bat"
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\ocloc\latest\env\vars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\pti\latest\env\vars.bat"
          call conda activate windows_ut
          cd ../pytorch/third_party/torch-xpu-ops/test/xpu/
          python -m pytest test_cpp_extensions_aot_xpu.py -v --junit-xml=test_cpp_extensions_aot_xpu.xml

          if not exist "%GITHUB_WORKSPACE%\ut_log" mkdir "%GITHUB_WORKSPACE%\ut_log"
          copy test_cpp_extensions_aot_xpu.xml %GITHUB_WORKSPACE%\ut_log /Y
      - name: Run Test XPU UT
        if: contains(inputs.ut, 'test_xpu') || github.event_name == 'schedule'
        shell: cmd
        continue-on-error: true
        run: |
          call "C:\ProgramData\miniforge3\Scripts\activate.bat"
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          call conda activate windows_ut
          cd ../pytorch/third_party/torch-xpu-ops/test/xpu/
          python run_test_win_with_skip_mtl.py

          if not exist "%GITHUB_WORKSPACE%\ut_log" mkdir "%GITHUB_WORKSPACE%\ut_log"
          copy test_xpu.xml %GITHUB_WORKSPACE%\ut_log /Y
      - name: Run OP UT
        if: contains(inputs.ut, 'op_ut') || github.event_name == 'schedule'
        shell: cmd
        continue-on-error: true
        run: |
          call "C:\ProgramData\miniforge3\Scripts\activate.bat"
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          call conda activate windows_ut
          set PYTORCH_TEST_WITH_SLOW=1
          set PYTEST_ADDOPTS=-v --timeout 600 --timeout_method=thread --max-worker-restart 1000000 -n 1
          cd ../pytorch/third_party/torch-xpu-ops/test/xpu/
          python run_test_with_windows_nightly.py
          if not exist "%GITHUB_WORKSPACE%\ut_log" mkdir "%GITHUB_WORKSPACE%\ut_log"
          for /r . %%f in (test*.xml op_ut_with_*.xml) do move "%%f" "%GITHUB_WORKSPACE%\ut_log\" >nul 2>&1 || echo "File move completed"
      - name: Record UT job metadata
        if: ${{ ! cancelled() }}
        shell: cmd
        run: |
          if not exist "%GITHUB_WORKSPACE%\ut_log" mkdir "%GITHUB_WORKSPACE%\ut_log"
          rem The summary reads this to know which known-failure labels and
          rem which platform name apply to the artifact.
          echo UT_NAME=${{ inputs.ut }}> "%GITHUB_WORKSPACE%\ut_log\ut_meta.env"
          echo UT_RUNNER=${{ inputs.runner }}>> "%GITHUB_WORKSPACE%\ut_log\ut_meta.env"
          echo UT_CATEGORY=${{ inputs.category }}>> "%GITHUB_WORKSPACE%\ut_log\ut_meta.env"
      - name: Upload Inductor XPU UT Log
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Inductor-XPU-UT-Data-${{ github.event.pull_request.number || github.sha }}-windows-${{ inputs.ut }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
          path: "${{ github.workspace }}/ut_log"
          if-no-files-found: ignore

  check:
    needs: [ut_test]
    if: ${{ ! cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Check UT failures
        id: ut
        uses: ./.github/actions/ut-check
        with:
          platform: windows
          pytorch: ${{ inputs.pytorch }}
          artifact_pattern: Inductor-XPU-UT-Data-${{ github.event.pull_request.number || github.sha }}-windows-${{ inputs.ut }}-${{ github.run_id }}-*${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
          check_artifact: UT-Check-${{ github.event.pull_request.number || github.sha }}-windows-${{ inputs.ut }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
      - name: Fail on new failures
        if: ${{ steps.ut.outputs.passed != 'true' }}
        shell: bash {0}
        run: |
          echo "::error::${{ steps.ut.outputs.new_failures }} new UT failures:"
          cat "${{ steps.ut.outputs.work_dir }}"/*/new_failure_list.txt
          exit 1
