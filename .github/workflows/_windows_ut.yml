name: Windows Test

on:
  workflow_call:
    inputs:
      pytorch:
        required: false
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        required: false
        type: string
        default: 'main'
        description: Torch-xpu-ops main by default, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      ut:
        required: true
        type: string
        description: UT scope. `op_regression,op_regression_dev1,op_extended,op_ut,torch_xpu` Delimiter is comma
      python:
        required: false
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.json
      runner:
        required: true
        type: string
        description: Runner label
      xpu_version:
        required: false
        type: string
        default: '2026.1'
        description: XPU version

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  ut_test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1000
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve python version
        uses: ./.github/actions/ci-config
        with:
          python: ${{ inputs.python }}
      - name: Clean old wheel artifacts
        if: ${{ ! endsWith(inputs.pytorch, '_wheel') }}
        shell: pwsh
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\clean_wheel_artifacts.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download Torch Wheel
        if: ${{ ! endsWith(inputs.pytorch, '_wheel') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Torch-XPU-Windows-Binary-${{ github.event.pull_request.number || github.sha }}-*
          path: ${{ github.workspace }}/wheel_artifact
      - name: Install oneAPI (for UT runtime)
        shell: pwsh
        env:
          XPU_VERSION_INPUT: ${{ inputs.xpu_version }}
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\install_oneapi_ut.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Setup Python Environment
        shell: pwsh
        env:
          PYTORCH_REF: ${{ inputs.pytorch }}
          TORCH_XPU_OPS_REF: ${{ inputs.torch_xpu_ops }}
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\setup_ut_python_env.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install PyTorch Wheel and Dependencies
        shell: pwsh
        env:
          PYTORCH_REF: ${{ inputs.pytorch }}
          TORCH_XPU_OPS_REF: ${{ inputs.torch_xpu_ops }}
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\install_torch_wheel_and_deps.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Torch Config Check
        shell: pwsh
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\torch_config_check.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run XPU OP Extended UT
        if: contains(inputs.ut, 'op_extended') || github.event_name == 'schedule'
        shell: pwsh
        continue-on-error: true
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\run_op_extended_ut.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run CPP Extensions AOT SYCL UT
        if: contains(inputs.ut, 'test_xpu') || github.event_name == 'schedule'
        shell: pwsh
        continue-on-error: true
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\run_cpp_extensions_aot_ut.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Test XPU UT
        if: contains(inputs.ut, 'test_xpu') || github.event_name == 'schedule'
        shell: pwsh
        continue-on-error: true
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\run_test_xpu_ut.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run OP UT
        if: contains(inputs.ut, 'op_ut') || github.event_name == 'schedule'
        shell: pwsh
        continue-on-error: true
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\run_op_ut.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Inductor XPU UT Log
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Inductor-XPU-UT-Data-${{ github.event.pull_request.number || github.sha }}-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ github.workspace }}/ut_log"
          if-no-files-found: ignore

  summary:
    needs: [ut_test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup python
        uses: ./.github/actions/setup-python
        with:
          python: ${{ inputs.python }}
      - name: Download XPU UT Logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Inductor-XPU-UT-Data-${{ github.event.pull_request.number || github.sha }}-Windows-*
          path: ${{ github.workspace }}/ut_log
      - name: UT Test Results Summary
        shell: bash
        env:
          UT_SCOPE: ${{ inputs.ut }}
        run: |
          uv pip install junitparser
          find . -type f -name "*.xml" -exec mv {} "${GITHUB_WORKSPACE}/ut_log/" \; || true
          python ./.github/scripts/check-ut.py -n "${UT_SCOPE}" -i "${GITHUB_WORKSPACE}"/ut_log/*.xml >> "${GITHUB_STEP_SUMMARY}" || true
          # Check the failure logs
          if ls "${GITHUB_WORKSPACE}"/failures*.log 1> /dev/null 2>&1; then
            echo -e "Exist Failure logs"
            echo "Found Failure logs as below: "
            for file in "${GITHUB_WORKSPACE}"/failures*.log; do
              echo "  - $file"
              cp "$file" "${GITHUB_WORKSPACE}/ut_log"
            done
            echo -e "Failure logs Copied"
          else
            echo -e "No Failure logs"
          fi
          # Copied the passed logs
          if ls passed*.log 1> /dev/null 2>&1; then
            cp passed*.log "${GITHUB_WORKSPACE}/ut_log"
            echo -e "Passed logs Copied"
          else
            echo -e "No Passed logs"
          fi
          # Copied the Summary logs
          if ls category*.log 1> /dev/null 2>&1; then
            cp category*.log "${GITHUB_WORKSPACE}/ut_log"
            echo -e "Category logs Copied"
          else
            echo -e "No Category logs"
          fi
      - name: Upload Inductor XPU UT Log
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Inductor-XPU-UT-Data-${{ github.event.pull_request.number || github.sha }}-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ut_log
          overwrite: true

  summary_check:
    needs: [summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download XPU UT Logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Inductor-XPU-UT-Data-${{ github.event.pull_request.number || github.sha }}-Windows-*
          path: ${{ github.workspace }}/ut_log
      - name: Check UT Results
        shell: bash
        env:
          UT_SCOPE: ${{ inputs.ut }}
          PR_OR_SHA: ${{ github.event.pull_request.number || github.sha }}
        run: |
          ls -al "${GITHUB_WORKSPACE}/ut_log"
          cd "${GITHUB_WORKSPACE}/ut_log"
          # download-artifact v8 drops the per-artifact dir when only one artifact matches; fall back to ut_log root
          latest_dir=$(find . -type d -name "Inductor-XPU-UT-Data-${PR_OR_SHA}-Windows-*" |sort -V |tail -n 1)
          latest_dir="${latest_dir:-.}"
          cd "${latest_dir}"
          find "${GITHUB_WORKSPACE}/ut_log" -type f \
              \( -name "failures_*.log" -o \
                -name "passed_*.log" -o \
                -name "category_*.log" \) \
              -exec mv {} ./ \; || true

          # get skipped known issues on Linux
          count_linux=$(gh api "search/issues?q=repo:$GITHUB_REPOSITORY+label:skipped+state:open" --jq '.total_count')
          if [ "$count_linux" -gt 0 ]; then
            echo -e "$count_linux issues on linux with skipped label found"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=skipped" \
              --jq '.[] | select(.pull_request == null) | "Issue #\(.number): \(.title)\n\(.body)\n"' > issues.log
          fi

          # get skipped known issues only on Windows
          count_windows_only=$(gh api "search/issues?q=repo:$GITHUB_REPOSITORY+label:skipped_windows+state:open" --jq '.total_count')
          if [ "$count_windows_only" -gt 0 ]; then
            echo -e "$count_windows_only windows only issues with skipped label found"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=skipped_windows" \
              --jq '.[] | select(.pull_request == null) | "Issue #\(.number): \(.title)\n\(.body)\n"' >> issues.log
          fi

          cp "${GITHUB_WORKSPACE}/.github/scripts/ut_result_check.sh" ./
          IFS=', ' read -r -a ut_names <<< "${UT_SCOPE}"
          for ut_name in "${ut_names[@]}"
          do
            touch Known_issue.log
            if [ -f "issues.log" ]; then
              awk -v r="${ut_name}" 'BEGIN{ print_row = 0 }{
                if ( ! ( $0 ~ /[a-zA-Z0-9]/ ) ) { print_row = 0 };
                if ( print_row == 1 && $1 ~ r ) { print $0 };
                if ( $0 ~ /Cases:/ ) { print_row = 1 };
              }' issues.log > Known_issue.log
            else
              echo "Info: issues.log not found or empty, using empty Known_issue.log"
            fi
            TEST_PLATFORM=windows bash ut_result_check.sh "${ut_name}"
          done
      - name: Upload Inductor XPU UT Log
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Inductor-XPU-UT-Data-${{ github.event.pull_request.number || github.sha }}-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ut_log
          overwrite: true
