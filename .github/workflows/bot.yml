  fix:
    needs: parse-command
    runs-on: xpu-agent
    # Bumped from 180: a C++/SYCL fix now source-builds in-loop (DLE install +
    # cold build). Smoke test data (`_arc_runner_smoke.yml` runs
    # 32449648840 / 32681034792): ~43min agent + ~15-31min build on this
    # runner for a small diff. 300 leaves headroom for a bigger diff or an
    # AOT-arch build.
    timeout-minutes: 300
    if: >-
      needs.parse-command.outputs.command == 'fix'
      && needs.parse-command.outputs.authorized == 'true'
    container:
      image: intelgpu/ubuntu-26.04-rolling:26.18
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_ADMIN
              --shm-size=8g --privileged -e ZE_AFFINITY_MASK
    env:
      ISSUE_NUMBER: ${{ needs.parse-command.outputs.issue_number }}
      GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
      HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      # AGENTS.md's gitignored scratch dir. Everything the agent produces for
      # a build-in-the-loop fix (pytorch clone, fix_result.json, the staged
      # transcript) lives here instead of /tmp, so it's all in one
      # already-established, already-gitignored place.
      AGENT_SPACE: ${{ github.workspace }}/agent_space_xpu
      # Default path (see the fix prompt below): WebFetch Intel's prereq page
      # to look up the DLE version matching whatever PyTorch was installed.
      # This constant is only the fallback for when that page is unreachable
      # — a stale-by-design pin (2026.1, matches PyTorch 2.14+), not used
      # unless the lookup itself fails.
      ONEAPI_INSTALLER: "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/c109e1ae-e02c-48a6-917b-b03b90d33f77/intel-deep-learning-essentials-2026.1.2.25_offline.sh"
    steps:
      - name: Post starting message
        id: start-comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Starting automated fix on this issue. Follow progress in the [workflow run](${runUrl}).`
            });
            // Reused by "Post result comment" so the happy path leaves one comment.
            core.setOutput('comment_id', String(comment.data.id));

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MERGE_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"
          git config --global user.name "torchxpubot"
          git config --global user.email "torchxpubot@intel.com"

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python: '3.10'

      - name: Prepare agent scratch dir
        run: mkdir -p "$AGENT_SPACE"

      - name: Install latest nightly PyTorch-XPU
        run: |
          # Reproduce/verify environment: latest nightly XPU build.
          uv pip install --prerelease=allow torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/xpu
          python -c "import torch; print('torch', torch.__version__); print('xpu available:', torch.xpu.is_available())"

      - name: Run AI fix
        id: ai-fix
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.MERGE_TOKEN }}
          settings: '{"alwaysThinkingEnabled": true}'
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 200 --allowedTools ${{ env.CLAUDE_ALLOWED_TOOLS }},Write,Edit"
          prompt: |
            Use the /issue-handler skill in pipeline mode to fix issue
            #${{ needs.parse-command.outputs.issue_number }} in ${{ github.repository }}.
            The repository checkout is at ${{ github.workspace }}.

            This runner has a prebuilt nightly PyTorch-XPU wheel installed and no
            PyTorch source or build tree yet. That's fine for Python-level changes
            (test files, skip lists, xpu_test_utils, Python operator code) — take
            effect immediately, reproduce/fix/re-verify them normally.

            If the fix touches C++ or SYCL sources under src/, the installed wheel
            still has the old kernels, so you must source-build to verify it
            yourself (do not stop and hand this off as "needs human build" — you
            have GPU access via /dev/dri and root in this container). Do all of
            this under `${{ env.AGENT_SPACE }}` (pytorch clone, torch-xpu-ops
            working tree, build outputs, `fix_result.json`) — it's the
            gitignored scratch dir from this repo's AGENTS.md, already the
            convention other skills use, so nothing here needs `/tmp`:
            1. Clone pytorch into `${{ env.AGENT_SPACE }}/pytorch`, apply your
               fix (pytorch-side diff and/or torch-xpu-ops-side diff per
               AGENTS.md's `xpu.txt` override).
            2. Install the Intel Deep Learning Essentials (DLE) via the OFFLINE
               installer (this container has no Intel apt repo, so
               `apt install intel-deep-learning-essentials` fails). **The DLE
               version must match the PyTorch version you installed in step 1**
               (the nightly install above always tracks latest, so this drifts
               forward over time — do not assume last week's version pairing
               still holds). WebFetch
               https://www.intel.com/content/www/us/en/developer/articles/tool/pytorch-prerequisites-for-intel-gpu.html
               for the current PyTorch<->DLE compatibility table (the "PyTorch
               and Intel Deep Learning Essentials Compatibility" section) and
               the matching offline installer URL (the "Install Using Offline
               Installation Scripts" section). Only fall back to the
               hardcoded URL below if that page is unreachable — it is a
               last-resort pin (2026.1, matches PyTorch 2.14+) that WILL go
               stale as PyTorch moves forward, not a default to reach for
               first:
               `${{ env.ONEAPI_INSTALLER }}`
               If the table's latest entry still points at the same version
               as the hardcoded URL, that just means nobody has bumped this
               workflow since Intel last updated the page yet — not a sign
               something is wrong; use whatever the table says either way.
            3. Source-build via the /xpu-build-pytorch skill
               (`pip install -e . -v --no-build-isolation` from the pytorch
               checkout). Confirm `torch.xpu.is_available()` is True on the
               source build.
            4. Re-run the reproducer (and regression tests) from
               `<pytorch_dir>/test` — never from the pytorch root, it shadows
               the installed torch with `No module named torch.version`.
            5. Write `<pytorch_dir>/build_pytorch.env` (exports USE_XPU=1,
               USE_CUDA=0, sources your DLE setvars.sh). A separate reviewer
               agent re-runs your fix in a brand-new shell that has none of
               your session's state — only this file. Validate that in a real
               new bash process before trusting it: sourcing just
               `build_pytorch.env` must be enough on its own to get
               `torch.xpu.is_available() == True` and to pass
               `refined_command` from `<pytorch_dir>/test`. If it only works
               from your current shell's accumulated state, the file is
               missing something.
            6. Write `${{ env.AGENT_SPACE }}/fix_result.json` with keys:
               `needs_build` (bool, true here), `build_ok` (bool),
               `xpu_available` (bool), `pytorch_dir` (absolute path),
               `refined_command` (single shell-executable pytest invocation,
               run from `<pytorch_dir>/test`, that must PASS on your build),
               `notes`. Only write `build_ok: true` after the fresh-shell
               check from step 5 passes — the reviewer agent replays exactly
               that.

            For a Python-only fix, still write
            `${{ env.AGENT_SPACE }}/fix_result.json` with `needs_build: false`
            (the reviewer skips the build recheck in that case).

            When you have a verified fix, commit it and push it to the branch
            `agent/fix-issue-${{ needs.parse-command.outputs.issue_number }}`
            (force-push is fine; this exact name is the contract the
            `fix-pr-create` command relies on to find your branch later). Do
            not open a pull request: a human reviews the diff posted on the
            issue and then comments `@torchxpubot fix-pr-create` to open a
            draft PR from this branch. End by reporting the branch name and
            your summary.

            BATCH ISSUE: if `/issue-handler` classifies this as a `batch-bug`
            (a parent tracking several sub-bugs), it fans out and handles each
            sub-item independently. In that case, instead of the single
            `fix_result.json` + single branch above, it produces (per its
            Stage 1u contract):
            - one `${{ env.AGENT_SPACE }}/batch_summary.json` listing every
              sub-item with its `seq`, `slug`, `outcome`, `branch`, and (for
              fixed ones) `fix_result` filename;
            - one `${{ env.AGENT_SPACE }}/fix_result-<slug>.json` per FIXED
              sub-item (same schema as `fix_result.json`);
            - one pushed branch `agent/fix-issue-<N>-<seq>-<slug>` per FIXED
              sub-item.
            Do not push a single combined branch in that case. The reviewer
            and gate below detect `batch_summary.json` and re-verify each
            fixed sub-item. Report the batch summary (which sub-items were
            fixed / need a human) at the end.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      # Reviewer agent (semantic layer). The fix agent's own conclusion can't
      # be trusted: claude-code-action always exits 0. A dumb re-run-the-command
      # script can't be trusted either — it can't tell "collected 0 items but
      # exit 0" from a real pass, or judge a multi-step / e2e reproducer. So a
      # SECOND, independent agent re-verifies the fix from scratch and judges
      # the result semantically, then the thin gate step below checks that this
      # reviewer produced a self-consistent, execution-backed verdict (which a
      # script CAN do, and which covers the reviewer's own always-exit-0 blind
      # spot).
      - name: Review AI fix — independent re-verification
        id: review
        if: ${{ always() && (hashFiles('agent_space_xpu/fix_result.json') != '' || hashFiles('agent_space_xpu/batch_summary.json') != '') }}
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.MERGE_TOKEN }}
          settings: '{"alwaysThinkingEnabled": true}'
          # Write (but not Edit) so it can emit review_result.json without
          # being able to touch source. Read-only on code, write-only on its
          # own verdict file.
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 80 --allowedTools Bash,Read,Glob,Grep,Write"
          prompt: |
            You are an INDEPENDENT reviewer. Another agent just fixed issue
            #${{ needs.parse-command.outputs.issue_number }} and recorded what
            it did under `${{ env.AGENT_SPACE }}/`. Your job is to decide, from
            scratch and skeptically, whether the fix is really verified. Do NOT
            trust the fix agent's self-report — re-run and judge yourself. Do
            NOT modify code, do NOT commit, do NOT push.

            FIRST determine single-bug vs batch:

            - If `${{ env.AGENT_SPACE }}/batch_summary.json` exists, this is a
              BATCH run. For EACH sub-item in its `sub_items` array whose
              `outcome` is `FIXED`, re-verify that sub-item from its own
              `${{ env.AGENT_SPACE }}/<fix_result>` file (the `fix_result`
              field, e.g. `fix_result-<slug>.json`) using the per-file recipe
              below, and write ONE verdict file per sub-item named
              `${{ env.AGENT_SPACE }}/review_result-<slug>.json` (same `slug`
              as in batch_summary). Do NOT re-verify sub-items that are not
              FIXED (NEEDS_HUMAN / STALE_SKIP / INVALID_ENTRY / UNVERIFIED have
              no branch to check). Process every FIXED sub-item even if an
              earlier one fails its recheck.
            - Otherwise this is a SINGLE-bug run: read
              `${{ env.AGENT_SPACE }}/fix_result.json` and write one
              `${{ env.AGENT_SPACE }}/review_result.json`.

            Per-file recipe (apply to each `fix_result*.json` you verify):

            - If `needs_build` is false (Python-only fix): re-run its
              `refined_command` against the installed nightly wheel yourself.
            - If `needs_build` is true (source build): in a brand-new bash
              process (none of the fix agent's shell state), source ONLY
              `<pytorch_dir>/build_pytorch.env`, confirm
              `torch.xpu.is_available()` is True, then run `refined_command`
              from `<pytorch_dir>/test`.

            Judge the OUTCOME semantically, not just by exit code — an exit 0
            with `collected 0 items`, `no tests ran`, all-skipped, or
            all-xfailed is NOT a pass; it means the test never really ran (or
            still fails). If `refined_command` is a multi-step or non-pytest
            reproducer, reason about whether it actually exercised the fixed
            path and succeeded. If anything is ambiguous or you cannot
            reproduce the agent's setup, say so rather than rubber-stamping.

            Write each conclusion (the single `review_result.json`, or one
            `review_result-<slug>.json` per fixed sub-item) with keys:
            - `verdict`: "PASSED" | "FAILED" | "INCONCLUSIVE"
            - `slug`: the sub-item slug (batch only; omit or "" for single-bug)
            - `commands`: array of {`cmd`, `exit_code`, `tests_collected`
              (int, -1 if N/A), `tests_passed` (int, -1 if N/A)} for every
              command you actually ran to verify
            - `reason`: one sentence
            Only write `verdict: "PASSED"` if at least one command you ran had
            exit_code 0 AND tests_collected >= 1 AND tests_passed >= 1 (or, for
            a non-pytest reproducer, an equivalent positive signal you explain
            in `reason`). These files are machine-checked; a PASSED verdict
            whose `commands` don't support it will be rejected.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      # Objective gate (client layer): a dumb script that does the one thing a
      # script does better than an agent — refuse to let an always-exit-0
      # reviewer self-certify. It checks the reviewer's verdict file(s) are
      # present, verdict==PASSED, and that verdict is backed by real execution
      # evidence (a command with exit 0 and >=1 test collected+passed). No
      # judgement here; just consistency enforcement.
      #
      # Single-bug: one review_result.json; a failure fails the job (exit 1).
      # Batch: one review_result-<slug>.json per fixed sub-item; per-sub-item
      # results are recorded to gate_status.json (slug -> PASSED|WARNING) and a
      # single sub-item failure is NOT fatal (mirrors the orchestrator's "fix
      # what you can" — a bad sub-item is surfaced as WARNING on its own diff,
      # the rest still proceed). The job only fails if nothing could be gated.
      - name: Verify gate — check reviewer verdict is execution-backed
        id: gate
        if: always()
        run: |
          set -uo pipefail
          command -v jq >/dev/null || { echo "::error::jq not found in the fix container; cannot gate the reviewer verdict"; exit 1; }
          # The gate deliberately exit-0s in several non-PASS cases (batch,
          # nothing-to-gate), so downstream steps must NOT infer PASSED from
          # steps.gate.outcome==success. Emit an explicit verdict instead:
          #   PASSED  single-bug fix, reviewer verdict PASSED + execution-backed
          #   BATCH   batch run (per-sub-item status is in gate_status.json)
          #   NONE    nothing to gate (agent pushed no fix_result)
          # A hard failure exit-1s and never sets a verdict (outcome=failure).
          gate_verdict() { echo "verdict=$1" >> "$GITHUB_OUTPUT"; }
          # jq filter: PASSED and backed by >=1 exit-0, >=1 collected, >=1 passed.
          backed() {
            jq -e '.verdict == "PASSED" and ([.commands[]? | select(.exit_code == 0 and (.tests_collected // -1) >= 1 and (.tests_passed // -1) >= 1)] | length >= 1)' "$1" >/dev/null 2>&1
          }

          batch_json="$AGENT_SPACE/batch_summary.json"
          if [ -f "$batch_json" ]; then
            # Batch mode: gate each fixed sub-item independently.
            echo "### batch verify gate" >> "$GITHUB_STEP_SUMMARY"
            echo "{}" > "$AGENT_SPACE/gate_status.json"
            gated=0
            for slug in $(jq -r '.sub_items[] | select(.outcome == "FIXED") | .slug' "$batch_json"); do
              # Guard against a malformed slug traversing out of AGENT_SPACE
              # (mirrors the charset parse-command enforces on the CLI arg).
              case "$slug" in *[!a-z0-9._-]*|'') echo "skipping malformed slug: '$slug'"; continue;; esac
              rj="$AGENT_SPACE/review_result-$slug.json"
              status="WARNING"
              if [ -f "$rj" ] && backed "$rj"; then
                status="PASSED"
              fi
              reason=$(jq -r '.reason // "(no review_result)"' "$rj" 2>/dev/null || echo "(no review_result)")
              echo "- \`$slug\`: **$status** — $reason" >> "$GITHUB_STEP_SUMMARY"
              # Record slug -> status for the diff-comment step.
              tmp=$(mktemp)
              jq --arg s "$slug" --arg v "$status" '.[$s] = $v' "$AGENT_SPACE/gate_status.json" > "$tmp" && mv "$tmp" "$AGENT_SPACE/gate_status.json"
              gated=$((gated + 1))
            done
            if [ "$gated" -eq 0 ]; then
              echo "no FIXED sub-items to gate (all needed a human, were stale, or invalid)."
            fi
            # Per-sub-item failures are non-fatal in batch mode; the diff
            # comment labels each one. The job stays green so fix-pr-create can
            # still open PRs for the sub-items that did pass.
            gate_verdict BATCH
            exit 0
          fi

          # Single-bug mode (unchanged): a failure fails the job.
          result_json="$AGENT_SPACE/fix_result.json"
          review_json="$AGENT_SPACE/review_result.json"
          if [ ! -f "$result_json" ]; then
            echo "no $result_json from the fix agent; nothing to gate (it likely"
            echo "stopped early or errored — 'Verify: AI fix succeeded' handles that)."
            gate_verdict NONE
            exit 0
          fi
          if [ ! -f "$review_json" ]; then
            echo "::error::reviewer produced no review_result.json — cannot certify the fix"
            exit 1
          fi
          verdict=$(jq -r '.verdict // "MISSING"' "$review_json")
          reason=$(jq -r '.reason // "(no reason)"' "$review_json")
          echo "### reviewer verdict: \`$verdict\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- $reason" >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != "PASSED" ]; then
            echo "::error::reviewer verdict is $verdict, not PASSED"
            exit 1
          fi
          # A PASSED verdict must be backed by at least one command the reviewer
          # actually ran to green — this is what stops an always-exit-0 reviewer
          # from rubber-stamping a collected-0 / all-skipped run.
          if ! backed "$review_json"; then
            echo "::error::PASSED verdict not backed by execution evidence (need a command with exit 0 and >=1 test collected+passed)"
            exit 1
          fi
          echo "reviewer verdict PASSED and execution-backed; gate satisfied"
          gate_verdict PASSED


      # Persist both agents' transcripts (thinking + every tool call/result)
      # plus their result files so a build-in-the-loop run can be reviewed
      # offline. Otherwise discarded with the runner.
      - name: Stage + upload agent transcripts
        if: always()
        run: |
          f='${{ steps.ai-fix.outputs.execution_file }}'
          if [ -n "$f" ] && [ -f "$f" ]; then
            cp "$f" "$AGENT_SPACE/agent_transcript.json"
          fi
          rf='${{ steps.review.outputs.execution_file }}'
          if [ -n "$rf" ] && [ -f "$rf" ]; then
            cp "$rf" "$AGENT_SPACE/reviewer_transcript.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix-issue-${{ needs.parse-command.outputs.issue_number }}-transcript
          path: |
            ${{ env.AGENT_SPACE }}/agent_transcript.json
            ${{ env.AGENT_SPACE }}/reviewer_transcript.json
            ${{ env.AGENT_SPACE }}/fix_result.json
            ${{ env.AGENT_SPACE }}/review_result.json
            ${{ env.AGENT_SPACE }}/batch_summary.json
            ${{ env.AGENT_SPACE }}/fix_result-*.json
            ${{ env.AGENT_SPACE }}/review_result-*.json
            ${{ env.AGENT_SPACE }}/gate_status.json
          if-no-files-found: ignore

      # Post the pushed branch's diff to the issue so a human can review it and,
      # if it looks right, comment `@torchxpubot fix-pr-create` to open a draft
      # PR from that branch. Captured objectively here (from the branch the
      # agent pushed) rather than trusting the agent to paste its own diff.
      # Posted regardless of the gate outcome, with the gate's verdict labeled
      # inline (PASSED vs WARNING) so the reviewer knows whether the fix was
      # independently confirmed before deciding to run fix-pr-create.
      - name: Post fix diff for human review
        if: always()
        env:
          ISSUE_NUMBER: ${{ needs.parse-command.outputs.issue_number }}
          FIX_BRANCH: agent/fix-issue-${{ needs.parse-command.outputs.issue_number }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const cwd = process.env.GITHUB_WORKSPACE;
            const owner = context.repo.owner, repo = context.repo.repo;
            const issue = Number(process.env.ISSUE_NUMBER);
            const agentSpace = `${cwd}/agent_space_xpu`;
            const MAX_TOTAL = 60000; // GitHub comment cap is 65536; leave room.

            // Diff of one branch vs origin/main, or null if the branch has no
            // diff / doesn't exist. Fetches lazily with an explicit refspec:
            // actions/checkout uses a single-branch refmap, so a bare
            // `git fetch origin <branch>` only updates FETCH_HEAD and leaves no
            // refs/remotes/origin/<branch> for the range diff to name. origin/main
            // already exists locally (checkout uses fetch-depth: 0). execFileSync
            // (not execSync) so the agent-authored branch name never hits /bin/sh.
            function branchDiff(branch, budget) {
              try {
                execFileSync('git', ['fetch', 'origin',
                  `+refs/heads/${branch}:refs/remotes/origin/${branch}`], { cwd });
              } catch (e) {
                core.info(`no branch ${branch} to diff: ${e.message}`);
                return null;
              }
              try {
                const d = execFileSync('git',
                  ['diff', `origin/main...origin/${branch}`], {
                  cwd, encoding: 'utf8', maxBuffer: 10 * 1024 * 1024,
                });
                if (!d.trim()) return null;
                return d.length > budget
                  ? d.slice(0, budget) + `\n... (truncated; full diff on branch \`${branch}\`)`
                  : d;
              } catch (e) {
                core.warning(`failed to diff branch ${branch}: ${e.message}`);
                return null;
              }
            }
            // GitHub-alert gate block for a given PASSED/WARNING status.
            function gateBlock(passed) {
              return passed
                ? `> [!NOTE]\n> **Verify gate: PASSED.** A second, independent reviewer ` +
                  `agent re-ran the fix in a clean shell and its PASSED verdict was ` +
                  `backed by at least one command that collected and passed >=1 test. ` +
                  `Independently confirmed, but still review before \`fix-pr-create\`.\n\n`
                : `> [!WARNING]\n> **Verify gate: WARNING.** The fix agent built and ` +
                  `self-verified before pushing, but the independent reviewer did not ` +
                  `confirm it (FAILED/INCONCLUSIVE, unbacked PASSED, or the reviewer/gate ` +
                  `errored). This does **not** mean the fix is wrong — only that the ` +
                  `independent recheck is absent. Review the diff yourself before ` +
                  `\`fix-pr-create\`.\n\n`;
            }

            const batchPath = `${agentSpace}/batch_summary.json`;
            if (fs.existsSync(batchPath)) {
              // ---- BATCH: one grouped comment, a section per sub-item. ----
              const summary = JSON.parse(fs.readFileSync(batchPath, 'utf8'));
              let gateStatus = {};
              try { gateStatus = JSON.parse(fs.readFileSync(`${agentSpace}/gate_status.json`, 'utf8')); } catch (e) {}
              const subs = summary.sub_items || [];
              const fixed = subs.filter(s => s.outcome === 'FIXED' && s.branch);
              const other = subs.filter(s => !(s.outcome === 'FIXED' && s.branch));
              if (!fixed.length && !other.length) { core.info('empty batch_summary'); return; }

              // Split the diff budget across fixed sub-items.
              const perBudget = fixed.length ? Math.floor((MAX_TOTAL - 4000) / fixed.length) : MAX_TOTAL;
              let body =
                `### Batch fix results — issue #${issue}\n\n` +
                `${fixed.length} sub-item(s) fixed, ${other.length} not. Review each ` +
                `diff below; comment \`@torchxpubot fix-pr-create\` to open a draft PR ` +
                `for every fixed sub-item, or \`@torchxpubot fix-pr-create <slug>\` for one.\n\n`;
              for (const s of fixed) {
                const passed = gateStatus[s.slug] === 'PASSED';
                const d = branchDiff(s.branch, perBudget);
                // Per-section marker so fix-pr-create can recover this
                // sub-item's summary for its PR body.
                body += `<!-- agent:fix-summary:issue-${issue}:${s.slug} -->\n`;
                body += `### \`${s.slug}\` — ${s.branch}\n\n`;
                body += gateBlock(passed);
                if (s.summary) body += `${s.summary}\n\n`;
                body += d ? ('```diff\n' + d + '\n```\n\n') : '_(no diff on branch)_\n\n';
              }
              if (other.length) {
                body += `### Not fixed\n\n`;
                for (const s of other) {
                  body += `- \`${s.slug}\` — **${s.outcome}**${s.reason ? `: ${s.reason}` : ''}\n`;
                }
              }
              if (body.length > 65000) body = body.slice(0, 65000) + '\n... (truncated)';
              await github.rest.issues.createComment({ owner, repo, issue_number: issue, body });
              return;
            }

            // ---- SINGLE-BUG (unchanged behavior). ----
            const branch = process.env.FIX_BRANCH;
            const diff = branchDiff(branch, MAX_TOTAL);
            if (!diff) return;
            const body =
              `### Proposed fix on \`${branch}\`\n\n` +
              gateBlock(process.env.GATE_VERDICT === 'PASSED') +
              `Review the diff below. If it looks right, comment ` +
              `\`@torchxpubot fix-pr-create\` on this issue to open a draft PR from this branch.\n\n` +
              '```diff\n' + diff + '\n```';
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue, body,
            });

      - name: Post result comment
        if: always() && steps.ai-fix.outputs.execution_file
        uses: actions/github-script@v9
        env:
          START_COMMENT_ID: ${{ steps.start-comment.outputs.comment_id }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const file = '${{ steps.ai-fix.outputs.execution_file }}';
            if (!file || !fs.existsSync(file)) return;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const result = data.filter(e => e.type === 'result').pop();
            if (!result || result.is_error || !result.result) return;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const job = jobs.data.jobs.find(j => j.name === 'fix');
            const jobUrl = job?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.payload.comment;
            const header = `> Replying to [this comment](${trigger.html_url}) by @${trigger.user.login}\n\n`;
            // The fix agent's own summary below may claim the fix is verified
            // even when the independent reviewer disagreed (or the gate found
            // the reviewer's PASSED verdict wasn't backed by real execution).
            // Flag that mismatch up front so a human does not take the fix
            // agent's self-report at face value. Key off the gate's explicit
            // verdict, not its step outcome (the gate exit-0s in several
            // non-PASS cases). Warn on anything that isn't a clean single-bug
            // PASS, except BATCH (each sub-item is labeled on the diff comment).
            const verdict = process.env.GATE_VERDICT || '';
            const gateWarning = (verdict !== 'PASSED' && verdict !== 'BATCH')
              ? `> [!WARNING]\n> Independent review did **not** confirm the pass claimed below. Treat this summary as unverified until a human re-checks. See the [\`fix\` job](${jobUrl}) "Review" and "Verify gate" steps.\n\n`
              : '';
            const footer = `\n\n---\n_Generated by [\`fix\` job](${jobUrl})._`;
            // Hidden marker so `fix-pr-create` (a separate workflow run that
            // can't see this run's execution_file) can find this summary later
            // and reuse it as the PR body.
            const marker = `\n<!-- agent:fix-summary:issue-${process.env.ISSUE_NUMBER} -->`;
            const body = header + gateWarning + result.result + footer + marker;

            // Overwrite the "starting" comment instead of adding a second one.
            // Failures deliberately post a new comment so the mention notifies.
            const startId = Number(process.env.START_COMMENT_ID);
            if (startId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: startId,
                body
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });

      - name: "Verify: AI fix succeeded"
        if: always()
        uses: actions/github-script@v9
        env:
          AI_FIX_OUTCOME: ${{ steps.ai-fix.outcome }}
          BOT_ESCALATION_USERS: ${{ secrets.BOT_ESCALATION_USERS }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const outcome = process.env.AI_FIX_OUTCOME || 'skipped';
            const file = '${{ steps.ai-fix.outputs.execution_file }}';

            let result = null;
            if (file && fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              result = data.filter(e => e.type === 'result').pop();
              console.log('Result:', JSON.stringify(result, null, 2));
            }
            if (outcome === 'success' && result && !result.is_error && result.total_cost_usd > 0) {
              return;
            }

            // Distinguish "the agent never ran" from "the agent failed", so the
            // comment does not blame Bedrock for a setup or cancellation failure.
            let reason;
            if (outcome === 'cancelled') {
              reason = 'the run was cancelled.';
            } else if (outcome === 'skipped') {
              reason = 'the environment setup failed before the agent started -- checkout, Python setup, or the nightly PyTorch-XPU install.';
            } else if (result && result.is_error) {
              reason = 'the agent returned an error. This is usually a Bedrock or model failure; check AWS token validity.';
            } else if (!result) {
              reason = 'the agent produced no output. This is usually a Bedrock connectivity or credential failure; check AWS token validity.';
            } else {
              reason = 'the agent exited without a usable result.';
            }

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const job = jobs.data.jobs.find(j => j.name === 'fix');
            const jobUrl = job?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `${process.env.BOT_ESCALATION_USERS} \`@torchxpubot fix\` failed: ${reason}\n\nSee the [\`fix\` job](${jobUrl}) for details.`
            });
            if (outcome !== 'cancelled') {
              core.setFailed(`AI fix failed: ${reason}`);
            }

      - name: Report usage cost
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId
            });
            const job = jobs.data.jobs.find(j => j.name === 'fix');
            const jobUrl = job?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            // Both the fix agent and the independent reviewer are full
            // claude-code-action runs; report each so the reviewer's spend
            // (a second from-scratch verify, may rebuild) isn't lost.
            const agents = [
              ['fix', '${{ steps.ai-fix.outputs.execution_file }}'],
              ['review', '${{ steps.review.outputs.execution_file }}'],
            ];
            for (const [label, file] of agents) {
              if (!file || !fs.existsSync(file)) continue;
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const result = data.filter(e => e.type === 'result').pop();
              if (!result) continue;
              const cost = (result.total_cost_usd || 0).toFixed(4);
              const usage = Object.values(result.modelUsage || {})[0] || {};
              const inTok = ((usage.inputTokens || 0) + (usage.cacheReadInputTokens || 0) + (usage.cacheCreationInputTokens || 0)).toLocaleString();
              const outTok = (usage.outputTokens || 0).toLocaleString();
              const status = result.is_error ? 'error' : 'ok';
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ${{ env.COST_TRACKING_ISSUE }},
                body: `\`${date}\` [\`${label}\`](${jobUrl}) on #${process.env.ISSUE_NUMBER} — **$${cost}** (${inTok} in / ${outTok} out) [${status}]`
              });
            }

      # A build-in-the-loop run leaves a full pytorch clone + build tree (tens
      # of GB, hundreds of thousands of files) under $AGENT_SPACE on this shared
      # self-hosted runner. Everything worth keeping was already uploaded as an
      # artifact above and read by the comment steps, so reclaim it now — this
      # also keeps the chown below from having to walk that tree.
      - name: Reclaim agent scratch space
        if: ${{ always() }}
        run: rm -rf "$AGENT_SPACE" || true

      # This privileged container runs as root, so every file it writes into the
      # runner's bind mounts is root-owned (claude-code-action's `bun install`
      # under _actions, tool installs under _tool, step files under _temp, the
      # checked-out repo under _work/<repo>). _actions/_tool/_temp are SEPARATE
      # bind mounts under /__w, so `chown -R /__w` does not reliably recurse into
      # them; name each explicitly. If left root-owned, the NEXT job on this
      # shared self-hosted runner dies in "Prepare workflow directory" (Access
      # to .../_actions/... denied) before any step runs. The runner admins will
      # not add a pre-job hook, so each job must hand these back itself. Derive
      # the runner uid:gid from /__e (the runner's externals, a read-only mount
      # it owns and never writes to) instead of hardcoding 1000 — the service
      # user here is not uid 1000.
      - name: Cleanup workspace
        if: ${{ always() }}
        run: |
          owner="$(stat -c '%u:%g' /__e)"
          chown -R "$owner" /__w /__w/_actions /__w/_tool /__w/_temp /github ./ || true

  # Open a draft PR from the branch a prior `fix` run pushed, once a human has
  # reviewed the diff on the issue. Deliberately does NOT rebuild or re-verify
  # (the fix job already did, and the human just reviewed the diff) — it only
  # turns the branch into a draft PR.
  #
  # Trust model: this only checks the branch exists, not that it passed the
  # verify gate. The `fix` job force-pushes agent/fix-issue-<N> even on a gate
  # failure, so a stale/unverified branch can exist. The safeguard is human:
  # a maintainer reviews the posted diff and only then runs fix-pr-create.
  fix-pr-create:
    needs: parse-command
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      needs.parse-command.outputs.command == 'fix-pr-create'
      && needs.parse-command.outputs.authorized == 'true'
    env:
      ISSUE_NUMBER: ${{ needs.parse-command.outputs.issue_number }}
      FIX_BRANCH: agent/fix-issue-${{ needs.parse-command.outputs.issue_number }}
      PR_SLUG: ${{ needs.parse-command.outputs.pr_slug }}
    steps:
      - name: Open draft PR(s) from the verified fix branch(es)
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const issue = Number(process.env.ISSUE_NUMBER);
            const owner = context.repo.owner, repo = context.repo.repo;
            const base = `agent/fix-issue-${issue}`;
            const slugArg = (process.env.PR_SLUG || '').trim();

            // Discover candidate branches by enumeration (the source of truth;
            // batch_summary.json is only an enrichment and may be gone by now).
            // Single-bug: the bare `agent/fix-issue-<N>`.
            // Batch: one `agent/fix-issue-<N>-<seq>-<slug>` per fixed sub-item.
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner, repo, ref: `heads/${base}`,
            });
            let branches = refs.map(r => r.ref.replace(/^refs\/heads\//, ''));
            // listMatchingRefs is a prefix match, so `agent/fix-issue-4` also
            // matches `agent/fix-issue-42`; keep only exact base or base-<...>.
            const re = new RegExp(`^${base}(-.+)?$`);
            branches = branches.filter(b => re.test(b));

            // Map a branch to its sub-item slug (batch), or '' (single-bug).
            // slugOf keeps the branch's `<seq>-<slug>` tail (used for matching);
            // bareSlugOf strips the leading numeric seq to recover the bare
            // slug the fix job wrote into batch_summary.json / the comment
            // markers (`<seq>-<slug>` -> `<slug>`).
            const slugOf = (b) => b === base ? '' : b.slice(base.length + 1);
            const bareSlugOf = (b) => slugOf(b).replace(/^\d+-/, '');

            if (slugArg) {
              // Open just the one sub-item whose bare slug matches the arg
              // (slugArg is the bare slug a human copied from the comment).
              branches = branches.filter(b => bareSlugOf(b) === slugArg);
              if (!branches.length) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue,
                  body: `No branch for slug \`${slugArg}\` under \`${base}-*\`. Run \`@torchxpubot fix\` first.` });
                core.setFailed(`no branch for slug ${slugArg}`);
                return;
              }
            }
            if (!branches.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue,
                body: `No branch \`${base}\` (or \`${base}-*\`) found. Run \`@torchxpubot fix\` first, and only use \`fix-pr-create\` after it pushes a verified fix.` });
              core.setFailed(`no fix branch for issue ${issue}`);
              return;
            }

            // Recover a sub-item's summary comment for the PR body. Batch uses
            // per-slug markers; single-bug uses the bare marker.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue, per_page: 100,
            });

            // Recover the verify-gate verdict the `fix` job labeled on its
            // diff comment (this run has no access to that run's gate_status),
            // so the PR body doesn't claim "independently re-verified" for a
            // branch the reviewer never confirmed. Batch: the sub-item's
            // section (per-bareSlug marker -> next marker). Single-bug: the
            // "Proposed fix on `<branch>`" comment. Returns true only when
            // that section explicitly shows the PASSED gate note. `bareSlug`
            // must be the bare slug (no seq prefix) that keys the markers.
            function gatePassed(branch, bareSlug) {
              const anchor = bareSlug
                ? `<!-- agent:fix-summary:issue-${issue}:${bareSlug} -->`
                : `Proposed fix on \`${branch}\``;
              const c = comments.slice().reverse().find(x => x.body && x.body.includes(anchor));
              if (!c) return false;
              let section = c.body;
              if (bareSlug) {
                const start = section.indexOf(anchor);
                let end = section.indexOf('<!-- agent:fix-summary:', start + anchor.length);
                section = section.slice(start, end === -1 ? undefined : end);
              }
              return section.includes('Verify gate: PASSED');
            }

            function bodyFor(branch, bareSlug) {
              const marker = bareSlug
                ? `<!-- agent:fix-summary:issue-${issue}:${bareSlug} -->`
                : `<!-- agent:fix-summary:issue-${issue} -->`;
              const verified = gatePassed(branch, bareSlug);
              const provenance = verified
                ? `The fix was built and independently re-verified by the \`fix\` job, and a ` +
                  `human reviewed the diff before this PR was opened;`
                : `The fix was built and self-verified by the \`fix\` job, but the independent ` +
                  `reviewer did **not** confirm it (see the verify-gate verdict on the issue's ` +
                  `fix-diff comment); a human reviewed the diff before this PR was opened;`;
              const boilerplate =
                `\nFixes #${issue}\n\n---\n_Draft PR opened by \`@torchxpubot fix-pr-create\` from the ` +
                `fix branch \`${branch}\`. ${provenance} kept as a ` +
                `draft for a final check before merge._`;
              const hit = comments.slice().reverse().find(c => c.body && c.body.includes(marker));
              if (!hit) return boilerplate;
              // For a grouped batch comment, take just this sub-item's section
              // (from its marker to the next marker or end).
              let text = hit.body;
              if (bareSlug) {
                const start = text.indexOf(marker);
                let end = text.indexOf('<!-- agent:fix-summary:', start + marker.length);
                text = text.slice(start, end === -1 ? undefined : end);
              }
              return `${text.replace(marker, '').trim()}\n${boilerplate}`;
            }

            const opened = [], skipped = [];
            for (const branch of branches) {
              const bareSlug = bareSlugOf(branch);
              const label = bareSlug || 'fix';
              // Skip if a PR from this head is already open.
              const existing = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
              if (existing.data.length) { skipped.push(`\`${label}\` (already open: ${existing.data[0].html_url})`); continue; }
              try {
                const pr = await github.rest.pulls.create({
                  owner, repo, head: branch, base: 'main', draft: true,
                  title: bareSlug ? `Fix issue #${issue}: ${bareSlug}` : `Fix issue #${issue}`,
                  body: bodyFor(branch, bareSlug),
                });
                opened.push(`\`${label}\` → ${pr.data.html_url}`);
              } catch (e) {
                skipped.push(`\`${label}\` (error: ${e.message})`);
              }
            }

            const lines = [];
            if (opened.length) lines.push(`Opened ${opened.length} draft PR(s):`, ...opened.map(o => `- ${o}`));
            if (skipped.length) lines.push(`Skipped ${skipped.length}:`, ...skipped.map(s => `- ${s}`));
            await github.rest.issues.createComment({ owner, repo, issue_number: issue,
              body: lines.join('\n') || 'Nothing to open.' });
            // #4: all creations may have thrown into `skipped`; fail unless at
            // least one PR actually opened.
            if (!opened.length) core.setFailed('no PRs opened');

  triage:
    needs: parse-command
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      needs.parse-command.outputs.command == 'triage'
      && needs.parse-command.outputs.authorized == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run AI triage
        id: ai-triage
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.MERGE_TOKEN }}
          settings: '{"alwaysThinkingEnabled": true}'
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 20 --allowedTools Bash,Read,Glob,Grep"
          prompt: |
            Use the /issue-triage skill to triage issue
            #${{ needs.parse-command.outputs.issue_number }} in ${{ github.repository }}.
            The skill returns a report (a markdown block plus a JSON
            block) to stdout. Do NOT post any comment yourself, do NOT
            apply labels, do NOT modify the issue in any way — the
            workflow that invoked you will consume your stdout and
            handle those side effects.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      - name: Post triage report
        if: steps.ai-triage.outcome == 'success'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.parse-command.outputs.issue_number }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const file = '${{ steps.ai-triage.outputs.execution_file }}';
            if (!file || !fs.existsSync(file)) return;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const resultEvent = data.filter(e => e.type === 'result').pop();
            if (!resultEvent || resultEvent.is_error || !resultEvent.result) {
              core.setFailed('AI triage produced no usable result');
              return;
            }
            const output = resultEvent.result;

            // The skill emits a markdown block, a blank line, then a
            // JSON block fenced by ```json ... ```. Extract each.
            const jsonMatch = output.match(/```json\s*\n([\s\S]*?)\n```/);
            if (!jsonMatch) {
              core.setFailed('AI triage output did not include a JSON block');
              return;
            }
            let summary;
            try {
              summary = JSON.parse(jsonMatch[1]);
            } catch (e) {
              core.setFailed(`AI triage JSON parse failed: ${e.message}`);
              return;
            }

            // Markdown block is everything up to the ```json fence,
            // trimmed of trailing whitespace and any stray fence.
            const markdown = output.slice(0, jsonMatch.index)
              .replace(/```(markdown)?\s*\n?/g, '')
              .replace(/\n```\s*$/g, '')
              .trim();
            if (!markdown.startsWith('<!-- agent:triage -->')) {
              core.setFailed('AI triage markdown did not start with the <!-- agent:triage --> marker');
              return;
            }

            const N = Number(process.env.ISSUE_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Locate the previous triage comment via the REST list
            // endpoint — its ids are numeric and accepted by the
            // PATCH/DELETE endpoints below.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: N, per_page: 100 }
            );
            const triageIds = comments
              .filter(c => c.body && c.body.startsWith('<!-- agent:triage -->'))
              .map(c => c.id);

            if (triageIds.length === 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: N, body: markdown
              });
            } else {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: triageIds[0], body: markdown
              });
              // Best-effort dedup of any older duplicates.
              for (const dup of triageIds.slice(1)) {
                try {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: dup
                  });
                } catch (e) {
                  console.log(`Could not delete duplicate ${dup}: ${e.message}`);
                }
              }
            }

            // Apply suggested labels. Repeated add-label calls for an
            // already-applied label are no-ops.
            const labels = Array.isArray(summary.suggested_labels) ? summary.suggested_labels : [];
            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: N, labels
                });
              } catch (e) {
                console.log(`addLabels warning: ${e.message}`);
              }
            }

      - name: "Verify: AI triage succeeded"
        if: always()
        uses: actions/github-script@v9
        env:
          AI_TRIAGE_OUTCOME: ${{ steps.ai-triage.outcome }}
          BOT_ESCALATION_USERS: ${{ secrets.BOT_ESCALATION_USERS }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const outcome = process.env.AI_TRIAGE_OUTCOME || 'skipped';
            const file = '${{ steps.ai-triage.outputs.execution_file }}';

            let result = null;
            if (file && fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              result = data.filter(e => e.type === 'result').pop();
              console.log('Result:', JSON.stringify(result, null, 2));
            }
            if (outcome === 'success' && result && !result.is_error && result.total_cost_usd > 0) {
              return;
            }

            // Distinguish "the agent never ran" from "the agent failed", so
            // the comment does not blame Bedrock for a setup or cancellation.
            let reason;
            if (outcome === 'cancelled') {
              reason = 'the run was cancelled.';
            } else if (outcome === 'skipped') {
              reason = 'the environment setup failed before the agent started -- checkout or claude-code-action itself.';
            } else if (result && result.is_error) {
              reason = 'the agent returned an error. This is usually a Bedrock or model failure; check AWS token validity.';
            } else if (!result) {
              reason = 'the agent produced no output. This is usually a Bedrock connectivity or credential failure; check AWS token validity.';
            } else {
              reason = 'the agent exited without a usable result.';
            }

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const job = jobs.data.jobs.find(j => j.name === 'triage');
            const jobUrl = job?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.parse-command.outputs.issue_number }},
              body: `${process.env.BOT_ESCALATION_USERS} \`@torchxpubot triage\` failed: ${reason}\n\nSee the [\`triage\` job](${jobUrl}) for details.`
            });
            if (outcome !== 'cancelled') {
              core.setFailed(`AI triage failed: ${reason}`);
            }

      - name: Report usage cost
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const file = '${{ steps.ai-triage.outputs.execution_file }}';
            if (!file || !fs.existsSync(file)) return;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const result = data.filter(e => e.type === 'result').pop();
            if (!result) return;

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId
            });
            const job = jobs.data.jobs.find(j => j.name === 'triage');
            const jobUrl = job?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const date = new Date().toISOString().split('T')[0];
            const cost = (result.total_cost_usd || 0).toFixed(4);
            const usage = Object.values(result.modelUsage || {})[0] || {};
            const inTok = ((usage.inputTokens || 0) + (usage.cacheReadInputTokens || 0) + (usage.cacheCreationInputTokens || 0)).toLocaleString();
            const outTok = (usage.outputTokens || 0).toLocaleString();
            const status = result.is_error ? 'error' : 'ok';

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ${{ env.COST_TRACKING_ISSUE }},
              body: `\`${date}\` [\`triage\`](${jobUrl}) on #${{ needs.parse-command.outputs.issue_number }} — **$${cost}** (${inTok} in / ${outTok} out) [${status}]`
            });

  token-permission-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: "Test: MERGE_TOKEN has PR read/write access"
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            console.log(`pulls.get OK - PR #${pr.data.number}`);

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            console.log(`pulls.listReviews OK - ${reviews.data.length} reviews`);

            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            console.log(`checks.listForRef OK - ${checks.data.total_count} checks`);

            // Test comment create + delete
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Bot token permission test -- this comment will be deleted.'
            });
            console.log(`issues.createComment OK`);
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: comment.data.id, content: '+1'
            });
            console.log(`reactions.createForIssueComment OK`);
            await github.rest.issues.deleteComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: comment.data.id
            });
            console.log(`issues.deleteComment OK`);

            // Test merge permission (dry-run with wrong SHA)
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                merge_method: 'squash',
                sha: '0000000000000000000000000000000000000000'
              });
            } catch (e) {
              if (e.status === 409 || e.status === 422 || e.status === 405) {
                console.log(`pulls.merge permission OK (got ${e.status})`);
              } else {
                core.setFailed(`pulls.merge permission DENIED: ${e.status}`);
              }
            }

      - name: "Test: AWS Bedrock connectivity via Claude Code Action"
        id: bedrock-test
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.MERGE_TOKEN }}
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 1"
          use_sticky_comment: "true"
          show_full_output: "true"
          prompt: |
            Reply with exactly: "Bedrock connectivity test passed."
            Do not do anything else.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      - name: "Verify: Bedrock test actually succeeded"
        uses: actions/github-script@v9
        env:
          BOT_ESCALATION_USERS: ${{ secrets.BOT_ESCALATION_USERS }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const file = '${{ steps.bedrock-test.outputs.execution_file }}';
            let ok = false;
            if (file && fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const result = data.filter(e => e.type === 'result').pop();
              console.log('Result:', JSON.stringify(result, null, 2));
              ok = result && !result.is_error && result.total_cost_usd > 0;
            }
            if (!ok) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `${process.env.BOT_ESCALATION_USERS} Bedrock connectivity test failed. Please check AWS token validity.`
              });
              core.setFailed('Bedrock test failed.');
            } else {
              console.log('Bedrock connectivity verified.');
            }
