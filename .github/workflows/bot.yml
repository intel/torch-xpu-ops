            });

      - name: "Verify: AI analysis succeeded"
        if: steps.collect.outputs.has_data == 'true'
        uses: actions/github-script@v9
        env:
          BOT_ESCALATION_USERS: ${{ secrets.BOT_ESCALATION_USERS }}
