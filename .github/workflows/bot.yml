        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MERGE_TOKEN }}
          fetch-depth: 0

      - name: Cherry-pick onto the release branch
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
          PR_NUMBER: ${{ needs.parse-command.outputs.pr_number }}
          ONTO_BRANCH: ${{ needs.parse-command.outputs.onto_branch }}
          CLASSIFICATION: ${{ needs.parse-command.outputs.classification }}
          FIXES: ${{ needs.parse-command.outputs.fixes }}
