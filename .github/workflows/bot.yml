            if (!file || !fs.existsSync(file)) return;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const result = data.filter(e => e.type === 'result').pop();
            if (!result || result.is_error || !result.result) return;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const job = jobs.data.jobs.find(j => j.name === 'ut-check');
            const jobUrl = job?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.payload.comment;
            const header = `> Replying to [this comment](${trigger.html_url}) by @${trigger.user.login}\n\n`;
            const footer = `\n\n---\n_Generated by [\`ut-check\` job](${jobUrl})._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.parse-command.outputs.pr_number }},
              body: header + result.result + footer
            });

      - name: "Verify: AI analysis succeeded"
        if: steps.collect.outputs.has_data == 'true'
        uses: actions/github-script@v9
        env:
          BOT_ESCALATION_USERS: ${{ secrets.BOT_ESCALATION_USERS }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const file = '${{ steps.ai-analysis.outputs.execution_file }}';
            let ok = false;
            if (file && fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const result = data.filter(e => e.type === 'result').pop();
              console.log('Result:', JSON.stringify(result, null, 2));
              ok = result && !result.is_error && result.total_cost_usd > 0;
            }
            if (!ok) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ needs.parse-command.outputs.pr_number }},
                body: `${process.env.BOT_ESCALATION_USERS} \`@torchxpubot ut-check\` failed: Bedrock returned an error or no output. Please check AWS token validity.`
              });
              core.setFailed('AI analysis failed.');
            }

      - name: Report usage cost
        if: always() && steps.collect.outputs.has_data == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const fs = require('fs');
            const file = '${{ steps.ai-analysis.outputs.execution_file }}';
            if (!file || !fs.existsSync(file)) return;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const result = data.filter(e => e.type === 'result').pop();
            if (!result) return;

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId
            });
            const job = jobs.data.jobs.find(j => j.name === 'ut-check');
            const jobUrl = job?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const date = new Date().toISOString().split('T')[0];
            const cost = (result.total_cost_usd || 0).toFixed(4);
            const usage = Object.values(result.modelUsage || {})[0] || {};
            const inTok = ((usage.inputTokens || 0) + (usage.cacheReadInputTokens || 0) + (usage.cacheCreationInputTokens || 0)).toLocaleString();
            const outTok = (usage.outputTokens || 0).toLocaleString();
            const status = result.is_error ? 'error' : 'ok';

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ${{ env.COST_TRACKING_ISSUE }},
              body: `\`${date}\` [\`ut-check\`](${jobUrl}) on #${{ needs.parse-command.outputs.pr_number }} — **$${cost}** (${inTok} in / ${outTok} out) [${status}]`
            });

      - name: Deterministic fallback
        if: steps.collect.outputs.has_data == 'true' && failure()
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: |
          python .github/scripts/bot_ut_check.py \
            --pr-number ${{ needs.parse-command.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --deterministic

  cherry-pick:
    needs: parse-command
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      needs.parse-command.outputs.command == 'cherry-pick'
      && needs.parse-command.outputs.authorized == 'true'
    steps:
