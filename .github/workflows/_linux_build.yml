name: Linux PyTorch XPU Build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Runner label for build job
      omix_version:
        required: true
        type: string
        description: OMIX version (0.6.0 or 0.5.0)
      wheel_run_id:
        required: true
        type: string
        description: Run ID in intel-innersource/frameworks.ai.pytorch.torch-xpu-ops
      wheel_artifact:
        required: true
        type: string
        description: Artifact name in intel-innersource/frameworks.ai.pytorch.torch-xpu-ops
      rhel_omix_repo:
        required: true
        type: string
        description: RHEL 8.10 repo URL for intel-omix-devel
      expected_sycl_ver:
        required: true
        type: string
        description: Expected SYCL_COMPILER_VERSION in torch.__config__.show()
      pytorch:
        type: string
        default: 'main'
        description: Pytorch commit
      torch_xpu_ops:
        type: string
        default: 'main'
        description: Torch-xpu-ops commit
      triton:
        required: false
        type: string
        default: 'nightly_wheel'
        description: Triton-XPU nightly wheel
      python:
        type: string
        default: '3.12.15'
        description: Python version
      category:
        type: string
        default: ''
        description: Optional artifact tag
    secrets:
      WHEEL_DOWNLOAD_TOKEN:
        required: true
      DOCKER_HUB_TOKEN:
        required: false

permissions: read-all

defaults:
  run:
    shell: bash -xe {0}
env:
  DOCKER_REGISTRY_AUTH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  build:
    name: omix-${{ inputs.omix_version }}-wheels
    runs-on: ${{ inputs.runner }}
    container:
      image: 'pytorch/manylinux2_28-builder:cpu-main'
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      env:
        PATH: /tmp/xpu-tool/myvenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        PIP_CACHE_DIR: /tmp/xpu-tool/.pipcache
        no_proxy: localhost,127.0.0.1,intel.com,.intel.com,laurentides.igk.intel.com
        NO_PROXY: localhost,127.0.0.1,intel.com,.intel.com,laurentides.igk.intel.com
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 120
    steps:
      - name: Install gh-cli and OMIX ${{ inputs.omix_version }}
        run: |
          cat /etc/os-release
          hostname && id
          dnf install -y sudo 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh --repo gh-cli
          gh --version
          rm -rf ${{ github.workspace }}/*.whl ${{ github.workspace }}/*.log ${{ github.workspace }}/omix-torch-wheel

          echo 'sslverify=False' >> /etc/dnf/dnf.conf
          rpm --import https://repositories.intel.com/gpu/intel-graphics.key
          dnf config-manager --add-repo "${{ inputs.rhel_omix_repo }}"
          dnf clean all
          dnf install -y intel-omix-devel
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
        with:
          path: torch-xpu-ops
      - name: Resolve CI config
        uses: ./torch-xpu-ops/.github/actions/ci-config
        with:
          python: ${{ inputs.python }}
      - name: Setup python-${{ env.PYTHON_VERSION }}
        run: |
          rm -rf /tmp/xpu-tool/myvenv
          local_python=$(echo ${PYTHON_VERSION} |awk -F. '{printf("cp%s%s-cp%s%s", $1, $2, $1, $2)}')
          /opt/python/${local_python}/bin/python -m venv /tmp/xpu-tool/myvenv
          echo "VENV_ROOT=/tmp/xpu-tool/myvenv" >> "${GITHUB_ENV}"
          which python && python -V
          which pip && pip list
          pip install -U pip wheel "setuptools<81"
      - name: Configure oneAPI setvars.sh
        run: |
          echo "XPU_ONEAPI_PATH=/opt/intel/oneapi" >> "${GITHUB_ENV}"
          cat <<'EOF' > "${RUNNER_TEMP}/oneapi_env.sh"
          if [ -f /opt/intel/oneapi/setvars.sh ] && [ "${SETVARS_COMPLETED:-}" != "1" ]; then
            case "$-" in
              *u*) set +u; source /opt/intel/oneapi/setvars.sh > /dev/null 2>&1 || true; set -u ;;
              *)   source /opt/intel/oneapi/setvars.sh > /dev/null 2>&1 || true ;;
            esac
            if [ -n "${VENV_ROOT:-}" ] && [ -d "${VENV_ROOT}/bin" ]; then
              export PATH="${VENV_ROOT}/bin:${PATH}"
            fi
          fi
          EOF
          echo "BASH_ENV=${RUNNER_TEMP}/oneapi_env.sh" >> "${GITHUB_ENV}"
      - name: Snapshot open skipped issues at build start
        run: |
          touch known_issue_static.log issues_snapshot.log issues_snapshot_bmg.log issues_snapshot_dpclang.log
          bash torch-xpu-ops/.github/scripts/ut_known_issues.sh static > known_issue_static.log
          bash torch-xpu-ops/.github/scripts/ut_known_issues.sh open "${{ inputs.category }}" > issues_snapshot.log
          bash torch-xpu-ops/.github/scripts/ut_known_issues.sh open "" "bmg-test" "extra-only" > issues_snapshot_bmg.log
          bash torch-xpu-ops/.github/scripts/ut_known_issues.sh open "dpclang" "" "extra-only" > issues_snapshot_dpclang.log
      - name: Upload known issues snapshot
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: UT-Known-Issues${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
          path: |
            known_issue_static.log
            issues_snapshot.log
            issues_snapshot_bmg.log
            issues_snapshot_dpclang.log
      - name: Download OMIX PyTorch wheel
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.WHEEL_DOWNLOAD_TOKEN }}
          repository: intel-innersource/frameworks.ai.pytorch.torch-xpu-ops
          run-id: ${{ inputs.wheel_run_id }}
          name: ${{ inputs.wheel_artifact }}
          path: ${{ github.workspace }}/omix-torch-wheel
      - name: Install OMIX PyTorch wheel and fetch PyTorch pins
        run: |
          icpx --version
          ls -lh ${{ github.workspace }}/omix-torch-wheel/torch-*.whl
          cp ${{ github.workspace }}/omix-torch-wheel/torch-*.whl ${{ github.workspace }}/
          pip install ${{ github.workspace }}/torch-*.whl
          TORCH_COMMIT_ID="$(python -c 'import torch; print(torch.version.git_version)')"
          echo "TORCH_COMMIT_ID=${TORCH_COMMIT_ID}" >> "${GITHUB_ENV}"
          rm -rf ${{ github.workspace }}/pytorch
          git init ${{ github.workspace }}/pytorch
          git -C ${{ github.workspace }}/pytorch fetch --depth 1 https://github.com/pytorch/pytorch.git "${TORCH_COMMIT_ID}"
          git -C ${{ github.workspace }}/pytorch checkout FETCH_HEAD
      - name: Build PyTorch-pinned Torchvision and Torchaudio
        run: |
          source /opt/rh/gcc-toolset-${GCC_VERSION}/enable
          pip install numpy packaging typing_extensions pillow cmake ninja pybind11
          cd ${{ github.workspace }}/pytorch
          TORCHVISION_COMMIT_ID="$(tr -d '[:space:]' < .github/ci_commit_pins/vision.txt)"
          TORCHAUDIO_COMMIT_ID="$(tr -d '[:space:]' < .github/ci_commit_pins/audio.txt)"
          echo "Building pinned torchvision=${TORCHVISION_COMMIT_ID} torchaudio=${TORCHAUDIO_COMMIT_ID}"

          git clone --single-branch -b main https://github.com/pytorch/vision.git xpu-vision
          (
            cd xpu-vision
            git checkout "${TORCHVISION_COMMIT_ID}"
            python setup.py bdist_wheel 2>&1 | tee ${{ github.workspace }}/build_vision_${TORCHVISION_COMMIT_ID}.log
          )
          ls -lh xpu-vision/dist/torchvision-*.whl
          pip install --no-deps xpu-vision/dist/torchvision-*.whl
          cp xpu-vision/dist/torchvision-*.whl ${{ github.workspace }}/

          git clone --single-branch -b main https://github.com/pytorch/audio.git xpu-audio
          (
            cd xpu-audio
            git checkout "${TORCHAUDIO_COMMIT_ID}"
            python setup.py bdist_wheel 2>&1 | tee ${{ github.workspace }}/build_audio_${TORCHAUDIO_COMMIT_ID}.log
          )
          ls -lh xpu-audio/dist/torchaudio-*.whl
          pip install --no-deps xpu-audio/dist/torchaudio-*.whl
          cp xpu-audio/dist/torchaudio-*.whl ${{ github.workspace }}/
      - name: Download Nightly Triton-XPU Wheel
        run: |
          rm -f ${{ github.workspace }}/*triton*.whl
          pip download --no-deps --index-url https://download.pytorch.org/whl/nightly/xpu --pre triton-xpu --dest ${{ github.workspace }}/
          ls -lh ${{ github.workspace }}/*triton*.whl
          pip install filelock
          pip install --no-deps ${{ github.workspace }}/*triton*.whl
      - name: Verify Torch Config and Wheel Integrity
        run: |
          printenv | grep -E 'ONEAPI|CMPLR|MKL|SETVARS|LD_LIBRARY_PATH' || true
          python -c "import torch; cfg = torch.__config__.show(); print(cfg); assert 'SYCL_COMPILER_VERSION=${{ inputs.expected_sycl_ver }}' in cfg, f'Expected SYCL_COMPILER_VERSION=${{ inputs.expected_sycl_ver }} not found'"
          python -c "import torch; assert torch.version.git_version == '${TORCH_COMMIT_ID}', f'Torch replaced: {torch.version.git_version}'"
          python -c "import torch; print(torch.__config__.parallel_info())"
          python -c "import triton; print('triton:', triton.__version__)"
          python -c "import torchvision; print('torchvision:', torchvision.__version__)"
          python -c "import torchaudio; print('torchaudio:', torchaudio.__version__)"
          python pytorch/torch/utils/collect_env.py | tee ${{ github.workspace }}/build_collect_env.log
          pip list | grep -E 'torch|intel|triton'
          ls -lh ${{ github.workspace }}/*.whl
      - name: Upload Torch XPU Wheel
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: Torch-XPU-Wheel-${{ github.event.pull_request.number || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
          path: ${{ github.workspace }}/*.whl
      - name: Upload Build Log
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Torch-XPU-Build-Log-${{ github.event.pull_request.number || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
          path: ${{ github.workspace }}/build_*.log
      - name: Cleanup workspace
        if: ${{ always() }}
        run: |
          chmod 777 /__w /github ./ -R

  build-status-check:
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check build result
        run: |
          result="${{ needs.build.result }}"
          echo "build result: $result"
          if [ "$result" = "skipped" ]; then
            echo "build was skipped, marking as pass"
            exit 0
          elif [ "$result" = "success" ]; then
            echo "build passed"
            exit 0
          else
            echo "build failed with result: $result"
            exit 1
          fi
