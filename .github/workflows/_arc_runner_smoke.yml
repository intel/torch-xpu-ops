name: fix build smoke

# One-shot smoke test: prove the AGENT can drive the whole fix-in-the-loop chain
# on the xpu-agent runner — install the nightly wheel, reproduce the failure,
# apply the fix, install the Intel build toolchain, source-build PyTorch, and
# verify — solving problems itself as it goes. Collects real data (install time,
# cold build time, GPU visibility) via the agent transcript + cost.
#
# Sample (ground truth): issue #4980 / PR #5004 — FFT empty-batch oneMKL fix.
# A single-file C++ change (src/ATen/native/xpu/mkl/SpectralOps.cpp, +8/-0)
# that a nightly wheel CANNOT verify, so it exercises the source-build path.
#
# NOTE ON FILE PATH: this reuses the `_arc_runner_smoke.yml` path on purpose.
# workflow_dispatch only lists workflows whose file path exists on the default
# branch; this path already does. Trigger with an explicit ref pointing at the
# smoke branch so the runner checks out THIS content, without merging to main:
#   gh workflow run _arc_runner_smoke.yml --ref agent-fix-build-smoke/zzq
# main's real arc-runner-smoke is untouched; drop this branch when done.

on:
  workflow_dispatch:
    inputs:
      nightly_version:
        description: "Nightly torch version to reproduce against. Must PREDATE the fix so the bug still reproduces (latest nightly already contains it and will NOT reproduce)."
        default: "2.15.0.dev20260817+xpu"
      fix_pr:
        description: "torch-xpu-ops PR number to pull the fix diff from"
        default: "5004"
      oneapi_installer:
        description: "Known-good Intel DLE offline installer URL (agent may also find its own from the prereq doc). 2026.1 matches PyTorch 2.14+."
        default: "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/c109e1ae-e02c-48a6-917b-b03b90d33f77/intel-deep-learning-essentials-2026.1.2.25_offline.sh"

env:
  BEDROCK_MODEL: global.anthropic.claude-opus-5
  # UT node ids from PR #5004 test plan. Node ids are relative to <pytorch>/test
  # (pytest MUST run from test/, not the pytorch root — the root torch/ source
  # dir shadows the installed wheel: "No module named torch.version").
  FFT_FAIL_TESTS: >-
    test_ops_fwd_gradients.py::test_fn_fwgrad_bwgrad_fft_fft2_xpu_float64
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fftn_xpu_int32
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_irfft_xpu_bool
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_hfft_xpu_float64
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fft_xpu_float64
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fft2_xpu_float16
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fftn_xpu_float16
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fft2_xpu_float64
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_ifft_xpu_bool
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fft_xpu_bool
  FFT_REGRESSION_TESTS: >-
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fft_xpu_float32
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fft2_xpu_float32
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_fftn_xpu_float32
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_ifft_xpu_float32
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_irfft_xpu_float32
    inductor/test_torchinductor_opinfo.py::test_comprehensive_fft_rfft_xpu_float32

permissions:
  contents: read

jobs:
  smoke:
    runs-on: xpu-agent
    timeout-minutes: 480
    container:
      image: intelgpu/ubuntu-26.04-rolling:26.18
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_ADMIN
              --shm-size=8g --privileged -e ZE_AFFINITY_MASK
    env:
      GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
      NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      FIX_PR: ${{ inputs.fix_pr }}
      PYTORCH_DIR: ${{ github.workspace }}/pytorch
    steps:
      - name: Checkout torch-xpu-ops (for AGENTS.md + skills)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MERGE_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "torchxpubot"
          git config --global user.email "torchxpubot@intel.com"

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python: '3.10'

      # The agent drives the ENTIRE chain and solves problems itself. The
      # workflow only provisions runner + container + GPU + Python. Nothing is
      # pre-installed or pre-built.
      - name: Agent — reproduce, fix, build, verify
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.MERGE_TOKEN }}
          settings: '{"alwaysThinkingEnabled": true}'
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 400 --allowedTools Bash,Read,Glob,Grep,WebFetch,Skill,Task,Write,Edit"
          prompt: |
            You are running on an Intel XPU (GPU) CI runner inside a container
            that exposes the host GPU via /dev/dri. The torch-xpu-ops repo is
            checked out at ${{ github.workspace }} (read its AGENTS.md; the
            /xpu-build-pytorch skill is available). Nothing else is installed or
            built yet. `gh` is authenticated (GH_TOKEN in env).

            GOAL: prove end to end that the fix in torch-xpu-ops PR #${{ inputs.fix_pr }}
            resolves issue #4980 (empty-batch FFT oneMKL failure) by reproducing
            the bug on a nightly wheel, then source-building PyTorch with the fix
            and showing the tests pass. Work the problem yourself: if a step
            fails, diagnose and retry. Do NOT write or invent the fix — take it
            from PR #${{ inputs.fix_pr }}.

            Environment facts you must respect:
            - Run pytest from ${{ env.PYTORCH_DIR }}/test, NEVER from the pytorch
              root: the root torch/ source dir shadows the installed torch and
              yields "No module named torch.version".
            - triton-xpu ships as a dependency of the torch+xpu wheel; no separate
              install. You still need pip: pytest expecttest hypothesis.
            - This container has NO Intel apt repo, so
              `apt install intel-deep-learning-essentials` will FAIL. Install the
              Intel Deep Learning Essentials from the OFFLINE installer instead.
              A known-good URL: ${{ inputs.oneapi_installer }}
              (or find the current one via the prereq doc:
              ${{ env.PYTORCH_DIR }}/docs/source/notes/get_start_xpu.md and its
              linked Intel page — use WebFetch).

            STEPS:
            1. Install the nightly XPU wheel (torch ONLY, no vision/audio),
               pinned to the version that still has the bug:
                 pip install --pre "torch==${{ inputs.nightly_version }}" \
                   --index-url https://download.pytorch.org/whl/nightly/xpu
               Record torch.__version__, torch.xpu.is_available(), and
               torch.version.git_version (freeze this pytorch commit).
            2. Clone pytorch at that frozen commit into ${{ env.PYTORCH_DIR }}.
               From ${{ env.PYTORCH_DIR }}/test, run these UTs and CONFIRM they
               FAIL on the nightly wheel (this is the "before" reproduction):
                 ${{ env.FFT_FAIL_TESTS }}
               If they do not genuinely FAIL (e.g. only collection errors, or they
               pass), STOP and report — the nightly version is wrong.
            3. Populate the submodule with the fix: clone intel/torch-xpu-ops into
               ${{ env.PYTORCH_DIR }}/third_party/torch-xpu-ops, apply the PR
               #${{ inputs.fix_pr }} diff (`gh pr diff` — a plain unified diff),
               and set the development pin override per AGENTS.md
               (git rev-parse HEAD > ${{ env.PYTORCH_DIR }}/third_party/xpu.txt).
            4. Install the Intel Deep Learning Essentials (offline installer, see
               above) and any compiler it needs. Source its setvars.sh.
            5. Source-build PyTorch via the /xpu-build-pytorch skill:
               USE_XPU=1 USE_CUDA=0, then
               `pip install -e . -v --no-build-isolation` from
               ${{ env.PYTORCH_DIR }}. Confirm torch.xpu.is_available() is True on
               the source build (check from the test/ dir).
            6. Verify the fix: from ${{ env.PYTORCH_DIR }}/test, run the same UTs
               from step 2 and confirm they now PASS, plus these regressions still
               pass:
                 ${{ env.FFT_REGRESSION_TESTS }}
            7. Write ${{ env.PYTORCH_DIR }}/build_pytorch.env that a later step can
               source to reproduce your runtime (exports USE_XPU=1, USE_CUDA=0,
               sources your DLE setvars.sh). Also write a JSON summary to
               /tmp/agent_result.json with keys: reproduced_before (bool),
               build_ok (bool), xpu_available (bool), verified_after (bool),
               fail_before_count, pass_after_count, dle_install_seconds,
               cold_build_seconds, notes.

            Report a concise before/after summary at the end.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      # Confirm the agent actually ran (setup can fail before Bedrock is hit; the
      # action still exits 0). Separates "never ran" from "ran but failed".
      - name: Check agent executed
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = '${{ steps.agent.outputs.execution_file }}';
            if (!file || !fs.existsSync(file)) {
              core.setFailed('agent produced no execution_file — it never ran (setup/auth failure)');
              return;
            }
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const result = data.filter(e => e.type === 'result').pop();
            if (!result) { core.setFailed('agent execution_file has no result entry'); return; }
            if (result.is_error) { core.setFailed('agent reported an error: ' + (result.subtype || 'unknown')); return; }
            core.info('agent ran; cost $' + (result.total_cost_usd || 0).toFixed(4));

      # Objective gate: claude-code-action exits 0 regardless of the agent's own
      # conclusion, so re-run the verify assertions independently against the
      # build the agent produced. This — not the agent's self-report — decides
      # job success.
      - name: Verify gate — independent recheck
        run: |
          set -uxo pipefail
          cd "$PYTORCH_DIR"
          [ -f build_pytorch.env ] || { echo "::error::agent did not write build_pytorch.env; chain incomplete"; exit 1; }
          # shellcheck disable=SC1091
          source build_pytorch.env
          # Run from test/ to avoid the root torch/ source-dir shadow.
          cd "$PYTORCH_DIR/test"
          avail=$(python -c "import torch; print(torch.xpu.is_available())")
          echo "### verify gate (independent recheck)" >> "$GITHUB_STEP_SUMMARY"
          echo "- xpu available (source): \`$avail\`" >> "$GITHUB_STEP_SUMMARY"
          [ "$avail" = "True" ] || { echo "::error::source build has no XPU"; exit 1; }
          pass=0; total=0
          for nid in $FFT_FAIL_TESTS $FFT_REGRESSION_TESTS; do
            total=$((total+1))
            if python -m pytest "$nid" -v --no-header -p no:cacheprovider \
                 2>&1 | tee -a /tmp/after.log >/dev/null; then
              pass=$((pass+1))
            else
              echo "STILL FAILING (after): $nid" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "- passed: \`$pass/$total\`" >> "$GITHUB_STEP_SUMMARY"
          [ "$pass" -eq "$total" ] || { echo "::error::verify gate: $pass/$total passed"; exit 1; }

      - name: Report agent cost
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = '${{ steps.agent.outputs.execution_file }}';
            if (!file || !fs.existsSync(file)) return;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const r = data.filter(e => e.type === 'result').pop();
            if (!r) return;
            const usage = Object.values(r.modelUsage || {})[0] || {};
            const inTok = (usage.inputTokens||0)+(usage.cacheReadInputTokens||0)+(usage.cacheCreationInputTokens||0);
            const line = `### agent cost\n- **$${(r.total_cost_usd||0).toFixed(4)}** ` +
              `(${inTok.toLocaleString()} in / ${(usage.outputTokens||0).toLocaleString()} out), ` +
              `turns=${r.num_turns||'?'}`;
            await core.summary.addRaw(line + '\n').write();

      # Persist the agent transcript (thinking + every tool call/result) so the
      # run can be reviewed. Otherwise discarded with the runner.
      - name: Stage agent transcript
        if: always()
        run: |
          f='${{ steps.agent.outputs.execution_file }}'
          if [ -n "$f" ] && [ -f "$f" ]; then
            cp "$f" /tmp/agent_transcript.json
            echo "staged agent transcript ($(wc -c < /tmp/agent_transcript.json) bytes)"
          fi

      - name: Upload logs + transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/after.log
            /tmp/agent_result.json
            /tmp/agent_transcript.json
          if-no-files-found: ignore

      # Files created inside the privileged container are root-owned; hand them
      # back so the next checkout on this self-hosted runner does not fail.
      - name: Cleanup workspace
        if: always()
        run: chown 1000:1000 /__w /github ./ -R || true
