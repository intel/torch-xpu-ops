name: fix build smoke

# PROBE-ONLY run (temporary). Goal: find out (a) whether the `bmg-test` label
# has an online machine at all, and (b) the real uid:gid the runner service
# uses inside this privileged container, so the cleanup `chown` in the full fix
# flow can be set correctly instead of guessing 1000 vs stat /__e.
#
# It deliberately does NOTHING heavy: no agent, no source build, no bun install,
# no artifact upload, no chown. It only starts the container, prints ownership +
# GPU visibility, and exits. That keeps the shared BMG runner clean so this
# probe cannot brick the next job.
#
# FILE PATH NOTE: reuses the `_arc_runner_smoke.yml` path on purpose.
# workflow_dispatch only lists workflows whose path exists on the default
# branch; this one does. Trigger with an explicit ref:
#   gh workflow run _arc_runner_smoke.yml --ref agent-fix-build-smoke/zzq

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: bmg-test
    timeout-minutes: 30
    container:
      image: intel/omix:0.3.0-devel-ubuntu26.04
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_ADMIN
              --shm-size=8g --privileged -e ZE_AFFINITY_MASK
    steps:
      - name: Probe runner ownership
        run: |
          echo "id: $(id)"
          for p in /__e /__w /__w/_actions /__w/_tool /__w/_temp /github; do
            echo "$p -> $(stat -c '%u:%g (%U:%G)' "$p" 2>/dev/null || echo 'missing')"
          done

      - name: Probe GPU visibility
        run: |
          ls -l /dev/dri || echo "no /dev/dri"
          (source /opt/intel/oneapi/compiler/latest/env/vars.sh 2>/dev/null && icpx --version) || echo "oneAPI not on default path"
          command -v sycl-ls >/dev/null 2>&1 && sycl-ls || echo "sycl-ls unavailable"
