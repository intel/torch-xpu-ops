name: bot-review label

# Bot review gate, triggered like pytorch's hardened-pr-review.yml:
#   - a maintainer adds `in progress`, or
#   - the author pushes / reopens / marks ready while `in progress` is on and
#     `ready for review` is not.
# A passing review plus clean CI swaps `in progress` for `ready for review`;
# human review starts there.
# `no automated review` opts the PR out: it goes straight to `ready for review`.
# A maintainer requesting changes on a `ready for review` PR sends it back to
# `in progress`, which re-runs the review (see bot_review_demote.yml).
# When the `pull` workflow finishes, `promote` re-evaluates CI for the PR
# (.github/scripts/bot_review_promote.py), which also requests reviewers from
# the description's `Reviewers:` line on promotion. Review requests made while
# the PR is still `in progress` are withdrawn (`hold-review-request`).
# No PR code is checked out here. Writes use MERGE_TOKEN because GITHUB_TOKEN
# comments and labels do not trigger other workflows.

on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review, review_requested]
  workflow_run:
    workflows: ["bot-review demote capture", "pull"]
    types: [completed]

permissions: {}

jobs:
  trigger:
    if: |
      github.event_name == 'pull_request_target' &&
      github.repository_owner == 'intel' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no automated review') &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'in progress') ||
        (contains(fromJSON('["synchronize", "reopened", "ready_for_review"]'), github.event.action) &&
         contains(github.event.pull_request.labels.*.name, 'in progress') &&
         !contains(github.event.pull_request.labels.*.name, 'ready for review'))
      )
    concurrency:
      group: bot-review-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `@torchxpubot review\n\n_Automated review (\`${context.payload.action}\` by @${context.payload.sender.login})._`
            });

  # Opted out of automated review: skip straight to human review, like pytorch.
  opt-out:
    if: |
      github.event_name == 'pull_request_target' &&
      github.repository_owner == 'intel' &&
      contains(fromJSON('["labeled", "reopened", "ready_for_review"]'), github.event.action) &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'no automated review') &&
      contains(github.event.pull_request.labels.*.name, 'in progress')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: swap
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // The event snapshot can be stale; act on live state only.
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: issue_number })).data;
            const labels = pr.labels.map(l => l.name);
            if (pr.state !== 'open' || pr.draft || !labels.includes('no automated review') || !labels.includes('in progress')) return;
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['ready for review'] });
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'in progress' }).catch(() => {});
            core.setOutput('promoted', 'true');
      - name: Request reviewers
        if: steps.swap.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: python3 .github/scripts/bot_review_promote.py --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --request-reviewers

  # Reviewers are asked when the PR reaches `ready for review` (from the
  # description's `Reviewers:` line). A request made while the bot review is
  # still running is withdrawn; GitHub has already notified once, so this
  # mainly keeps the PR off the reviewer's queue until it is ready.
  hold-review-request:
    if: |
      github.event_name == 'pull_request_target' &&
      github.repository_owner == 'intel' &&
      github.event.action == 'review_requested' &&
      github.event.sender.login != 'torchxpubot' &&
      contains(github.event.pull_request.labels.*.name, 'in progress') &&
      !contains(github.event.pull_request.labels.*.name, 'ready for review') &&
      !contains(github.event.pull_request.labels.*.name, 'no automated review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
            const labels = pr.labels.map(l => l.name);
            if (!labels.includes('in progress') || labels.includes('ready for review') || labels.includes('no automated review')) return;
            const user = context.payload.requested_reviewer?.login;
            const team = context.payload.requested_team?.slug;
            await github.rest.pulls.removeRequestedReviewers({ owner, repo, pull_number,
              reviewers: user ? [user] : [], team_reviewers: team ? [team] : [] });
            const who = user ? `@${user}` : `team ${team}`;
            await github.rest.issues.createComment({ owner, repo, issue_number: pull_number,
              body: `Withdrew the review request for ${who}: this PR is still \`in progress\`. Reviewers are requested automatically once it reaches \`ready for review\`. To choose them, add a line like \`Reviewers: @alice @bob\` to the PR description.` });

  # A maintainer requested changes on a ready PR: back to `in progress`. Adding
  # that label fires `trigger` above, so the review re-runs and must see the
  # maintainer's comments addressed (pr-review skill, "Maintainer Comments").
  demote:
    if: |
      github.event_name == 'workflow_run' &&
      github.repository_owner == 'intel' &&
      github.event.workflow_run.name == 'bot-review demote capture' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            // The capture run can come from a PR's own copy of its workflow, so
            // its title is only a hint: everything below is re-checked live.
            const m = /^bot-review demote PR (\d+)$/.exec(process.env.RUN_TITLE || '');
            if (!m) return core.warning(`unexpected run title: ${process.env.RUN_TITLE}`);
            const { owner, repo } = context.repo;
            const issue_number = Number(m[1]);
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: issue_number })).data;
            const labels = pr.labels.map(l => l.name);
            if (pr.state !== 'open' || !labels.includes('ready for review') || labels.includes('no automated review')) return;
            // Latest state per reviewer; demote only for an outstanding change
            // request from a maintainer (triage access or above), not the author.
            const latest = new Map();
            for (const r of await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: issue_number, per_page: 100 })) {
              if (r.user && r.state !== 'COMMENTED') latest.set(r.user.login, r.state);
            }
            let by = null;
            for (const [username, state] of latest) {
              if (state !== 'CHANGES_REQUESTED' || username === pr.user.login) continue;
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username }).catch(() => ({ data: {} }));
              if (['triage', 'write', 'maintain', 'admin'].includes(data.role_name)) { by = username; break; }
            }
            if (!by) return;
            // Add before removing so the PR always carries a status label.
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['in progress'] });
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'ready for review' }).catch(() => {});
            await github.rest.issues.createComment({ owner, repo, issue_number,
              body: `@${by} requested changes, so this PR is back to \`in progress\`. Address the requested changes and push; the bot review re-runs and must find them addressed before the PR returns to \`ready for review\`.` });

  # CI finished: promote if the bot review passed and every CI failure also
  # fails on main. Runs from the default branch; the PR is found from the run,
  # and the script re-reads everything from the API.
  promote:
    if: |
      github.event_name == 'workflow_run' &&
      github.repository_owner == 'intel' &&
      github.event.workflow_run.name == 'pull' &&
      github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: bot-review-promote-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Find the PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # pull_requests is empty for fork PRs, so look the PR up by head ref
          # and keep it only if the run tested its current head.
          pr=$(gh api -X GET "repos/${{ github.repository }}/pulls" -f state=open -f "head=${HEAD_OWNER}:${HEAD_BRANCH}" \
               --jq ".[] | select(.head.sha == \"${HEAD_SHA}\") | .number" | head -n 1)
          echo "number=${pr}" >> "$GITHUB_OUTPUT"
      - name: Promote to ready for review
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: python3 .github/scripts/bot_review_promote.py --repo ${{ github.repository }} --pr ${{ steps.pr.outputs.number }}
