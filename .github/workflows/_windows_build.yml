name: Windows Build

on:
  workflow_call:
    inputs:
      pytorch:
        required: false
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        required: false
        type: string
        default: 'main'
        description: Torch-xpu-ops main by default, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      python:
        required: false
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.json
      runner:
        required: true
        type: string
        description: Runner label for build job

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

env:
  USE_XPU: 1
  XPU_VERSION: "2026.1"

jobs:
  build:
    if: ${{ ! endsWith(inputs.pytorch, '_wheel') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1000
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve python version
        uses: ./.github/actions/ci-config
        with:
          python: ${{ inputs.python }}
      - name: Setup conda environment
        shell: pwsh
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\setup_build_conda_env.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Pytorch Source
        shell: pwsh
        env:
          PYTORCH_REF: ${{ inputs.pytorch }}
          TORCH_XPU_OPS_REF: ${{ inputs.torch_xpu_ops }}
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\prepare_pytorch_source.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Pytorch XPU
        shell: pwsh
        run: |
          & cmd.exe /d /e:on /v:off /s /c "call `"$env:GITHUB_WORKSPACE\.github\scripts\windows\build_pytorch_xpu.bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows build log
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Torch-XPU-Windows-Log-${{ github.event.pull_request.number || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: 'C:\actions-runner\_work\torch-xpu-ops\pytorch\build_torch_wheel_log.log'
      - name: Upload Windows binary
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Torch-XPU-Windows-Binary-${{ github.event.pull_request.number || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: 'C:\actions-runner\_work\torch-xpu-ops\pytorch\dist'
          compression-level: 0

  build-status-check:
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check build result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          result="${BUILD_RESULT}"
          echo "build result: $result"
          if [ "$result" = "skipped" ]; then
            echo "build was skipped, marking as pass"
            exit 0
          elif [ "$result" = "success" ]; then
            echo "build passed"
            exit 0
          else
            echo "build failed with result: $result"
            exit 1
          fi
