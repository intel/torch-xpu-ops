name: Linux UT Test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Runner label
      pytorch:
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        type: string
        default: 'main'
        description: Torch-xpu-ops version, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      python:
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.json
      ut:
        required: true
        type: string
        description: UT scope. one of `op_regression,op_extended,op_ut,skipped_ut,torch_xpu,op_regression_dev1,xpu_distributed,upstream_distributed,upstream_inductor,upstream_default`
      category:
        type: string
        default: ''
        description: 'Optional artifact tag; also selects known-failure label scope (dpclang enables skipped_dpclang)'

permissions:
  contents: read

defaults:
  run:
    shell: bash -xe {0}
env:
  GH_TOKEN: ${{ github.token }}
  HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  DOCKER_REGISTRY_AUTH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  test-in-container:
    timeout-minutes: 2880
    env:
      TORCH_SERIALIZATION_DEBUG: '1'
    if: ${{ ! contains(inputs.ut, 'distributed') }}
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ contains(inputs.runner, 'bmg') && 'intelgpu/ubuntu-26.04-rolling:26.18' || 'intelgpu/ubuntu-24.04-lts2:2523.40' }}
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
        - /opt/xpu-test/_cache:/github/home/.cache/:rw
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_PTRACE --shm-size=8g
              -e ZE_AFFINITY_MASK
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Prepare test env
        uses: ./.github/actions/linux-testenv
        with:
          pytorch: ${{ inputs.pytorch }}
          torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
          python: ${{ inputs.python }}
          category: ${{ inputs.category }}
      - name: Run XPU UT Test
        uses: ./.github/actions/linux-uttest
        with:
          ut_name: ${{ inputs.ut }}
      - name: Record UT job metadata
        if: ${{ ! cancelled() }}
        run: |
          mkdir -p "${{ github.workspace }}/ut_log"
          # The check job reads this to know which known-failure labels and
          # which platform name apply to the artifact.
          {
            echo "UT_NAME=${{ inputs.ut }}"
            echo "UT_RUNNER=${{ inputs.runner }}"
            echo "UT_CATEGORY=${{ inputs.category }}"
          } > "${{ github.workspace }}/ut_log/ut_meta.env"
      - name: Upload UT data
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: UT-Data-linux-${{ inputs.ut }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ut_log
          if-no-files-found: ignore
      - name: Cleanup workspace
        if: ${{ always() }}
        run: |
          chown 1000:1000 /__w /github ./ -R

  test-in-baremetal:
    timeout-minutes: 600
    if: ${{ contains(inputs.ut, 'distributed') || inputs.ut == 'xpu_p0' }}
    runs-on: ${{ inputs.runner }}
    env:
      PYTEST_ADDOPTS: -v --timeout 3600 --timeout_method=thread -n 1 --max-worker-restart 10000
      # xpu_p0 is split: the distributed group runs here (baremetal), the rest in the container job.
      UT_LABEL: ${{ inputs.ut == 'xpu_p0' && 'xpu_p0_distributed' || inputs.ut }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Prepare test env
        uses: ./.github/actions/linux-testenv
        with:
          pytorch: ${{ inputs.pytorch }}
          torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
          python: ${{ inputs.python }}
          category: ${{ inputs.category }}
      - name: Run XPU UT Test
        uses: ./.github/actions/linux-uttest
        with:
          ut_name: ${{ env.UT_LABEL }}
      - name: Record UT job metadata
        if: ${{ ! cancelled() }}
        run: |
          mkdir -p "${{ github.workspace }}/ut_log"
          {
            echo "UT_NAME=${{ env.UT_LABEL }}"
            echo "UT_RUNNER=${{ inputs.runner }}"
            echo "UT_CATEGORY=${{ inputs.category }}"
          } > "${{ github.workspace }}/ut_log/ut_meta.env"
      - name: Upload UT data
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: UT-Data-linux-${{ env.UT_LABEL }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ut_log
          if-no-files-found: ignore

  check:
    needs: [test-in-container, test-in-baremetal]
    if: ${{ ! cancelled() && ! (endsWith(needs.test-in-container.result, 'ed') && endsWith(needs.test-in-baremetal.result, 'ed')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Check UT failures
        id: ut
        uses: ./.github/actions/ut-check
        with:
          ut: ${{ inputs.ut }}
          category: ${{ inputs.category }}
          pytorch: ${{ inputs.pytorch }}
          known_issues_snapshot: 'true'
      - name: Fail on new failures
        if: ${{ steps.ut.outputs.passed != 'true' }}
        shell: bash {0}
        run: |
          echo "::error::${{ steps.ut.outputs.new_failures }} new UT failures:"
          cat "${{ steps.ut.outputs.work_dir }}"/*/new_failures.txt
          exit 1
