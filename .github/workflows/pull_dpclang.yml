# This workflow intends to verify pytorch built against full open source
# stack (oneAPI not used).

name: pull dpclang

on:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - .github/workflows/pull_dpclang.yml
      - ./.github/workflows/_linux_build.yml
      - ./.github/workflows/_linux_ut.yml
  schedule:
    # 9:00 AM UTC every Sunday
    - cron: '0 9 * * 0'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-wheels:
    if: ${{ github.repository_owner == 'intel' }}
    secrets: inherit
    uses: ./.github/workflows/_linux_build.yml
    with:
      category: dpclang
      runner: build
      pytorch: ${{ github.base_ref || github.ref_name }}

  linux-ut:
    needs: build-wheels
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: [basic, op_ut]
    uses: ./.github/workflows/_linux_ut.yml
    with:
      category: dpclang
      runner: bmg-test
      pytorch: ${{ github.base_ref || github.ref_name }}
      torch_xpu_ops: ${{ 'main' }}
      ut: ${{ matrix.ut_name }}
