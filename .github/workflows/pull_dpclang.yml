# This workflow intends to verify pytorch built against full open source
# stack (oneAPI not used).

name: pull dpclang

on:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - .github/workflows/pull_dpclang.yml
      - .github/workflows/_linux_build.yml
      - .github/workflows/_linux_ut.yml
  schedule:
    # 9:00 AM UTC every Sunday
    - cron: '0 9 * * 0'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-prereq:
    if: ${{ github.repository_owner == 'intel' }}
    runs-on: build
    container:
      image: 'pytorch/manylinux2_28-builder:xpu-main'
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      env:
        INSTALL_PREFIX: ${{ github.workspace }}/_install
        PATH: /tmp/xpu-tool/myvenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        PIP_CACHE_DIR: /tmp/xpu-tool/.pipcache
    steps:
      - name: Checkout level-zero
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oneapi-src/level-zero
          ref: v1.33.1
          path: level-zero
          persist-credentials: false
      - name: Checkout intel-llvm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: intel/llvm
          ref: v7.1.0
          path: intel-llvm
          persist-credentials: false
      - name: Checkout pti-gpu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: intel/pti-gpu
          ref: pti-1.1.0
          path: pti-gpu
          persist-credentials: false
      - name: Install prerequisites
        run: |
          rm -rf /tmp/xpu-tool/myvenv
          rm -rf "$INSTALL_PREFIX"
          /opt/python/cp314-cp314/bin/python3 -m venv /tmp/xpu-tool/myvenv
          pip install cmake ninja
          dnf install -y libtool libzstd-devel
          {
            echo "CMAKE_PREFIX_PATH=$INSTALL_PREFIX"
            echo "PKG_CONFIG_PATH=$INSTALL_PREFIX/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=$INSTALL_PREFIX/lib:$LD_LIBRARY_PATH"
            echo "PATH=$INSTALL_PREFIX:$PATH"
          } >> "$GITHUB_ENV"
          echo "$INSTALL_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Build level-zero
        run: |
          source /opt/rh/gcc-toolset-13/enable
          cmake -B _build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build _build
          cmake --install _build
        working-directory: ./level-zero
      - name: Patch intel-llvm
        run: |
          # WA for:
          # * https://github.com/intel/llvm/issues/23045
          # * https://github.com/intel/torch-xpu-ops/issues/5288
          grep -rl '#include <level_zero/ze_api.h>' unified-runtime/ | \
            xargs sed -i 's|#include <level_zero/ze_api.h>|#include <ze_api.h>|g'
        working-directory: ./intel-llvm
      - name: Build intel-llvm
        run: |
          source /opt/rh/gcc-toolset-13/enable
          cmake -B _build -S llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_DOXYGEN=OFF \
            -DLLVM_ENABLE_LLD=OFF \
            -DLLVM_ENABLE_PROJECTS='clang;sycl;llvm-spirv;opencl;xpti;xptifw;compiler-rt;libdevice;sycl-jit' \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_SPHINX=OFF \
            -DLLVM_ENABLE_ZSTD=ON \
            -DLLVM_EXTERNAL_PROJECTS='sycl;llvm-spirv;opencl;xpti;xptifw;compiler-rt;libdevice;sycl-jit' \
            -DLLVM_SPIRV_ENABLE_LIBSPIRV_DIS=OFF \
            -DLLVM_TARGETS_TO_BUILD='host;SPIRV' \
            -DSYCL_ENABLE_EXTENSION_JIT=ON \
            -DSYCL_ENABLE_MAJOR_RELEASE_PREVIEW_LIB=OFF \
            -DSYCL_ENABLE_WERROR=OFF \
            -DSYCL_ENABLE_XPTI_TRACING=ON \
            -DLLVM_EXTERNAL_LIBDEVICE_SOURCE_DIR="$(pwd)/libdevice" \
            -DLLVM_EXTERNAL_LLVM_SPIRV_SOURCE_DIR="$(pwd)/llvm-spirv" \
            -DLLVM_EXTERNAL_SYCL_JIT_SOURCE_DIR="$(pwd)/sycl-jit" \
            -DLLVM_EXTERNAL_SYCL_SOURCE_DIR="$(pwd)/sycl" \
            -DLLVM_EXTERNAL_XPTI_SOURCE_DIR="$(pwd)/xpti" \
            -DLLVM_EXTERNAL_XPTIFW_SOURCE_DIR="$(pwd)/xptifw" \
            -DSYCL_INCLUDE_TESTS=OFF \
            -DXPTI_ENABLE_WERROR=OFF
          cmake --build _build
          cmake --install _build
        working-directory: ./intel-llvm
      - name: Build pti-gpu
        env:
          CC: dpclang
          CXX: dpclang++
        run: |
          source /opt/rh/gcc-toolset-13/enable
          cmake -B _build -S sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DPTI_BUILD_SAMPLES=OFF \
            -DPTI_BUILD_TESTING=OFF
          cmake --build _build
          cmake --install _build
        working-directory: ./pti-gpu
      - name: Compress output
        run: |
          # Compressing manually to preserve access permissions for executables
          tar czvf install-dpclang.tgz -C "$INSTALL_PREFIX" .
      - name: Upload dpclang
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dpclang
          path: install-dpclang.tgz

  build-wheels:
    needs: build-prereq
    if: ${{ github.repository_owner == 'intel' }}
    secrets:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    uses: ./.github/workflows/_linux_build.yml
    with:
      category: dpclang
      runner: build
      pytorch: ${{ github.base_ref || github.ref_name }}

  linux-ut:
    needs: build-wheels
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: [basic, op_ut]
    uses: ./.github/workflows/_linux_ut.yml
    with:
      category: dpclang
      runner: bmg-test
      pytorch: ${{ github.base_ref || github.ref_name }}
      torch_xpu_ops: main
      ut: ${{ matrix.ut_name }}
