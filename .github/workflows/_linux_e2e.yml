name: Linux E2E Test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Runner label
      test_type:
        type: string
        default: "build-cicd"
        description: Test type, default is for CI tests, others (build or wheel)-(nightly, weekly or ondemand)
      pytorch:
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      python:
        type: string
        default: '3.10'
        description: Python version
      suite:
        type: string
        default: 'huggingface'
        description: Dynamo benchmarks test suite. `huggingface,timm_models,torchbench,pt2e`. Delimiter is comma
      dt:
        type: string
        default: 'float32'
        description: Data precision of the test. `float32,bfloat16,float16,amp_bf16,amp_fp16`. Delimiter is comma
      mode:
        type: string
        default: 'inference'
        description: Test mode. `inference,training`. Delimiter is comma
      scenario:
        type: string
        default: 'accuracy'
        description: Test scenario. `accuracy,performance`. Delimiter is comma
      model:
        required: false
        type: string
        default: ''
        description: Model. Will only run this one mode if set
      category:
        type: string
        default: ''
        description: 'Optional tag (e.g. target/baseline) appended to the artifact name'

permissions: read-all

defaults:
  run:
    shell: bash -xe {0}
env:
  GH_TOKEN: ${{ github.token }}
  HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  DOCKER_REGISTRY_AUTH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 3600
    container:
      image: ubuntu:24.04
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_ADMIN --shm-size=8g --privileged
              -e ZE_AFFINITY_MASK
      env:
        MODEL_ONLY_NAME: ${{ inputs.model }}
        AGENT_TOOLSDIRECTORY: /tmp/xpu-tool
    steps:
      - name: Install gh-cli
        run: |
          cat /etc/os-release
          hostname && id
          # install
          export GCC_VERSION=13
          apt-get update
          apt-get install -y gh gcc g++ gcc-${GCC_VERSION} g++-${GCC_VERSION} build-essential cmake ninja-build pkg-config autoconf automake
          apt-get install -y wget curl vim libgomp1 pciutils ca-certificates \
              gnupg \
              software-properties-common \
              apt-transport-https \
              lsb-release wget \
              curl \
              sudo \
              git \
              unzip \
              zip \
              gh \
              numactl \
              rsync \
              jq gcc g++ \
              build-essential \
              cmake \
              ninja-build \
              pkg-config \
              autoconf \
              automake \
              gcc-${GCC_VERSION} g++-${GCC_VERSION} \
              libtool libgl1 \
              libglib2.0-0 \
              libglib2.0-dev \
              zlib1g \
              zlib1g-dev python3 \
              python3-dev \
              python3
          apt-get install -y python3-dev git zip unzip rsync jq sudo gnupg wget
          gh --version
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${GCC_VERSION} 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${GCC_VERSION} 100
          update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${GCC_VERSION} 100
          gcc -v && g++ -v && gcov -v
          # cleanup files
          rm -rf ${{ github.workspace }}/*.whl ${{ github.workspace }}/*.log

          # install driver
          . /etc/os-release
          wget -qO - https://repositories.intel.com/gpu/intel-graphics.key | sudo gpg --yes --dearmor --output /usr/share/keyrings/intel-graphics.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/intel-graphics.gpg] https://repositories.intel.com/gpu/ubuntu ${VERSION_CODENAME}/lts/2523 unified" | \
                  sudo tee /etc/apt/sources.list.d/intel-gpu-${VERSION_CODENAME}.list
          apt-get update
          apt-get install -y \
                  intel-opencl-icd libze-intel-gpu1 libze1 \
                  intel-media-va-driver-non-free libmfx-gen1 libvpl2 \
                  libegl-mesa0 libegl1-mesa-dev libgbm1 libgl1-mesa-dev libgl1-mesa-dri \
                  libglapi-mesa libgles2-mesa-dev libglx-mesa0 libigdgmm12 libxatracker2 mesa-va-drivers \
                  mesa-vdpau-drivers mesa-vulkan-drivers va-driver-all vainfo hwinfo clinfo || apt-get install -fy
          apt-get install -y libigc-dev intel-igc-cm libigdfcl-dev libigfxcmrt-dev libze-dev intel-ocloc || apt-get install -fy

      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v4
      - name: Prepare test env
        uses: ./.github/actions/linux-testenv
        with:
          pytorch: ${{ inputs.pytorch }}
          python: ${{ inputs.python }}
          suite: ${{ inputs.suite }}
          category: ${{ inputs.category }}
      - name: Fixed frequency
        run: |
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh lock
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh status

      # CICD launch
      - name: CICD Huggingface BF16 & FP16 Training Test
        if: ${{ contains(github.event_name, 'pull_request') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: bfloat16,float16
          mode: training
          scenario: ${{ inputs.scenario }}
          overwrite_model_list: 'false'
      - name: CICD Timm_models BF16 Training Test
        if: ${{ contains(github.event_name, 'pull_request') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}
          overwrite_model_list: 'false'
      - name: CICD Torchbench BF16 Training Test
        if: ${{ contains(github.event_name, 'pull_request') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}
          overwrite_model_list: 'false'

      # Nihglty launch
      - name: Nightly Huggingface Full Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Nightly Timm_models FP16 Training Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: float16,bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}
      - name: Nightly Torchbench BF16 Training Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: float16,bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}
      - name: Nightly PT2E Full Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'pt2e') }}
        uses: ./.github/actions/pt2e
        with:
          dt: float32,int8
          scenario: ${{ inputs.scenario }}

      # Weekly launch
      - name: Weekly Huggingface Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Weekly Timm_models Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Weekly Torchbench Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Weekly PT2E Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'pt2e') }}
        uses: ./.github/actions/pt2e
        with:
          dt: float32,int8
          scenario: ${{ inputs.scenario }}

      # On-demand launch
      - name: Get test data types
        if: ${{ contains(inputs.test_type, 'ondemand') }}
        id: dtypes
        run: |
          e2e_dtypes="$(echo "${{ inputs.dt }}" |sed 's/,int8//;s/int8,//')"
          pt2e_dtypes="$(echo "${{ inputs.dt }}" |\
                  sed -E 's/,(bfloat16|float16|amp_bf16|amp_fp16)//g;s/(bfloat16|float16|amp_bf16|amp_fp16),//g')"
          echo "e2e_dtypes=${e2e_dtypes}" >> ${GITHUB_OUTPUT}
          echo "pt2e_dtypes=${pt2e_dtypes}" >> ${GITHUB_OUTPUT}
      - name: OnDemand Test (huggingface)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: ${{ steps.dtypes.outputs.e2e_dtypes }}
          mode: ${{ inputs.mode }}
          scenario: ${{ inputs.scenario }}
      - name: OnDemand Test (timm_models)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: ${{ steps.dtypes.outputs.e2e_dtypes }}
          mode: ${{ inputs.mode }}
          scenario: ${{ inputs.scenario }}
      - name: OnDemand Test (torchbench)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: ${{ steps.dtypes.outputs.e2e_dtypes }}
          mode: ${{ inputs.mode }}
          scenario: ${{ inputs.scenario }}
      - name: OnDemand PT2E Test (pt2e)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'pt2e') }}
        uses: ./.github/actions/pt2e
        with:
          dt: ${{ steps.dtypes.outputs.pt2e_dtypes }}
          scenario: ${{ inputs.scenario }}

      # Acceptance test launch (fixed scope: training amp_fp16 + inference bfloat16, accuracy+performance)
      - name: Acceptance Test - training (${{ inputs.suite }})
        if: ${{ contains(inputs.test_type, 'acceptance') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          dt: amp_fp16
          mode: training
          scenario: ${{ inputs.scenario }}
          overwrite_model_list: 'false'
      - name: Acceptance Test - inference (${{ inputs.suite }})
        if: ${{ contains(inputs.test_type, 'acceptance') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          dt: bfloat16
          mode: inference
          scenario: ${{ inputs.scenario }}
          overwrite_model_list: 'false'

      - name: Get archieve files
        if: ${{ ! cancelled() }}
        id: archive
        run: |
          rm -rf ${{ github.workspace }}/upload_files
          cp -r ${{ github.workspace }}/pytorch/inductor_log ${{ github.workspace }}/upload_files
          artifact_name="Inductor-${{ inputs.test_type }}-LTS2-XPU-E2E-Data"
          artifact_name+="-${{ github.event.pull_request.number || github.sha }}"
          artifact_name+="-${{ inputs.suite }}"
          if [[ "${{ inputs.scenario }}" != *,* ]]; then
            artifact_name+="-${{ inputs.scenario }}"
          fi
          artifact_name+="-${{ github.run_id }}-${{ github.run_attempt }}"
          if [[ -n "${{ inputs.category }}" ]]; then
            artifact_name+="-${{ inputs.category }}"
          fi
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Cleanup
        if: ${{ always() }}
        run: |
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh unlock
          chown 1000:1000 /__w /github ./ -R
      - name: Upload Inductor XPU E2E Data
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ github.workspace }}/upload_files
