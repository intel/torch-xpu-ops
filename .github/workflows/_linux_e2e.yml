name: Linux E2E Test

on:
  workflow_call:
    secrets:
      DOCKER_HUB_TOKEN:
        required: false
      HUGGING_FACE_HUB_TOKEN:
        required: false
    inputs:
      runner:
        required: true
        type: string
        description: Runner label
      test_type:
        type: string
        default: "build-cicd"
        description: Test type, default is for CI tests, others (build or wheel)-(nightly, weekly or ondemand)
      pytorch:
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      python:
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.json
      suite:
        type: string
        default: 'huggingface'
        description: Dynamo benchmarks test suite. `huggingface,timm_models,torchbench,pt2e`. Delimiter is comma
      dt:
        type: string
        default: 'float32'
        description: Data precision of the test. `float32,bfloat16,float16,amp_bf16,amp_fp16`. Delimiter is comma
      mode:
        type: string
        default: 'inference'
        description: Test mode. `inference,training`. Delimiter is comma
      scenario:
        type: string
        default: 'accuracy'
        description: Test scenario. `accuracy,performance`. Delimiter is comma
      model:
        required: false
        type: string
        default: ''
        description: Model. Will only run this one mode if set
      category:
        type: string
        default: ''
        description: 'Optional tag (e.g. target/baseline) appended to the artifact name'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

defaults:
  run:
    shell: bash -xe {0}
env:
  GH_TOKEN: ${{ github.token }}
  HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  DOCKER_REGISTRY_AUTH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 3600
    container:
      image: ${{ contains(inputs.runner, 'bmg') && 'intelgpu/ubuntu-26.04-rolling:26.18' || 'intelgpu/ubuntu-24.04-lts2:2523.40' }}
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
        - /opt/xpu-test/_cache:/github/home/.cache/:rw
        - /opt/xpu-test/_dataset:/opt/_dataset/:rw
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_ADMIN --shm-size=8g --privileged
              -e ZE_AFFINITY_MASK
      env:
        MODEL_ONLY_NAME: ${{ inputs.model }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare test env
        uses: ./.github/actions/linux-testenv
        with:
          pytorch: ${{ inputs.pytorch }}
          python: ${{ inputs.python }}
          suite: ${{ inputs.suite }}
          category: ${{ inputs.category }}
      - name: Fixed frequency
        run: |
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh lock
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh status
          rm -rf ${{ github.workspace }}/pytorch/inductor_log

      # CICD launch
      - name: CICD Huggingface BF16 & FP16 Training Test
        if: ${{ contains(github.event_name, 'pull_request') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: bfloat16,float16
          mode: training
          scenario: ${{ inputs.scenario }}
      - name: CICD Timm_models BF16 Training Test
        if: ${{ contains(github.event_name, 'pull_request') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}
      - name: CICD Torchbench BF16 Training Test
        if: ${{ contains(github.event_name, 'pull_request') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}

      # Nihglty launch
      - name: Nightly Huggingface Full Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Nightly Timm_models FP16 Training Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: float16,bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}
      - name: Nightly Torchbench BF16 Training Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: float16,bfloat16
          mode: training
          scenario: ${{ inputs.scenario }}
      - name: Nightly PT2E Full Test
        if: ${{ contains(inputs.test_type, 'nightly') && contains(inputs.suite, 'pt2e') }}
        uses: ./.github/actions/pt2e
        with:
          dt: float32,int8
          scenario: ${{ inputs.scenario }}

      # Weekly launch
      - name: Weekly Huggingface Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Weekly Timm_models Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Weekly Torchbench Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: float32,bfloat16,float16,amp_bf16,amp_fp16
          mode: inference,training
          scenario: ${{ inputs.scenario }}
      - name: Weekly PT2E Full Test
        if: ${{ contains(inputs.test_type, 'weekly') && contains(inputs.suite, 'pt2e') }}
        uses: ./.github/actions/pt2e
        with:
          dt: float32,int8
          scenario: ${{ inputs.scenario }}

      # On-demand launch
      - name: Get test data types
        if: ${{ contains(inputs.test_type, 'ondemand') }}
        id: dtypes
        env:
          TEST_DTYPES: ${{ inputs.dt }}
        run: |
          e2e_dtypes="$(echo "${TEST_DTYPES}" |sed 's/,int8//;s/int8,//')"
          pt2e_dtypes="$(echo "${TEST_DTYPES}" |\
                  sed -E 's/,(bfloat16|float16|amp_bf16|amp_fp16)//g;s/(bfloat16|float16|amp_bf16|amp_fp16),//g')"
          {
            echo "e2e_dtypes=${e2e_dtypes}"
            echo "pt2e_dtypes=${pt2e_dtypes}"
          } >> "${GITHUB_OUTPUT}"
      - name: OnDemand Test (huggingface)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'huggingface') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: huggingface
          dt: ${{ steps.dtypes.outputs.e2e_dtypes }}
          mode: ${{ inputs.mode }}
          scenario: ${{ inputs.scenario }}
      - name: OnDemand Test (timm_models)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'timm_models') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: timm_models
          dt: ${{ steps.dtypes.outputs.e2e_dtypes }}
          mode: ${{ inputs.mode }}
          scenario: ${{ inputs.scenario }}
      - name: OnDemand Test (torchbench)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'torchbench') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: torchbench
          dt: ${{ steps.dtypes.outputs.e2e_dtypes }}
          mode: ${{ inputs.mode }}
          scenario: ${{ inputs.scenario }}
      - name: OnDemand PT2E Test (pt2e)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'pt2e') }}
        uses: ./.github/actions/pt2e
        with:
          dt: ${{ steps.dtypes.outputs.pt2e_dtypes }}
          scenario: ${{ inputs.scenario }}

      # Acceptance test launch (fixed scope: training amp_fp16 + inference bfloat16, accuracy+performance)
      - name: Acceptance Test - training (${{ inputs.suite }})
        if: ${{ contains(inputs.test_type, 'acceptance') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          dt: amp_fp16
          mode: training
          scenario: ${{ inputs.scenario }}
      - name: Acceptance Test - inference (${{ inputs.suite }})
        if: ${{ contains(inputs.test_type, 'acceptance') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          dt: bfloat16
          mode: inference
          scenario: ${{ inputs.scenario }}

      - name: Get archieve files
        if: ${{ ! cancelled() }}
        id: archive
        env:
          TEST_TYPE: ${{ inputs.test_type }}
          TEST_SUITE: ${{ inputs.suite }}
          TEST_SCENARIO: ${{ inputs.scenario }}
          TEST_CATEGORY: ${{ inputs.category }}
        run: |
          rm -rf ${{ github.workspace }}/upload_files
          cp -r ${{ github.workspace }}/pytorch/inductor_log ${{ github.workspace }}/upload_files
          artifact_name="Inductor-${TEST_TYPE}-LTS2-XPU-E2E-Data"
          artifact_name+="-${{ github.event.pull_request.number || github.sha }}"
          artifact_name+="-${TEST_SUITE}"
          if [[ "${TEST_SCENARIO}" != *,* ]]; then
            artifact_name+="-${TEST_SCENARIO}"
          fi
          artifact_name+="-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -n "${TEST_CATEGORY}" ]]; then
            artifact_name+="-${TEST_CATEGORY}"
          fi
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Cleanup
        if: ${{ always() }}
        run: |
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh unlock
          chown 1000:1000 /__w /github ./ -R
      - name: Upload Inductor XPU E2E Data
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ github.workspace }}/upload_files
