name: Linux E2E Test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Runner label
      test_type:
        type: string
        default: "build-cicd"
        description: Test type, default is for CI tests, others (build or wheel)-(nightly, weekly or ondemand)
      pytorch:
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      python:
        type: string
        default: ''
        description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.yaml
      torch_xpu_ops:
        type: string
        default: 'pinned'
        description: Torch-xpu-ops wheel/source pin, or a ref, or 'repo@ref'
      suite:
        type: string
        default: 'huggingface'
        description: Dynamo benchmarks test suite. `huggingface,timm_models,torchbench,pt2e`. Delimiter is comma
      dt:
        type: string
        default: 'float32'
        description: Data precision of the test. `float32,bfloat16,float16,amp_bf16,amp_fp16`. Delimiter is comma
      mode:
        type: string
        default: 'inference'
        description: Test mode. `inference,training`. Delimiter is comma
      scenario:
        type: string
        default: 'accuracy'
        description: Test scenario. `accuracy,performance`. Delimiter is comma
      model:
        required: false
        type: string
        default: ''
        description: Model. Will only run this one mode if set
      category:
        type: string
        default: ''
        description: 'Optional tag (e.g. target/baseline) appended to the artifact name'

permissions: read-all

defaults:
  run:
    shell: bash -xe {0}
env:
  GH_TOKEN: ${{ github.token }}
  HF_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
  DOCKER_REGISTRY_AUTH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 3600
    outputs:
      artifact: ${{ steps.archive.outputs.name }}
      started_at: ${{ steps.start.outputs.started_at }}
    container:
      image: ${{ contains(inputs.runner, 'bmg') && 'intelgpu/ubuntu-26.04-rolling:26.18' || 'intelgpu/ubuntu-24.04-lts2:2523.40' }}
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
        - /opt/xpu-test/_cache:/github/home/.cache/:rw
        - /opt/xpu-test/_dataset:/opt/_dataset/:rw
        - /etc/hostname:/host/etc/hostname:ro
        - /etc/os-release:/host/etc/os-release:ro
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_ADMIN --shm-size=8g --privileged
              -e ZE_AFFINITY_MASK
      env:
        MODEL_ONLY_NAME: ${{ inputs.model }}
        E2E_CONTAINER_IMAGE: ${{ contains(inputs.runner, 'bmg') && 'intelgpu/ubuntu-26.04-rolling:26.18' || 'intelgpu/ubuntu-24.04-lts2:2523.40' }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
      - name: Prepare test env
        uses: ./.github/actions/linux-testenv
        with:
          pytorch: ${{ inputs.pytorch }}
          torch_xpu_ops: ${{ inputs.torch_xpu_ops }}
          python: ${{ inputs.python }}
          suite: ${{ inputs.suite }}
          category: ${{ inputs.category }}
      - name: Fixed frequency
        id: start
        run: |
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh lock
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh status
          rm -rf ${{ github.workspace }}/pytorch/inductor_log
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      # CICD launch
      - name: CICD Test (p0)
        if: ${{ contains(github.event_name, 'pull_request') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          scenario: ${{ inputs.scenario }}
          test_scope: p0

      # Nihglty launch
      - name: Nightly Test (p0, p1)
        if: ${{ contains(inputs.test_type, 'nightly') && (contains(inputs.suite, 'huggingface') || contains(inputs.suite, 'timm_models') || contains(inputs.suite, 'torchbench')) }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          scenario: ${{ inputs.scenario }}
          test_scope: p0,p1

      # Weekly launch
      - name: Weekly Test (full)
        if: ${{ contains(inputs.test_type, 'weekly') && (contains(inputs.suite, 'huggingface') || contains(inputs.suite, 'timm_models') || contains(inputs.suite, 'torchbench')) }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          scenario: ${{ inputs.scenario }}
          test_scope: full

      # On-demand launch
      - name: Get test data types
        if: ${{ contains(inputs.test_type, 'ondemand') }}
        id: dtypes
        run: |
          e2e_dtypes="$(echo "${{ inputs.dt }}" |sed 's/,int8//;s/int8,//')"
          pt2e_dtypes="$(echo "${{ inputs.dt }}" |\
                  sed -E 's/,(bfloat16|float16|amp_bf16|amp_fp16)//g;s/(bfloat16|float16|amp_bf16|amp_fp16),//g')"
          echo "e2e_dtypes=${e2e_dtypes}" >> ${GITHUB_OUTPUT}
          echo "pt2e_dtypes=${pt2e_dtypes}" >> ${GITHUB_OUTPUT}
      - name: OnDemand Test (filtered from full)
        if: ${{ contains(inputs.test_type, 'ondemand') && (contains(inputs.suite, 'huggingface') || contains(inputs.suite, 'timm_models') || contains(inputs.suite, 'torchbench')) }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          dt: ${{ steps.dtypes.outputs.e2e_dtypes }}
          mode: ${{ inputs.mode }}
          scenario: ${{ inputs.scenario }}
          test_scope: full
      - name: OnDemand PT2E Test (pt2e)
        if: ${{ contains(inputs.test_type, 'ondemand') && contains(inputs.suite, 'pt2e') }}
        uses: ./.github/actions/pt2e
        with:
          dt: ${{ steps.dtypes.outputs.pt2e_dtypes }}
          scenario: ${{ inputs.scenario }}

      # Acceptance test launch
      - name: Acceptance Test (p0, ${{ inputs.suite }})
        if: ${{ contains(inputs.test_type, 'acceptance') }}
        uses: ./.github/actions/linux-e2etest
        with:
          suite: ${{ inputs.suite }}
          scenario: ${{ inputs.scenario }}
          test_scope: p0

      - name: Get archieve files
        if: ${{ ! cancelled() }}
        id: archive
        run: |
          rm -rf ${{ github.workspace }}/upload_files
          cp -r ${{ github.workspace }}/pytorch/inductor_log ${{ github.workspace }}/upload_files
          artifact_name="Inductor-${{ inputs.test_type }}-LTS2-XPU-E2E-Data"
          artifact_name+="-${{ github.event.pull_request.number || github.sha }}"
          artifact_name+="-${{ inputs.suite }}"
          if [[ "${{ inputs.scenario }}" != *,* ]]; then
            artifact_name+="-${{ inputs.scenario }}"
          fi
          artifact_name+="-${{ github.run_id }}-${{ github.run_attempt }}"
          if [[ -n "${{ inputs.category }}" ]]; then
            artifact_name+="-${{ inputs.category }}"
          fi
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      # PT2E only runs the benchmarks; its results are not stored in the database.
      - name: Collect test environment
        if: ${{ ! cancelled() && ! contains(inputs.suite, 'pt2e') }}
        continue-on-error: true
        env:
          E2E_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
        run: |
          if [ -z "${E2E_DB_PASSWORD}" ];then
            echo "E2E_DB_PASSWORD is not available, skip"
            exit 0
          fi
          python ${{ github.workspace }}/.github/scripts/e2e_db/collect_env.py \
            --output /tmp/e2e-env.json --host-etc /host/etc \
            --torch-name "${{ inputs.pytorch }}" --pytorch-dir pytorch --torchbench-dir benchmark
          # The artifact is public; only the database job can decrypt the environment details.
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:E2E_DB_PASSWORD \
            -in /tmp/e2e-env.json -out ${{ github.workspace }}/upload_files/e2e-env.json.enc
          rm -f /tmp/e2e-env.json
      - name: Cleanup
        if: ${{ always() }}
        run: |
          bash ${{ github.workspace }}/.github/scripts/freq-fixed.sh unlock
          chown 1000:1000 /__w /github ./ -R
      - name: Upload Inductor XPU E2E Data
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ github.workspace }}/upload_files

  database:
    name: Upload results to E2E database
    needs: test
    if: ${{ ! cancelled() && needs.test.outputs.artifact != '' && ! contains(inputs.suite, 'pt2e') }}
    # Runs on the database host itself, so results are written over loopback, not the network.
    runs-on: xpu-ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "${E2E_DB_PASSWORD}" ];then
            echo "E2E_DB_PASSWORD is not available, skip"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Checkout torch-xpu-ops
        if: ${{ steps.creds.outputs.skip != 'true' }}
        uses: actions/checkout@v7
      - name: Setup python
        if: ${{ steps.creds.outputs.skip != 'true' }}
        uses: ./.github/actions/setup-python
        with:
          python: ${{ inputs.python }}
      - name: Download Inductor XPU E2E Data
        if: ${{ steps.creds.outputs.skip != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test.outputs.artifact }}
          path: e2e_data
      - name: Load results
        if: ${{ steps.creds.outputs.skip != 'true' }}
        run: |
          case "${{ inputs.test_type }}" in
            *nightly*) run_type=nightly ;;
            *weekly*) run_type=weekly ;;
            *ondemand*) run_type=on-demand ;;
            *acceptance*) run_type=acceptance ;;
            *) run_type=ci ;;
          esac
          # target/baseline jobs of one workflow run are separate runs
          run_name="${GITHUB_RUN_ID}"
          if [[ -n "${{ inputs.category }}" ]]; then
            run_name+="-${{ inputs.category }}"
          fi
          if [ ! -f e2e_data/e2e-env.json.enc ];then
            echo "No test environment in the artifact (collection failed or skipped), skip"
            exit 0
          fi
          uv pip install 'psycopg[binary]'
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:E2E_DB_PASSWORD \
            -in e2e_data/e2e-env.json.enc -out "${RUNNER_TEMP}/e2e-env.json"
          python .github/scripts/e2e_db/load_results.py --run "${run_name}" --run-type "${run_type}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --started-at "${{ needs.test.outputs.started_at }}" \
            --meta "${RUNNER_TEMP}/e2e-env.json" --input e2e_data
