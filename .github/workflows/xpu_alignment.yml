name: XPU Alignment

# The skill owns scan/review judgment. This workflow owns scheduling, artifact
# isolation, deterministic gating, and the only GitHub write permission.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_date:
        description: 'UTC date to scan (YYYY-MM-DD); defaults to yesterday.'
        required: false
        type: string
      runner:
        description: 'XPU runner label.'
        required: false
        type: string
        default: pvc
      auto_file:
        description: 'Allow one reviewed issue to be filed without approval.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: xpu-alignment
  cancel-in-progress: false

env:
  BEDROCK_MODEL: global.anthropic.claude-opus-5
  CLAUDE_ALIGNMENT_TOOLS: Bash,Read,Write,Edit,Glob,Grep,WebFetch,Skill
  ALIGNMENT_RUN_ROOT: agent_space_xpu/runs
  ALIGNMENT_ARTIFACT: xpu-alignment-${{ github.run_id }}-${{ github.run_attempt }}
  ALIGNMENT_TRIAGE_ISSUE: '5018'
  ALIGNMENT_TRIAGE_NOTIFY: '@laifenxiawucha @ZhaoqiongZ'

jobs:
  scan-and-validate:
    name: Scan and validate on XPU
    runs-on: ${{ inputs.runner || 'pvc' }}
    timeout-minutes: 240
    outputs:
      scan_date: ${{ steps.context.outputs.scan_date }}
    container:
      image: intelgpu/ubuntu-24.04-lts2:2523.40
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      options: >-
        --device=/dev/mem --device=/dev/dri
        --security-opt seccomp=unconfined --cap-add=SYS_PTRACE --shm-size=8g
        -e ZE_AFFINITY_MASK
      env:
        AGENT_TOOLSDIRECTORY: /tmp/xpu-tool
        PYTORCH_DEBUG_XPU_FALLBACK: '1'
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve scan window
        id: context
        env:
          INPUT_SCAN_DATE: ${{ inputs.scan_date }}
        run: |
          set -euo pipefail
          scan_date="${INPUT_SCAN_DATE:-$(date -u -d 'yesterday' +%F)}"
          normalized="$(date -u -d "$scan_date" +%F 2>/dev/null || true)"
          [[ "$normalized" == "$scan_date" ]] || { echo 'scan_date must be a real YYYY-MM-DD date' >&2; exit 1; }
          echo "scan_date=$scan_date" >> "$GITHUB_OUTPUT"

      - name: Provision nightly XPU runtime
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install --pre torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/nightly/xpu
          python3 - <<'PY'
          import torch
          print(torch.__version__)
          if not torch.xpu.is_available():
              raise SystemExit("XPU is not available on the runner")
          print(torch.xpu.device_count())
          print(torch.xpu.get_device_name(0))
          PY
          xpu-smi discovery -y --json --dump -1 || true

      - name: Verify GitHub read access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              > /etc/apt/sources.list.d/github-cli.list
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh auth status
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          echo "GitHub core quota remaining: $remaining"
          (( remaining >= 1000 )) || { echo 'Too little GitHub quota for the daily scan' >&2; exit 1; }

      - name: Scan and validate upstream candidates
        id: scan
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ github.token }}
          settings: '{"alwaysThinkingEnabled": true}'
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 100 --allowedTools ${{ env.CLAUDE_ALIGNMENT_TOOLS }}"
          prompt: |
            Use .claude/skills/xpu-alignment/SKILL.md in automation mode with
            role `scan`. The run directory is
            `${{ env.ALIGNMENT_RUN_ROOT }}/${{ steps.context.outputs.scan_date }}`.
            Scan the half-open UTC interval from
            `${{ steps.context.outputs.scan_date }}T00:00:00Z` through the next
            UTC midnight.

            Follow the v1 contract and use source evidence rather than keyword
            routing. Enumerate the required pytorch/pytorch issues, PRs, and
            default-branch commits; retain collection errors rather than claiming
            false completeness. Build and directly run bounded faithful XPU
            reproducers for plausible candidates. Run each reproducer in a fresh
            child process with `env -i`, passing only the minimum PATH, Python,
            locale, HOME, and XPU runtime variables it needs; never pass GH_TOKEN,
            GITHUB_TOKEN, AWS credentials, or model-provider credentials. Keep the
            exact script and raw log.

            Write canonical scan.json plus optional scan_report.md. Do not create
            review artifacts or modify GitHub. Leave incomplete work explicit.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload immutable scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ALIGNMENT_ARTIFACT }}
          path: ${{ env.ALIGNMENT_RUN_ROOT }}/
          if-no-files-found: warn
          retention-days: 30

  independent-review:
    name: Independent alignment review
    needs: scan-and-validate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore the immutable scan
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ALIGNMENT_ARTIFACT }}
          path: ${{ env.ALIGNMENT_RUN_ROOT }}

      - name: Check restored scan contract
        run: |
          set -euo pipefail
          manifests="$(find "$ALIGNMENT_RUN_ROOT" -type f -name scan.json | wc -l)"
          (( manifests == 1 )) || { echo "Expected one scan.json, found $manifests" >&2; exit 1; }

      - name: Verify GitHub read access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth status
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          echo "GitHub core quota remaining: $remaining"
          (( remaining >= 200 )) || { echo 'Too little GitHub quota for review' >&2; exit 1; }

      - name: Independently review every actionable result
        id: reviewer
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ github.token }}
          settings: '{"alwaysThinkingEnabled": true}'
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 60 --allowedTools ${{ env.CLAUDE_ALIGNMENT_TOOLS }}"
          prompt: |
            Use .claude/skills/xpu-alignment/SKILL.md in automation mode with
            role `review`. You did not produce the immutable scan restored under
            `${{ env.ALIGNMENT_RUN_ROOT }}/`.

            Independently cover every scan candidate whose local result is
            `confirmed` or `related-failure`. Re-read its source, reproducer, raw
            log, XPU target-path evidence, current upstream fix state, and existing
            intel/torch-xpu-ops trackers. Write only review/review.json and an
            optional review/review_report.md. Include an issue payload only for a
            reviewed `needs-xpu-fix` unit without a reusable canonical tracker.
            Do not rewrite scan-owned files, execute code, or modify GitHub.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ALIGNMENT_ARTIFACT }}-review
          path: ${{ env.ALIGNMENT_RUN_ROOT }}/
          if-no-files-found: warn
          retention-days: 30

  gate-and-publish:
    name: Gate and publish
    needs: [scan-and-validate, independent-review]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    timeout-minutes: 20
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore reviewed artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ALIGNMENT_ARTIFACT }}-review
          path: review_snapshot

      - name: Restore the original scan
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ALIGNMENT_ARTIFACT }}
          path: scan_snapshot

      - name: Build publishing decision
        id: decision
        env:
          AUTO_FILE: ${{ github.event_name == 'schedule' || inputs.auto_file }}
          PRODUCERS_CLEAN: >-
            ${{ needs.scan-and-validate.result == 'success'
            && needs.independent-review.result == 'success' }}
          SCAN_DATE: ${{ needs.scan-and-validate.outputs.scan_date }}
        run: |
          set -euo pipefail
          args=(--scan-root scan_snapshot --review-root review_snapshot
                --output gate/filing_decision.json --run-id "$GITHUB_RUN_ID"
                --scan-date "$SCAN_DATE")
          if [[ "$AUTO_FILE" == true ]]; then
            args+=(--auto-file)
          fi
          if [[ "$PRODUCERS_CLEAN" == true ]]; then
            args+=(--producers-clean)
          fi
          python3 .github/scripts/xpu_alignment_gate.py "${args[@]}"

      - name: Publish to the triage issue
        if: >-
          steps.decision.outputs.decision == 'file-one'
          || steps.decision.outputs.decision == 'triage'
          || steps.decision.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/xpu_alignment_publish.py \
            --repo "$GITHUB_REPOSITORY" \
            --triage-issue "$ALIGNMENT_TRIAGE_ISSUE" \
            --notify "$ALIGNMENT_TRIAGE_NOTIFY" \
            --decision gate/filing_decision.json

      - name: Write workflow summary
        if: always()
        run: |
          set -euo pipefail
          echo '## XPU alignment gate' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f gate/filing_decision.json ]]; then
            jq '(.payloads[]? |= del(.body))' gate/filing_decision.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No publishing decision was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ALIGNMENT_ARTIFACT }}-gate
          path: gate/
          if-no-files-found: warn
          retention-days: 30

      - name: Report a blocked or incomplete run
        if: steps.decision.outputs.needs_attention == 'true'
        run: |
          echo '::error::The alignment run needs attention; see the gate artifact.'
          exit 1
