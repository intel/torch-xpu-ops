# TEMPORARY -- only on the tmp/queue-probe branch, never merged.
#
# A new workflow file is not dispatchable until it sits on the default branch, so
# this borrows an existing dispatch slot to run ci_disabled_queue.py from a
# branch: `workflow_dispatch` decides the button from main but executes the file
# from the ref you pick. Delete this branch once the probe has answered.
name: UT Refactor Review

on:
  workflow_dispatch:
    inputs:
      pytorch_pr:
        # Reused as the issue list rather than renamed: dispatch inputs are
        # validated against the default branch, where this one is required.
        description: "pytorch issue numbers to queue, space separated"
        required: true

permissions:
  contents: read

jobs:
  probe:
    name: Queue as torchxpubot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Post the @torchxpubot fix trigger
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
          ISSUES: ${{ inputs.pytorch_pr }}
          DRY_RUN: "false"
        run: python3 .github/scripts/ci_disabled_queue.py
