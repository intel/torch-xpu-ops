name: ARC Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  smoke:
    runs-on: xpu-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Show runner context
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          uname -a
      - name: Check expected tools
        run: |
          git --version
          gh --version | head -n 1
          clang --version | head -n 1
          clang-tidy --version | head -n 1
          sudo -n true
      - name: Check cache mounts
        run: |
          test -d "${HOME}/.cache"
          test -d "${ACTIONS_RUNNER_TOOL_CACHE}"
          stat -c '%u:%g %n' "${HOME}/.cache" "${ACTIONS_RUNNER_TOOL_CACHE}"
