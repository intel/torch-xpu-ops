name: pull

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      pytorch_ref:
        description: 'PyTorch branch or commit to build against'
        required: false
        default: ''
      pr_number:
        description: 'PR number to checkout (for bot-triggered reruns)'
        required: false
        default: ''

permissions: read-all

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('pull-rerun-{0}', github.event.inputs.pr_number) || format('{0}-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  preci-lint-check:
    if: ${{ github.repository_owner == 'intel' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      pr_body_cmd: ${{ steps.reproducer-check.outputs.pr_cmd }}
      skip_all: ${{ steps.live-labels.outputs.skip_all }}
      skip_ut: ${{ steps.live-labels.outputs.skip_ut }}
      skip_e2e: ${{ steps.live-labels.outputs.skip_e2e }}
      skip_distributed: ${{ steps.live-labels.outputs.skip_distributed }}
      skip_win: ${{ steps.live-labels.outputs.skip_win }}
      force_win_ut: ${{ steps.live-labels.outputs.force_win_ut }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
        with:
          path: torch-xpu-ops
      - name: Run lint check
        id: lint-python
        continue-on-error: true
        run: |
          export ADDITIONAL_LINTRUNNER_ARGS="--skip CLANGTIDY,CLANGFORMAT,MERGE_CONFLICTLESS_CSV --all-files"
          cd ./torch-xpu-ops
          set -o pipefail
          bash .github/scripts/lintrunner.sh 2>&1 | tee ${{ github.workspace }}/lint_python_errors.log
      - name: Checkout PyTorch (for headers)
        uses: actions/checkout@v7
        with:
          repository: pytorch/pytorch
          path: pytorch-headers
          fetch-depth: 1
          submodules: false
      - name: Run lint check with Clang
        id: lint-clang
        continue-on-error: true
        env:
          PYTORCH_ROOT: ${{ github.workspace }}/pytorch-headers
        run: |
          cd ./torch-xpu-ops
          export ADDITIONAL_LINTRUNNER_ARGS="--take CLANGFORMAT,CLANGTIDY --all-files"
          set -o pipefail
          bash .github/scripts/lintrunner.sh 2>&1 | tee ${{ github.workspace }}/lint_clang_errors.log
      - name: Comment on lint failure
        if: >-
          ${{ (steps.lint-python.outcome == 'failure' || steps.lint-clang.outcome == 'failure')
          && github.event.pull_request.head.repo.full_name == github.repository
          && (contains(github.event.pull_request.labels.*.name, 'ai_generated')
              || github.event.pull_request.user.login == 'copilot[bot]') }}
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          FAILED_STEPS=""
          if [ "${{ steps.lint-python.outcome }}" = "failure" ]; then
            FAILED_STEPS="Python lint (flake8/ruff)"
          fi
          if [ "${{ steps.lint-clang.outcome }}" = "failure" ]; then
            if [ -n "$FAILED_STEPS" ]; then
              FAILED_STEPS="${FAILED_STEPS} and Clang format"
            else
              FAILED_STEPS="Clang format"
            fi
          fi
          JOB_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf -v COMMENT_BODY '%s\n' \
            "@copilot The ${FAILED_STEPS} check failed. Please fix the lint errors in this PR." \
            "" \
            "**Important: Do NOT update the plan in the PR description directly. Use reply comments to update the status.**" \
            "" \
            "Lint job log: ${JOB_URL}" \
            "" \
            "Instructions:" \
            "1. Review the lint failure log via the link above" \
            "2. Fix all lint errors in the relevant source files" \
            "3. Ensure both Python lint and Clang format checks pass" \
            "4. Use reply comments to report progress - do NOT modify the PR description plan directly"
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "${COMMENT_BODY}"
      - name: Fail if lint failed
        if: ${{ steps.lint-python.outcome == 'failure' || steps.lint-clang.outcome == 'failure' }}
        run: |
          echo "::error::Lint check failed. Error details below:"
          if [ "${{ steps.lint-python.outcome }}" = "failure" ]; then
            echo "=== Python lint (flake8/ruff) errors ==="
            cat ${{ github.workspace }}/lint_python_errors.log
          fi
          if [ "${{ steps.lint-clang.outcome }}" = "failure" ]; then
            echo "=== Clang format/tidy errors ==="
            cat ${{ github.workspace }}/lint_clang_errors.log
          fi
          exit 1
      - name: Check reproducer exists for AI-generated PR
        if: ${{ contains(github.event.pull_request.labels.*.name, 'ai_generated') && github.event.pull_request.head.repo.full_name == github.repository }}
        id: reproducer-check
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          cd ./torch-xpu-ops
          FAIL_MSG=""
          HAS_REPRO_FILES=false
          HAS_PR_CMD=false

          # Check if reproducer files exist
          if ls test/repro/test_*.py 1>/dev/null 2>&1; then
            # Validate pytest format
            for f in test/repro/test_*.py; do
              if grep -qE '^[[:space:]]*(def test_|class Test)' "$f"; then
                HAS_REPRO_FILES=true
              else
                FAIL_MSG="Reproducer \`$f\` is not in pytest format. It must contain pytest-style test functions (\`def test_...\`) or test classes (\`class Test...\`)."
                break
              fi
            done
            if [ "$HAS_REPRO_FILES" = true ] && [ -z "$FAIL_MSG" ]; then
              echo "Found valid reproducer files:"
              ls test/repro/test_*.py
            fi
          fi

          # Check if PR description contains pytest commands. A leading
          # VAR=value prefix is kept: the reproducer step evals the line, so
          # "ZE_AFFINITY_MASK=0,1 pytest ..." runs as written.
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q '.body' 2>/dev/null || true)
          PR_CMD=$(echo "$PR_BODY" | tr -d '\r' \
            | grep -E '^([A-Za-z_][A-Za-z0-9_]*=[^[:space:]]* +)*pytest ' || true)
          if [ -n "$PR_CMD" ]; then
            HAS_PR_CMD=true
            echo "Found reproducer commands in PR description:"
            echo "$PR_CMD"
          fi

          # Export for later steps
          echo "has_repro_files=$HAS_REPRO_FILES" >> "$GITHUB_OUTPUT"
          echo "has_pr_cmd=$HAS_PR_CMD" >> "$GITHUB_OUTPUT"
          # Use delimiter for multiline output
          echo "pr_cmd<<ENDOFCMD" >> "$GITHUB_OUTPUT"
          echo "$PR_CMD" >> "$GITHUB_OUTPUT"
          echo "ENDOFCMD" >> "$GITHUB_OUTPUT"

          # Fail only if neither source is available
          if [ "$HAS_REPRO_FILES" = false ] && [ "$HAS_PR_CMD" = false ] && [ -z "$FAIL_MSG" ]; then
            FAIL_MSG="No reproducer found. AI-generated PRs must include either reproducer files in \`test/repro/test_*.py\` or pytest commands in the PR description (lines starting with \`pytest\`, optionally preceded by \`VAR=value\` assignments)."
          fi

          if [ -n "$FAIL_MSG" ]; then
            PR_AUTHOR="${{ github.event.pull_request.user.login }}"
            printf -v COMMENT_BODY '%s\n' \
              "@${PR_AUTHOR} ${FAIL_MSG}" \
              "" \
              "Please provide a reproducer using one of these methods:" \
              "- Add reproducer files: \`test/repro/test_<description>.py\` (pytest format)" \
              "- Add pytest commands in the PR description (lines starting with \`pytest\`, optionally preceded by \`VAR=value\` assignments, e.g. \`pytest test/xpu/test_ops.py -k test_foo -v\` or \`ZE_AFFINITY_MASK=0,1 pytest test/xpu/distributed/test_foo.py\`)"
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "${COMMENT_BODY}"
            echo "::error::${FAIL_MSG}"
            exit 1
          fi
      - name: Read live PR labels
        if: ${{ !cancelled() }}
        id: live-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          echo "Live PR labels: $LABELS"
          has() { echo "$LABELS" | tr ',' '\n' | grep -qx "$1" && echo "true" || echo "false"; }
          echo "skip_all=$(has disable_all)" >> "$GITHUB_OUTPUT"
          echo "skip_ut=$(has disable_ut)" >> "$GITHUB_OUTPUT"
          echo "skip_e2e=$(has disable_e2e)" >> "$GITHUB_OUTPUT"
          echo "skip_distributed=$(has disable_distributed)" >> "$GITHUB_OUTPUT"
          echo "skip_win=$(has disable_win)" >> "$GITHUB_OUTPUT"
          echo "force_win_ut=$(has windows_ci)" >> "$GITHUB_OUTPUT"

  conditions-filter-win:
    if: ${{ github.repository_owner == 'intel' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      src_changed: ${{ steps.check-files.outputs.src_changed }}
    steps:
      - uses: dorny/paths-filter@v4
        id: check-files
        with:
          filters: |
            src_changed: 
              - 'cmake/**'
              - 'tools/**'
              - 'src/**.cmake'
              - 'CMakeLists.txt'
              - 'test/sycl/CMakeLists.txt'
              - 'src/xccl/CMakeLists.txt'
              - 'src/ATen/CMakeLists.txt'
              - 'src/CMakeLists.txt'
              - '.github/workflows/_windows_ut.yml'

  # Microbench. microbench-select runs in
  # parallel with lint: it pins the PyTorch commit of both builds, computes
  # the merge-base, selects cases, matches nightly reference data and decides
  # the path: vs-reference (screen the PR wheel, A/B only the suspects) or
  # vs-base (A/B directly, screening skipped).
  microbench-select:
    name: microbench-select
    if: ${{ github.repository_owner == 'intel' && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pytorch_sha: ${{ steps.commits.outputs.pytorch_sha }}
      merge_base: ${{ steps.commits.outputs.merge_base }}
      need_run: ${{ steps.select.outputs.need_run }}
      ab_possible: ${{ steps.select.outputs.ab_possible }}
      path: ${{ steps.select.outputs.path }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup python
        uses: ./.github/actions/setup-python
      - name: Install dependencies
        run: uv pip install pyyaml numpy pytest
      - name: Resolve PyTorch SHA and merge-base
        id: commits
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          MERGE_BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          PYTORCH_SHA=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'disable_build') }}" != "true" ]; then
            # Resolved once per run; linux-build and microbench-build-base both build this commit.
            PYTORCH_SHA=$(git ls-remote https://github.com/pytorch/pytorch.git "refs/heads/${{ github.base_ref }}" | cut -f1)
            if [ -z "${PYTORCH_SHA}" ]; then
              echo "::error::cannot resolve pytorch/pytorch ${{ github.base_ref }}"
              exit 1
            fi
          fi
          echo "pytorch_sha=${PYTORCH_SHA}" >> "${GITHUB_OUTPUT}"
          echo "merge_base=${MERGE_BASE}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Microbench commits"
            echo "- PyTorch \`${PYTORCH_SHA:-nightly wheel}\` (${{ github.base_ref }})"
            echo "- base (merge-base) \`${MERGE_BASE}\`"
            echo "- PR head \`${{ github.event.pull_request.head.sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Microbench config consistency check
        env:
          # report-only warning when measurement code changes without a
          # PROTOCOL_VERSION bump
          MICROBENCH_DIFF_BASE: ${{ steps.commits.outputs.merge_base }}
        run: |
          cd test
          python -m pytest microbench/tools/test_registry.py -q -rw
      - name: Fetch the nightly reference state
        id: state
        # unavailable state: every case counts as no_reference (direct A/B), so a
        # failure here only costs a base build
        continue-on-error: true
        run: |
          cd test
          python -m microbench reference fetch --repo "${{ github.repository }}" --out-dir ../mb_reference \
            --github-output "${GITHUB_OUTPUT}"
      - name: Select cases
        id: select
        env:
          MICROBENCH_MAINTAINER_TEAM: ${{ vars.MICROBENCH_MAINTAINER_TEAM }}
        run: |
          cd test
          # live labels: a label added after the push still counts on rerun
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          has() { echo "$LABELS" | tr ',' '\n' | grep -qx "$1"; }
          REASON=""
          if has disable_all; then
            REASON="Microbench skipped: CI disabled by label 'disable_all'."
          elif has disable_build; then
            REASON="Microbench skipped: label 'disable_build' replaces linux-build with the nightly wheel, so there is no PR wheel to compare."
          fi
          STATE=()
          if [ -n "${{ steps.state.outputs.state }}" ]; then
            STATE=(--reference-state "${{ steps.state.outputs.state }}" --reference-run "${{ steps.state.outputs.state_run }}")
          fi
          python -m microbench select --repo .. \
            --base "${{ steps.commits.outputs.merge_base }}" --head HEAD \
            --pr "${{ github.event.pull_request.number }}" --gh-repo "${{ github.repository }}" \
            --pytorch-sha "${{ steps.commits.outputs.pytorch_sha }}" "${STATE[@]}" \
            --out ../selection.json --summary "${GITHUB_STEP_SUMMARY}" \
            --cards 8 ${REASON:+--disable-reason "$REASON"}
      - name: Upload selection
        uses: actions/upload-artifact@v7
        with:
          name: microbench-selection-${{ github.event.pull_request.number }}
          path: selection.json
          overwrite: true

  linux-build:
    needs: [preci-lint-check, microbench-select]
    # !cancelled(): build even if microbench-select failed (it then passes no
    # PyTorch SHA, i.e. the previous HEAD behavior); lint must still pass.
    if: ${{ !cancelled() && needs.preci-lint-check.result == 'success' && github.repository_owner == 'intel' && github.event.pull_request.draft == false && needs.preci-lint-check.outputs.skip_all != 'true' }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build: [build]
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'nightly_wheel' || github.base_ref }}
      pytorch_sha: ${{ needs.microbench-select.outputs.pytorch_sha }}

  # Screening: the PR wheel only, against nightly reference data.
  # microbench / microbench-run (pr-vs-reference).
  microbench-run-pr-vs-reference:
    name: microbench
    needs: [microbench-select, linux-build]
    if: >-
      ${{ !cancelled() &&
      needs.microbench-select.outputs.need_run == 'true' &&
      needs.microbench-select.outputs.path == 'vs-reference' &&
      needs.linux-build.result == 'success' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_linux_microbench.yml
    with:
      scope: pr-vs-reference
      runner: bmg-test
      selection_artifact: microbench-selection-${{ github.event.pull_request.number }}
      artifact_id: ${{ github.event.pull_request.number }}
      pytorch_sha: ${{ needs.microbench-select.outputs.pytorch_sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      budget_min: '20'

  # Base wheel: the merge-base built against the same PyTorch
  # commit, torch only. After linux-build for a direct A/B, after screening when it
  # found suspects. When it fails, the A/B is skipped.
  microbench-build-base:
    name: microbench-build-base
    needs: [microbench-select, linux-build, microbench-run-pr-vs-reference]
    if: >-
      ${{ !cancelled() && needs.linux-build.result == 'success' &&
      needs.microbench-select.outputs.need_run == 'true' &&
      (needs.microbench-select.outputs.path == 'vs-base' ||
       (needs.microbench-run-pr-vs-reference.result == 'success' &&
        needs.microbench-run-pr-vs-reference.outputs.suspect == 'true')) }}
    secrets: inherit
    uses: ./.github/workflows/_linux_build.yml
    with:
      runner: build
      pytorch: ${{ github.base_ref }}
      pytorch_sha: ${{ needs.microbench-select.outputs.pytorch_sha }}
      torch_xpu_ops: ${{ needs.microbench-select.outputs.merge_base }}
      checkout_torch_xpu_ops: true
      torch_only: true
      category: baseline
      wheel_cache_key: microbench-base-torch-${{ needs.microbench-select.outputs.pytorch_sha }}-${{ needs.microbench-select.outputs.merge_base }}

  # A/B: microbench / microbench-run (pr-vs-base).
  microbench-run-pr-vs-base:
    name: microbench
    needs: [microbench-select, linux-build, microbench-run-pr-vs-reference, microbench-build-base]
    if: ${{ !cancelled() && needs.microbench-build-base.result == 'success' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_linux_microbench.yml
    with:
      scope: pr-vs-base
      runner: bmg-test
      selection_artifact: microbench-selection-${{ github.event.pull_request.number }}
      artifact_id: ${{ github.event.pull_request.number }}
      pytorch_sha: ${{ needs.microbench-select.outputs.pytorch_sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ needs.microbench-select.outputs.merge_base }}
      budget_min: ${{ needs.microbench-select.outputs.path == 'vs-base' && '35' || '20' }}

  # Final verdict: microbench / microbench-check;
  # microbench_override.yml reruns only this job.
  microbench-check:
    name: microbench
    needs: [microbench-select, microbench-run-pr-vs-reference, microbench-build-base, microbench-run-pr-vs-base]
    if: >-
      ${{ !cancelled() &&
      (needs.microbench-run-pr-vs-base.result == 'success' ||
       (needs.microbench-run-pr-vs-reference.result == 'success' &&
        needs.microbench-run-pr-vs-reference.outputs.suspect != 'true')) }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/_linux_microbench_check.yml
    with:
      scope: pr
      artifact_id: ${{ github.event.pull_request.number }}
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ needs.microbench-select.outputs.merge_base }}
      mode_label: ${{ needs.microbench-select.outputs.ab_possible == 'false' && 'A/A - only microbench code changed, the PR wheel against reference data (report only)' || '' }}

  reproducer-test:
    needs: [linux-build, preci-lint-check]
    if: ${{ needs.preci-lint-check.outputs.skip_all != 'true' }}
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_reproducer.yml
    with:
      runner: build
      pytorch: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'nightly_wheel' || github.base_ref }}
      torch_xpu_ops: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'pinned' || 'main' }}
      pr_body_cmd: ${{ needs.preci-lint-check.outputs.pr_body_cmd }}

  linux-ut:
    needs: [linux-build, reproducer-test, preci-lint-check]
    if: ${{ needs.preci-lint-check.outputs.skip_all != 'true' && needs.preci-lint-check.outputs.skip_ut != 'true' }}
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: [op_ut,basic]
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: bmg-test
      pytorch: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'nightly_wheel' || github.base_ref }}
      torch_xpu_ops: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'pinned' || 'main' }}
      ut: ${{ matrix.ut_name }}

  linux-distributed:
    needs: [linux-build, reproducer-test, preci-lint-check]
    if: ${{ needs.preci-lint-check.outputs.skip_all != 'true' && needs.preci-lint-check.outputs.skip_distributed != 'true' }}
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ut_name: [xpu_distributed]
    uses: ./.github/workflows/_linux_ut.yml
    with:
      runner: distributed
      pytorch: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'nightly_wheel' || github.base_ref }}
      torch_xpu_ops: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'pinned' || 'main' }}
      ut: ${{ matrix.ut_name }}

  linux-e2e:
    name: linux-e2e
    needs: [linux-build, reproducer-test, preci-lint-check]
    if: ${{ needs.preci-lint-check.outputs.skip_all != 'true' && needs.preci-lint-check.outputs.skip_e2e != 'true' }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        suite: [huggingface, timm_models, torchbench]
        scenario: [accuracy, performance]
    uses: ./.github/workflows/_linux_e2e.yml
    with:
      runner: ${{ matrix.scenario == 'performance' && 'pvc-1550' || 'pvc' }}
      test_type: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'wheel-cicd' || 'build-cicd' }}
      pytorch: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'nightly_wheel' || github.base_ref }}
      suite: ${{ matrix.suite }}
      scenario: ${{ matrix.scenario }}
  linux-e2e-summary:
    name: linux-e2e-summary
    needs: [linux-e2e, preci-lint-check]
    if: ${{ !cancelled() && needs.preci-lint-check.outputs.skip_all != 'true' && !endsWith(needs.linux-e2e.result, 'ed') }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/_linux_e2e_summary.yml
    with:
      test_type: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'wheel-cicd' || 'build-cicd' }}

  windows-build:
    name: windows-build
    needs: preci-lint-check
    if: >-
      ${{ github.repository_owner == 'intel' && github.event.pull_request.draft == false
      && needs.preci-lint-check.outputs.skip_all != 'true'
      && needs.preci-lint-check.outputs.skip_win != 'true' }}
    secrets: inherit
    uses: ./.github/workflows/_windows_build.yml
    with:
      runner: windows-build
      pytorch: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'nightly_wheel' || github.base_ref }}
      torch_xpu_ops: ${{ contains(github.event.pull_request.labels.*.name, 'disable_build') && 'pinned' || 'main' }}

  windows-ut:
    name: windows-ut
    needs: [windows-build, conditions-filter-win, preci-lint-check]
    if: >-
      ${{ needs.preci-lint-check.outputs.skip_all != 'true'
      && needs.preci-lint-check.outputs.skip_win != 'true'
      && (needs.preci-lint-check.outputs.force_win_ut == 'true'
      || (needs.preci-lint-check.outputs.skip_ut != 'true'
      && needs.conditions-filter-win.outputs.src_changed == 'true')) }}
