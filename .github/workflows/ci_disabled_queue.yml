name: CI DISABLED Queue

on:
  # No `schedule` yet. Discovery reads chuanqi129/pytorch-xpu-ci#364, and
  # MERGE_TOKEN is a fine-grained PAT, which cannot reach a repo owned by another
  # personal account -- the token-access job below proves it with a 404, with
  # torchxpubot already a collaborator there. A cron would just 404 every hour.
  # Restore `- cron: '0 0,9-23 * * *'` (hourly, 17:00-08:00 Beijing) once the
  # report issue moves into this repo; nothing but SOURCE_* has to change.
  workflow_dispatch:
    inputs:
      issues:
        description: 'pytorch issue numbers to queue now, space separated (empty = discover)'
        default: ''
      dry_run:
        description: 'Print the trigger instead of posting it'
        type: boolean
        default: true

  pull_request:
    paths:
      - '.github/workflows/ci_disabled_queue.yml'
      - '.github/scripts/ci_disabled_queue.py'

permissions:
  contents: read

# One queue keeper at a time: overlapping runs could mirror the same batch twice.
concurrency:
  group: ci-disabled-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Queue the next DISABLED batch
        # Inputs go through the environment, never through the `run` string: a
        # workflow_dispatch input interpolated into a shell command is an
        # injection vector. The script keeps only the digits out of ISSUES.
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
          ISSUES: ${{ inputs.issues }}
          # Only the exact string "false" posts, so a restored cron has to say so
          # outright instead of inheriting an empty input.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: python3 .github/scripts/ci_disabled_queue.py

  self-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/ci_disabled_queue.py --self-test

  # Tracks when discovery becomes possible. Reading SOURCE is the one thing about
  # this workflow that cannot be checked locally, and it does not work today, so
  # this warns rather than fails -- it turns green by itself once the report issue
  # moves into this repo, which is the signal to restore the cron above.
  token-access:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: "Probe: can MERGE_TOKEN read the private CI report issue?"
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            try {
              const r = await github.rest.issues.listComments({
                owner: 'chuanqi129', repo: 'pytorch-xpu-ci',
                issue_number: 364, per_page: 1
              });
              core.notice(`readable (${r.data.length} comment) -- discovery can be `
                + `re-enabled: restore the cron and point SOURCE_* at the report issue.`);
            } catch (e) {
              core.warning(
                `not readable: HTTP ${e.status}. Expected today. torchxpubot IS a `
                + `collaborator there, so a 404 means MERGE_TOKEN is a fine-grained `
                + `PAT: those are scoped to one resource owner (the token owner's `
                + `account, or an org that opted in), and a repo owned by another `
                + `personal account can never be selected. Use the ISSUES input `
                + `until the report issue moves into this repo.`
              );
            }
