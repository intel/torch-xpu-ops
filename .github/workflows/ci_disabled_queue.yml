name: CI DISABLED Queue

on:
  schedule:
    # Hourly outside Beijing (UTC+8) working hours, 17:00-08:00 CST. Each run
    # queues at most one batch and only when no `fix` job is in flight, so a
    # backlog drains a batch per completed fix instead of all at once.
    - cron: '0 0,9-23 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the next batch instead of posting it'
        type: boolean
        default: true

  pull_request:
    paths:
      - '.github/workflows/ci_disabled_queue.yml'
      - '.github/scripts/ci_disabled_queue.py'

permissions:
  contents: read

# One queue keeper at a time: overlapping runs could mirror the same batch twice.
concurrency:
  group: ci-disabled-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Queue the next DISABLED batch
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: |
          python3 .github/scripts/ci_disabled_queue.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}

  self-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/ci_disabled_queue.py --self-test

  # The one thing about this workflow a reviewer cannot check locally: it reads an
  # issue in a private repo owned by a personal account, so MERGE_TOKEN's reach
  # decides whether the queue works at all. Asserted here the way bot.yml's
  # token-permission-test asserts its own token needs.
  token-access:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: "Test: MERGE_TOKEN can read the private CI report issue"
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            try {
              const r = await github.rest.issues.listComments({
                owner: 'chuanqi129', repo: 'pytorch-xpu-ci',
                issue_number: 364, per_page: 1
              });
              console.log(`listComments OK - ${r.data.length} comment(s) readable`);
            } catch (e) {
              core.setFailed(
                `cannot read chuanqi129/pytorch-xpu-ci#364: HTTP ${e.status}. `
                + `A 404 here with torchxpubot already a collaborator means `
                + `MERGE_TOKEN is a fine-grained PAT: those are scoped to one `
                + `resource owner (your account, or an org that opted in), so a `
                + `repo owned by another personal account is out of reach no `
                + `matter what collaborator grant exists.`
              );
            }
