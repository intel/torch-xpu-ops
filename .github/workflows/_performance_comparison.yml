name: Performance Comparison

on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
        default: ''
        description: Target run id
      baseline:
        required: true
        type: string
        default: ''
        description: Baseline run id

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  Performance-Comparison:
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup python
        uses: ./.github/actions/setup-python
      - name: Downlaod artifacts
        env:
          TARGET_RUN_ID: ${{ inputs.target }}
          BASELINE_RUN_ID: ${{ inputs.baseline }}
        run: |
          rm -rf target && mkdir target && cd target
          gh --repo "${GITHUB_REPOSITORY}" run download "${TARGET_RUN_ID}" -p "Inductor-*-XPU-E2E-*"
          mv Inductor-*-XPU-E2E-*/* . && cd ..
          rm -rf baseline && mkdir baseline && cd baseline
          gh --repo "${GITHUB_REPOSITORY}" run download "${BASELINE_RUN_ID}" -p "Inductor-*-XPU-E2E-*"
          mv Inductor-*-XPU-E2E-*/* . && cd ..
      - name: Comparison result
        run: |
          uv pip install pandas
          python .github/scripts/perf_comparison.py --target target --baseline baseline >> "${GITHUB_STEP_SUMMARY}"
