name: fix build smoke

# One-shot smoke test: prove the agent-fix build-in-the-loop chain works
# end to end on the xpu-agent runner, and collect real environment data
# (oneAPI install time, cold build time, whether sycl-ls sees the GPU).
#
# Sample (ground truth): issue #4980 / PR #5004 — FFT empty-batch oneMKL fix.
# A single-file C++ change (src/ATen/native/xpu/mkl/SpectralOps.cpp, +8/-0)
# that a nightly wheel CANNOT verify, so it exercises the source-build path.
#
# Manual only (workflow_dispatch). Not wired into bot.yml. Must live on the
# default branch for the "Run workflow" button / `gh workflow run` to work.

on:
  workflow_dispatch:
    inputs:
      nightly_version:
        description: "Nightly torch version to reproduce against (locks the ground-truth env)"
        default: "2.15.0.dev20260817+xpu"
      fix_pr:
        description: "PR number to pull the fix diff from"
        default: "5004"
      driver:
        description: "build+verify driver: shell (scripted) or agent (claude via /xpu-build-pytorch)"
        type: choice
        options: [shell, agent]
        default: shell

env:
  BEDROCK_MODEL: global.anthropic.claude-opus-5
  # UT node ids to reproduce (before) and verify (after). From PR #5004 test plan.
  FFT_FAIL_TESTS: >-
    test_comprehensive_fft_fftn_xpu_int32
    test_comprehensive_fft_irfft_xpu_bool
    test_comprehensive_fft_hfft_xpu_float64
    test_comprehensive_fft_fft_xpu_float64
    test_comprehensive_fft_fft2_xpu_float16
    test_comprehensive_fft_fftn_xpu_float16
    test_comprehensive_fft_fft2_xpu_float64
    test_comprehensive_fft_ifft_xpu_bool
    test_comprehensive_fft_fft_xpu_bool
  FFT_REGRESSION_TESTS: >-
    test_comprehensive_fft_fft_xpu_float32
    test_comprehensive_fft_fft2_xpu_float32
    test_comprehensive_fft_fftn_xpu_float32
    test_comprehensive_fft_ifft_xpu_float32
    test_comprehensive_fft_irfft_xpu_float32
    test_comprehensive_fft_rfft_xpu_float32

permissions:
  contents: read

jobs:
  smoke:
    runs-on: xpu-agent
    timeout-minutes: 480
    container:
      image: intelgpu/ubuntu-26.04-rolling:26.18
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      options: --device=/dev/mem --device=/dev/dri
              --security-opt seccomp=unconfined --cap-add=SYS_ADMIN
              --shm-size=8g --privileged -e ZE_AFFINITY_MASK
    env:
      GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
      NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      FIX_PR: ${{ inputs.fix_pr }}
      # ponytail: fixed for this sample; the FFT UTs live in the inductor opinfo file.
      TEST_FILE: test/inductor/test_torchinductor_opinfo.py
      PYTORCH_DIR: ${{ github.workspace }}/pytorch
    steps:
      - name: Checkout torch-xpu-ops (for the fix diff + skills)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MERGE_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "torchxpubot"
          git config --global user.email "torchxpubot@intel.com"

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python: '3.10'

      # --- Step 1: nightly wheel + freeze the pytorch commit ---------------
      - name: Install nightly PyTorch-XPU wheel
        run: |
          set -euxo pipefail
          # Lock to the exact nightly whose torch-xpu-ops pin predates PR #5004,
          # so the wheel still has the bug (FFT UTs fail). Only torch is needed;
          # vision/audio would drag in version conflicts and the FFT UTs need neither.
          uv pip install --prerelease=allow \
            "torch==${NIGHTLY_VERSION}" \
            --index-url https://download.pytorch.org/whl/nightly/xpu
          python -c "import torch; print('torch', torch.__version__); \
            print('xpu available:', torch.xpu.is_available())"
          # Freeze the pytorch commit this nightly was built from.
          PT_SHA=$(python -c "import torch; print(torch.version.git_version)")
          echo "PT_SHA=$PT_SHA" | tee -a "$GITHUB_ENV"
          echo "### nightly install" >> "$GITHUB_STEP_SUMMARY"
          echo "- torch: \`$(python -c 'import torch;print(torch.__version__)')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- xpu available (wheel): \`$(python -c 'import torch;print(torch.xpu.is_available())')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- frozen pytorch sha: \`$PT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # --- Step 2: repro baseline (before) — must FAIL ---------------------
      - name: Reproduce FFT failures on nightly (expect FAILED)
        run: |
          set -uxo pipefail
          # Need the pytorch source tree for the UT file even on the wheel path.
          git clone --depth 1 --revision "$PT_SHA" \
            https://github.com/pytorch/pytorch.git "$PYTORCH_DIR" || \
            git clone https://github.com/pytorch/pytorch.git "$PYTORCH_DIR"
          git -C "$PYTORCH_DIR" fetch --depth 1 origin "$PT_SHA" && \
            git -C "$PYTORCH_DIR" checkout "$PT_SHA" || true
          cd "$PYTORCH_DIR"
          fail=0
          for t in $FFT_FAIL_TESTS; do
            if python "$TEST_FILE" -v -k "$t" 2>&1 | tee -a /tmp/before.log \
                 | grep -qE "PASSED|OK"; then
              echo "UNEXPECTED PASS (before): $t"
            else
              fail=$((fail+1))
            fi
          done
          echo "before: $fail/$(echo $FFT_FAIL_TESTS | wc -w) failed" | tee -a "$GITHUB_STEP_SUMMARY"
          # If nothing failed the nightly version is wrong — stop early.
          [ "$fail" -gt 0 ] || { echo "::error::no FFT failures on nightly; version mismatch"; exit 1; }

      # --- Step 3: install oneAPI toolchain (the key unknown) --------------
      - name: Install oneAPI + gcc-13 (timed)
        run: |
          set -uxo pipefail
          t0=$(date +%s)
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            intel-basekit gcc-13 g++-13
          t1=$(date +%s)
          echo "### oneAPI toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo "- apt install time: \`$((t1-t0))s\`" >> "$GITHUB_STEP_SUMMARY"
          test -d /opt/intel/oneapi/compiler || { echo "::error::oneAPI not at /opt/intel/oneapi/compiler"; exit 1; }
          # shellcheck disable=SC1091
          source /opt/intel/oneapi/setvars.sh || source /opt/intel/oneapi/compiler/latest/env/vars.sh
          echo "- icpx: \`$(icpx --version 2>&1 | head -1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- gcc-13: \`$(gcc-13 --version 2>&1 | head -1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- sycl-ls:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sycl-ls 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "sycl-ls failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- Step 4: populate torch-xpu-ops + apply the fix ------------------
      - name: Populate torch-xpu-ops submodule + apply PR fix
        run: |
          set -euxo pipefail
          # AGENTS.md "Commit Pin & Development Override": clone into the path
          # CMake expects, then pin xpu.txt to HEAD so CMake's checkout is a no-op.
          rm -rf "$PYTORCH_DIR/third_party/torch-xpu-ops"
          cp -a "$GITHUB_WORKSPACE" "$PYTORCH_DIR/third_party/torch-xpu-ops"
          cd "$PYTORCH_DIR/third_party/torch-xpu-ops"
          # Apply the known-good fix from the PR (B: we do NOT let the agent write it).
          gh pr diff "$FIX_PR" --repo intel/torch-xpu-ops --patch > /tmp/fix.patch
          git apply -p1 /tmp/fix.patch || git apply /tmp/fix.patch
          git rev-parse HEAD > "$PYTORCH_DIR/third_party/xpu.txt"
          echo "### fix applied" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Write build_pytorch.env
        run: |
          cat > "$PYTORCH_DIR/build_pytorch.env" <<'EOF'
          export USE_XPU=1
          export USE_CUDA=0
          source /opt/intel/oneapi/setvars.sh 2>/dev/null || source /opt/intel/oneapi/compiler/latest/env/vars.sh
          EOF

      # --- Step 5a: shell driver — scripted build + verify ----------------
      - name: Build + verify (shell driver)
        if: inputs.driver == 'shell'
        run: |
          set -uxo pipefail
          cd "$PYTORCH_DIR"
          # shellcheck disable=SC1091
          source build_pytorch.env
          pip install -r requirements.txt || true
          t0=$(date +%s)
          pip install -e . -v --no-build-isolation 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          echo "### build (shell)" >> "$GITHUB_STEP_SUMMARY"
          echo "- cold build time: \`$((t1-t0))s\`, rc=$rc" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || { echo "::error::build failed"; exit 1; }

          echo "- xpu available (source): \`$(python -c 'import torch;print(torch.xpu.is_available())')\`" >> "$GITHUB_STEP_SUMMARY"

          echo "### verify (after)" >> "$GITHUB_STEP_SUMMARY"
          pass=0; total=0
          for t in $FFT_FAIL_TESTS $FFT_REGRESSION_TESTS; do
            total=$((total+1))
            if python "$TEST_FILE" -v -k "$t" 2>&1 | tee -a /tmp/after.log \
                 | grep -qE "PASSED|OK"; then
              pass=$((pass+1))
            else
              echo "STILL FAILING (after): $t" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "- passed: \`$pass/$total\`" >> "$GITHUB_STEP_SUMMARY"
          [ "$pass" -eq "$total" ] || { echo "::error::verify: $pass/$total passed"; exit 1; }

      # --- Step 5b: agent driver — claude runs build+verify via skill -----
      - name: Build + verify (agent driver)
        if: inputs.driver == 'agent'
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.MERGE_TOKEN }}
          settings: '{"alwaysThinkingEnabled": true}'
          claude_args: "--model ${{ env.BEDROCK_MODEL }} --max-turns 200 --allowedTools Bash,Read,Glob,Grep,Skill,Task"
          prompt: |
            A PyTorch source tree is checked out at ${{ env.PYTORCH_DIR }} with the
            fix from PR #${{ inputs.fix_pr }} already applied under
            third_party/torch-xpu-ops, and the torch-xpu-ops development pin
            override is already set in third_party/xpu.txt. oneAPI and gcc-13 are
            installed. A build_pytorch.env exists in the pytorch root.

            Your ONLY job: build PyTorch from source and verify the fix. Do NOT
            edit any source, do NOT write the fix — it is already applied.

            1. Use the /xpu-build-pytorch skill to build from ${{ env.PYTORCH_DIR }}
               (source build_pytorch.env first).
            2. Confirm torch.xpu.is_available() is True on the source build.
            3. Run these UTs from ${{ env.PYTORCH_DIR }} and confirm ALL pass
               (file: ${{ env.TEST_FILE }}):
               ${{ env.FFT_FAIL_TESTS }} ${{ env.FFT_REGRESSION_TESTS }}
            4. Report cold build time, xpu availability, and the pass/fail count.
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/before.log
            /tmp/build.log
            /tmp/after.log
            /tmp/fix.patch
          if-no-files-found: ignore
