name: Code check

on:
  workflow_call:
    secrets:
      COPILOT_TOKEN:
        required: false
    inputs:
      full:
        description: Check every file instead of only the files changed by the pull request
        type: boolean
        default: false

permissions: {}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      groups: ${{ steps.scope.outputs.groups }}
      github: ${{ steps.scope.outputs.github }}
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve incremental or full scope
        id: scope
        env:
          FULL_INPUT: ${{ inputs.full }}
        run: |
          full=false
          : > "${RUNNER_TEMP}/changed.txt"
          if [[ "${FULL_INPUT}" == "true" || "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            full=true
          else
            # pull_request checks out the merge commit; its first parent is the base branch tip.
            git diff --name-only --diff-filter=ACMR HEAD^1 HEAD > "${RUNNER_TEMP}/changed.txt"
            # Linter config changes can surface issues in untouched files.
            if grep -qE '^(\.lintrunner\.toml|tools/linter/|\.clang-format|\.clang-tidy|pyproject\.toml|\.cmakelintrc)' "${RUNNER_TEMP}/changed.txt"; then
              full=true
            fi
          fi
          has() { if [[ "${full}" == "true" ]] || grep -qE "$1" "${RUNNER_TEMP}/changed.txt"; then echo true; else echo false; fi; }
          groups="{\"general\": true"
          groups+=", \"python\": $(has '\.pyi?$')"
          groups+=", \"cpp\": $(has '\.(c|cc|cpp|h|hpp)$')"
          groups+=", \"cmake\": $(has '(\.cmake(\.in)?|CMakeLists\.txt)$')"
          groups+=", \"shell\": $(has '\.sh$')"
          groups+=", \"config\": $(has '\.(json|ya?ml|toml|js)$')}"
          {
            echo "full=${full}"
            echo "groups=${groups}"
            echo "github=$(has '^\.github/')"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Code check scope: $([[ "${full}" == "true" ]] && echo full || echo incremental)"
            sed 's/^/- /' "${RUNNER_TEMP}/changed.txt"
          } >> "${GITHUB_STEP_SUMMARY}"

  lintrunner:
    name: lintrunner (${{ matrix.group }})
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Must cover every LINT_GROUPS entry in tools/linter/lintrunner.sh.
        group: [general, python, cpp, cmake, shell, config]
    steps:
      - name: Checkout torch-xpu-ops
        if: ${{ fromJSON(needs.scope.outputs.groups)[matrix.group] }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: torch-xpu-ops
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout PyTorch (for clang-tidy headers)
        if: ${{ matrix.group == 'cpp' && fromJSON(needs.scope.outputs.groups).cpp }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pytorch/pytorch
          path: pytorch-headers
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Run lintrunner
        if: ${{ fromJSON(needs.scope.outputs.groups)[matrix.group] }}
        working-directory: torch-xpu-ops
        env:
          LINT_GROUP: ${{ matrix.group }}
          LINT_SCOPE: ${{ needs.scope.outputs.full == 'true' && 'full' || 'incremental' }}
          LINT_BASE: HEAD^1
          PYTORCH_ROOT: ${{ github.workspace }}/pytorch-headers
        run: bash tools/linter/lintrunner.sh

  actionlint:
    name: actionlint
    needs: scope
    if: ${{ needs.scope.outputs.github == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          FULL: ${{ needs.scope.outputs.full }}
        run: |
          TARGETS=()
          if [[ "${FULL}" != "true" ]]; then
            CHANGED=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD)
            # Composite action or config changes can break any workflow, so lint them all.
            if ! grep -qE '^\.github/(actions/|ci-config/actionlint\.yaml$)' <<< "${CHANGED}"; then
              mapfile -t TARGETS < <(grep -E '^\.github/workflows/[^/]+\.ya?ml$' <<< "${CHANGED}" || true)
              if [[ ${#TARGETS[@]} -eq 0 ]]; then
                echo "No workflow changes to lint."
                exit 0
              fi
            fi
          fi
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -color -config-file .github/ci-config/actionlint.yaml \
            -format "{{range \$err := .}}::error file={{\$err.Filepath}},line={{\$err.Line}},col={{\$err.Column}},title=actionlint {{\$err.Kind}}::{{\$err.Message}}\n{{end}}" \
            "${TARGETS[@]}"

  zizmor:
    name: zizmor
    needs: scope
    if: ${{ needs.scope.outputs.github == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ needs.scope.outputs.full }}
        run: |
          TARGETS=(.)
          if [[ "${FULL}" != "true" ]]; then
            CHANGED=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD)
            if ! grep -qx '.github/ci-config/zizmor.yml' <<< "${CHANGED}"; then
              mapfile -t TARGETS < <(grep -E '^\.github/(workflows/[^/]+|actions/.+/action|dependabot)\.ya?ml$' <<< "${CHANGED}" || true)
              if [[ ${#TARGETS[@]} -eq 0 ]]; then
                echo "No workflow or action changes to audit."
                exit 0
              fi
            fi
          fi
          pipx run zizmor==1.31.1 --config .github/ci-config/zizmor.yml --format github "${TARGETS[@]}"

  gitleaks:
    name: gitleaks
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          FULL: ${{ needs.scope.outputs.full }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
          ARGS=()
          if [[ "${FULL}" != "true" && -n "${PR_BASE_SHA}" ]]; then
            # Every PR commit, so secrets added then removed within the PR are still caught.
            ARGS=(--log-opts="${PR_BASE_SHA}..HEAD")
          fi
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner "${ARGS[@]}"

  notify-copilot:
    needs: [lintrunner, actionlint, zizmor]
    if: >-
      ${{ failure() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (contains(github.event.pull_request.labels.*.name, 'ai_generated')
          || github.event.pull_request.user.login == 'copilot[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask Copilot to fix lint errors
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf -v COMMENT_BODY '%s\n' \
            "@copilot The code check (lintrunner/actionlint/zizmor) failed. Please fix the reported errors in this PR." \
            "" \
            "**Important: Do NOT update the plan in the PR description directly. Use reply comments to update the status.**" \
            "" \
            "Lint job log: ${JOB_URL}" \
            "" \
            "Instructions:" \
            "1. Review the lint failure log via the link above" \
            "2. Fix all lint errors in the relevant source files" \
            "3. Reproduce locally with \`lintrunner -m origin/main\` until it passes" \
            "4. Use reply comments to report progress - do NOT modify the PR description plan directly"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${COMMENT_BODY}"
