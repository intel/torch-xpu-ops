name: Linux Unit Test
description: Unit Tests

inputs:
  ut_name:
    required: true
    description: Which ut to launch
  skip_summary:
    default: 'false'
    description: "When 'true', do not write the per-job UT summary panel (caller runs its own comparison)"

runs:
  using: composite
  steps:
    - name: Check Python
      shell: bash -xe {0}
      run: |
        which python && python -V
        uv pip list
    - name: Install pytest XPU custom plugin
      shell: bash -xe {0}
      run: |
        # Global pytest plugin: auto-registered via pytest11 entry point,
        # restarts an xdist worker on fatal XPU failures (crash/OOM/segfault).
        uv pip install ${{ github.workspace }}/.github/scripts/pytest_custom_config
    - name: op_regression
      shell: timeout 3600 bash -xe {0}
      if: ${{ inputs.ut_name == 'op_regression' || inputs.ut_name == 'basic' }}
      run: |
        log_dir="${{ github.workspace }}/ut_log/${{ inputs.ut_name }}"
        mkdir -p ${log_dir}
        cd pytorch/third_party/torch-xpu-ops/test/regressions
        pytest --junit-xml=${{ github.workspace }}/ut_log/op_regression.xml \
          2> ${log_dir}/op_regression_test_error.log |tee ${log_dir}/op_regression_test.log
        echo -e "File Path: cd pytorch/third_party/torch-xpu-ops/test/regressions" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_regression.log
        echo -e "Reproduce Command: pytest -sv failed_case" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_regression.log
    - name: op_regression_dev1
      shell: timeout 300 bash -xe {0}
      if: ${{ inputs.ut_name == 'op_regression_dev1' || inputs.ut_name == 'basic' }}
      run: |
        log_dir="${{ github.workspace }}/ut_log/${{ inputs.ut_name }}"
        mkdir -p ${log_dir}
        cd pytorch/third_party/torch-xpu-ops/test/regressions
        timeout 180 pytest test_operation_on_device_1.py \
          --junit-xml=${{ github.workspace }}/ut_log/op_regression_dev1.xml \
          2> ${log_dir}/op_regression_dev1_test_error.log |tee ${log_dir}/op_regression_dev1_test.log
        echo -e "File Path: cd pytorch/third_party/torch-xpu-ops/test/regressions" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_regression_dev1.log
        echo -e "Reproduce Command: pytest -sv failed_case" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_regression_dev1.log
    - name: op_extended
      shell: timeout 3600 bash -xe {0}
      if: ${{ inputs.ut_name == 'op_extended' || inputs.ut_name == 'basic' }}
      run: |
        export PYTORCH_TEST_WITH_SLOW=1
        log_dir="${{ github.workspace }}/ut_log/${{ inputs.ut_name }}"
        mkdir -p ${log_dir}
        cd pytorch/third_party/torch-xpu-ops/test/xpu/extended
        python run_test_with_skip.py \
          2> ${log_dir}/op_extended_test_error.log |tee ${log_dir}/op_extended_test.log
        ls -al
        cp *.xml ${{ github.workspace }}/ut_log
        echo -e "File Path: cd pytorch/third_party/torch-xpu-ops/test/xpu/extended" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_extended.log
        echo -e "Reproduce Command: pytest -sv failed_case" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_extended.log
    - name: op_ut
      shell: timeout 72000 bash -xe {0}
      if: ${{ inputs.ut_name == 'op_ut' }}
      run: |
        export PYTORCH_TEST_WITH_SLOW=1
        mkdir -p ut_log/op_ut
        cd pytorch/third_party/torch-xpu-ops/test/xpu
        python run_test_with_skip.py \
          2> ${{ github.workspace }}/ut_log/op_ut/op_ut_with_skip_test_error.log | \
          tee ${{ github.workspace }}/ut_log/op_ut/op_ut_with_skip_test.log
        find . -type f -name "op_ut_with_*.xml" -exec mv {} ${{ github.workspace }}/ut_log/ \; || true
        echo -e "File Path: cd pytorch/third_party/torch-xpu-ops/test/xpu" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_ut.log
        echo -e "Reproduce Command: pytest -sv failed_case" | tee -a ${{ github.workspace }}/ut_log/reproduce_op_ut.log
    - name: skipped_ut
      shell: timeout 72000 bash -xe {0}
      if: ${{ inputs.ut_name == 'skipped_ut' }}
      run: |
        export PYTORCH_TEST_WITH_SLOW=1
        export PYTEST_ADDOPTS="$(echo "${PYTEST_ADDOPTS}" | sed 's/--timeout 600/--timeout 3600/')"
        mkdir -p ut_log/skipped_ut
        cd pytorch/third_party/torch-xpu-ops/test/xpu
        python run_test_with_skip.py --test-cases skipped \
          2> ${{ github.workspace }}/ut_log/skipped_ut/skipped_ut_with_skip_test_error.log | \
          tee ${{ github.workspace }}/ut_log/skipped_ut/skipped_ut_with_skip_test.log
        find . -type f -name "op_ut_with_*.xml" -exec mv {} ${{ github.workspace }}/ut_log/ \; || true
        echo -e "File Path: cd pytorch/third_party/torch-xpu-ops/test/xpu" | tee -a ${{ github.workspace }}/ut_log/reproduce_skipped_ut.log
        echo -e "Reproduce Command: pytest -sv failed_case" | tee -a ${{ github.workspace }}/ut_log/reproduce_skipped_ut.log
    - name: torch_xpu
      shell: timeout 72000 bash -xe {0}
      if: ${{ inputs.ut_name == 'torch_xpu' }}
      run: |
        export PYTORCH_TEST_WITH_SLOW=1
        export PYTORCH_TESTING_DEVICE_ONLY_FOR="xpu"
        mkdir -p ut_log/torch_xpu
        cd pytorch
        test_cmd="python test/run_test.py --include "
        for test in $(ls test/inductor | grep test); do test_cmd="${test_cmd} inductor/$test"; done
        for test in $(ls test/xpu | grep test); do test_cmd="${test_cmd} xpu/$test"; done
        if [ -f "test/test_xpu.py" ]; then test_cmd="${test_cmd} test_xpu.py"; fi
        eval $test_cmd 2> ${{ github.workspace }}/ut_log/torch_xpu/torch_xpu_test_error.log | \
          tee ${{ github.workspace }}/ut_log/torch_xpu/torch_xpu_test.log
    - name: xpu_profiling
      shell: timeout 3600 bash -xe {0}
      if: ${{ inputs.ut_name == 'xpu_profiling' }}
      run: |
        mkdir -p ut_log/xpu_profiling/issue_reproduce
        cd pytorch/third_party/torch-xpu-ops
        # xdist (-n / --tx from detect-devices.sh) captures stdout and would drop
        # the profiler tables the cases print for manual check
        export PYTEST_ADDOPTS="-v --timeout 3600 --timeout_method=thread"
        # RN50 Test (runs rn50.py, then checks its kernel events, runtime op time and .pt artifact)
        # the xpu_profiling_ prefix is what check-ut.py uses to group these reports
        python -m pytest -s -v \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/xpu_profiling_rn50.xml \
          test/profiling/test_rn50_profiling.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/rn50.log
        cp profiling.fp32.train.pt ${{ github.workspace }}/ut_log/xpu_profiling || true
        # All Issue Reproduce UT (-s keeps the profiler tables in the log for manual check)
        python -m pytest -s -v \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/issue_reproduce/xpu_profiling_test_issue_reproducers.xml \
          test/profiling/test_issue_reproducers.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/issue_reproduce/test_issue_reproducers.log
        python -m pytest -s \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/issue_reproduce/xpu_profiling_test_profiler_correctness.xml \
          test/profiling/test_profiler_correctness.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/issue_reproduce/test_profiler_correctness.log
        # Overlapping kernels test (depends on rn50.log.json from RN50 run above)
        python -m pytest -s \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/issue_reproduce/xpu_profiling_test_for_overlapping_kernels.xml \
          test/profiling/test_for_overlapping_kernels.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/issue_reproduce/test_for_overlapping_kernels.log
        python -m pytest -s \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/xpu_profiling_test_profiler_use_cases.xml \
          test/xpu/profiler/test_profiler_use_cases.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/test_profiler_use_cases.log

        # llama case for calls number test
        uv pip install transformers
        python -m pytest -s -v \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/xpu_profiling_llama.xml \
          test/profiling/test_llama_profiling.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/llama.log

        # All xpu ut under test/profiler
        cd ../../test/profiler
        python -m pytest -s \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/xpu_profiling_test_execution_trace.xml \
          test_execution_trace.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/test_execution_trace.log
        python -m pytest -s \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/xpu_profiling_test_memory_profiler.xml \
          test_memory_profiler.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/test_memory_profiler.log
        python -m pytest -s \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/xpu_profiling_test_profiler_tree.xml \
          test_profiler_tree.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/test_profiler_tree.log
        python -m pytest -s \
          --junitxml=${{ github.workspace }}/ut_log/xpu_profiling/xpu_profiling_test_xpu_profiler.xml \
          test_xpu_profiler.py | \
          tee ${{ github.workspace }}/ut_log/xpu_profiling/test_xpu_profiler.log

        find ${{ github.workspace }}/ut_log/xpu_profiling -type f -name "*.xml" \
          -exec mv {} ${{ github.workspace }}/ut_log/ \; || true

    - name: xpu_distributed
      shell: timeout 36000 bash -xeu -o pipefail {0}
      if: ${{ inputs.ut_name == 'xpu_distributed' }}
      run: |
        xpu-smi topology -m
        mkdir -p ut_log/xpu_distributed
        export PATH="${VENV_ROOT}/bin/libfabric:${PATH}"
        XCCL_ENABLE=$(python -c "import torch;print(torch.distributed.is_xccl_available())")
        if [[ "${XCCL_ENABLE,,}" == 'false' ]] || [[ "${XCCL_ENABLE}" == '0' ]]; then
          echo -e "[ERROR] XCCL is not enabled"
          exit 1
        fi
        cd pytorch/third_party/torch-xpu-ops/test/xpu
        python run_distributed.py \
          2> ${{ github.workspace }}/ut_log/xpu_distributed/xpu_distributed_test_error.log | \
          tee ${{ github.workspace }}/ut_log/xpu_distributed/xpu_distributed_test.log
        find ../ -type f -name "*.xml" -exec cp {} ${{ github.workspace }}/ut_log/ \;

    - name: xpu_p0
      shell: timeout 72000 bash -xe -o pipefail {0}
      if: ${{ inputs.ut_name == 'xpu_p0' }}
      env:
        PYTORCH_TEST_WITH_SLOW: 1
        LOG_BASE: ${{ github.workspace }}/ut_log/xpu_p0
        PYTORCH_ROOT_DIR: ${{ github.workspace }}/pytorch
        XML_OUTPUT_DIR: ${{ github.workspace }}/ut_log
        XML_PREFIX: xpu_p0_with_
      run: |
        mkdir -p "${LOG_BASE}"
        cd "${GITHUB_WORKSPACE}/pytorch/"
        bash "${GITHUB_WORKSPACE}/torch-xpu-ops/.ci/benchmarks/p0/run_ut.sh" inductor non-inductor profiling \
          2> "${LOG_BASE}/xpu_p0_with_skip_test_error.log" \
          | tee "${LOG_BASE}/xpu_p0_with_skip_test.log" || true
        find . -name "xpu_p0_with_*.xml" -exec cp {} "${GITHUB_WORKSPACE}/ut_log/" \; 2>/dev/null || true
        echo "Reproduce: cd $(pwd) && pytest -sv <failed_case>" \
          | tee "${GITHUB_WORKSPACE}/ut_log/reproduce_xpu_p0.log"

    - name: xpu_p0_distributed
      shell: timeout 72000 bash -xe -o pipefail {0}
      if: ${{ inputs.ut_name == 'xpu_p0_distributed' }}
      env:
        PYTORCH_TEST_WITH_SLOW: 1
        LOG_BASE: ${{ github.workspace }}/ut_log/xpu_p0_distributed
        PYTORCH_ROOT_DIR: ${{ github.workspace }}/pytorch
        XML_OUTPUT_DIR: ${{ github.workspace }}/ut_log
        XML_PREFIX: xpu_p0_with_
      run: |
        mkdir -p "${LOG_BASE}"
        cd "${GITHUB_WORKSPACE}/pytorch/"
        bash "${GITHUB_WORKSPACE}/torch-xpu-ops/.ci/benchmarks/p0/run_ut.sh" distributed \
          2> "${LOG_BASE}/xpu_p0_with_skip_test_error.log" \
          | tee "${LOG_BASE}/xpu_p0_with_skip_test.log" || true
        find . -name "xpu_p0_with_*.xml" -exec cp {} "${GITHUB_WORKSPACE}/ut_log/" \; 2>/dev/null || true
        echo "Reproduce: cd $(pwd) && pytest -sv <failed_case>" \
          | tee "${GITHUB_WORKSPACE}/ut_log/reproduce_xpu_p0.log"

    - name: upstream_ut
      shell: timeout 72000 bash -xe -o pipefail {0}
      if: ${{ contains(inputs.ut_name, 'upstream_') }}
      run: |
        export PYTORCH_TEST_WITH_SLOW=1
        export PYTORCH_TESTING_DEVICE_ONLY_FOR="xpu"
        ut_name="${{ inputs.ut_name }}"
        log_dir="${{ github.workspace }}/ut_log/${ut_name}"
        mkdir -p ${log_dir}
        # Format a number of seconds as "MmSSs" for the per-run elapsed lines
        fmt_elapsed() { printf '%dm%02ds' $(($1 / 60)) $(($1 % 60)); }
        case "${ut_name}" in
          upstream_distributed) category="distributed" ;;
          upstream_inductor) category="inductor" ;;
          *) category="default" ;;
        esac
        # Inductor cases same as PyTorch, sharded across the visible GPUs
        if [[ "${category}" == 'inductor' ]]; then
          IFS=',' read -ra gpus <<< "${ZE_AFFINITY_MASK:-0}"
          num_shards=${#gpus[@]}
          run_inductor_shards() {
            # $1 = part label, $2 = extra run_test.py flags, rest = --include args
            local part="$1"; local extra="$2"; shift 2
            local start=${SECONDS}
            echo "::group::inductor ${part} (${num_shards} shards)"
            for i in "${!gpus[@]}"; do
              local shard_id=$((i + 1))
              (
                ZE_AFFINITY_MASK="${gpus[$i]}" \
                PYTEST_ADDOPTS="" \
                python pytorch/test/run_test.py --verbose ${extra} \
                  --include "$@" \
                  --shard ${shard_id} ${num_shards} \
                  --junit-xml="${{ github.workspace }}/ut_log/upstream_inductor_${part}_shard${shard_id}.xml"
              ) &
            done
            wait
            echo "::endgroup::"
            echo "[TIME] inductor ${part} ($(fmt_elapsed $((SECONDS - start))))"
          }
          # Part 1: eager to inductor cases (with --inductor)
          run_inductor_shards part1 --inductor \
            test_modules test_ops test_ops_gradients test_torch |\
            2> "${log_dir}/${ut_name}_test_error1.log" |tee "${log_dir}/${ut_name}_test1.log"
          # Part 2: inductor own tests (no --inductor, avoids nested dynamo state)
          run_inductor_shards part2 "" \
            inductor/test_torchinductor inductor/test_torchinductor_opinfo \
            inductor/test_aot_inductor inductor/test_cpu_select_algorithm |\
            2> "${log_dir}/${ut_name}_test_error2.log" |tee "${log_dir}/${ut_name}_test2.log"
          exit 0
        fi
        # Distributed needs an etcd rendezvous and a multi-rank XCCL setup
        if [[ "${category}" == 'distributed' ]]; then
          sudo -E apt-get update && sudo -E apt-get install -y --no-install-recommends etcd-server
          uv pip install python-etcd
          xpu-smi topology -m
          export ZE_AFFINITY_MASK="0,1,2,3"
          export BACKEND="xccl"
          export WORLD_SIZE=4
          export USE_CCL_V2=1
          export PYTHONPATH="${PYTHONPATH:+${PYTHONPATH}:}${GITHUB_WORKSPACE}/pytorch/test/distributed/pipelining"
          export PATH="${VENV_ROOT}/bin/libfabric:${PATH}"
          XCCL_ENABLE=$(python -c "import torch;print(torch.distributed.is_xccl_available())")
          if [[ "${XCCL_ENABLE,,}" == 'false' ]] || [[ "${XCCL_ENABLE}" == '0' ]]; then
            echo -e "[ERROR] XCCL is not enabled"
            exit 1
          fi
        fi
        # Get the list of done test files for the current category
        files_list="${log_dir}/${ut_name}_files.txt"
        python ${GITHUB_WORKSPACE}/.github/scripts/get_upstream_test_files.py \
          --category ${category} --${category}-output ${files_list} > /dev/null
        # Run each file in its own collapsible group, tracking status + elapsed
        run_start=${SECONDS}
        total=0 passed=0 failed=0
        while IFS= read -r test_file; do
          [ -z "${test_file}" ] && continue
          total=$((total + 1))
          log_name="${test_file//\//_}"
          start=${SECONDS}
          echo "::group::${test_file}"
          if python -m pytest -v "pytorch/${test_file}" \
              --junit-xml="${{ github.workspace }}/ut_log/${ut_name}_${log_name}.xml" \
              2> ${log_dir}/${ut_name}_test_error_${log_name}.log | \
              tee ${log_dir}/${ut_name}_test_${log_name}.log; then
            status="PASS"; passed=$((passed + 1))
          else
            status="FAIL"; failed=$((failed + 1))
            echo "${test_file}" >> "${log_dir}/${ut_name}_test_error_${log_name}.log"
          fi
          echo "::endgroup::"
          echo "[${status}] ${test_file} ($(fmt_elapsed $((SECONDS - start))))"
        done < ${files_list}
        echo "[SUMMARY] ${ut_name}: ${total} files, ${passed} passed, ${failed} failed in $(fmt_elapsed $((SECONDS - run_start)))"

    # Summary
    - name: UT Test Results Summary
      if: ${{ !cancelled() && inputs.skip_summary != 'true' }}
      shell: timeout 180 bash -xe {0}
      run: |
        uv pip install junitparser
        python ./.github/scripts/check-ut.py -n ${{ inputs.ut_name }} -i ${{ github.workspace }}/ut_log/*.xml >> $GITHUB_STEP_SUMMARY || true
        # Check the failure logs
        if ls ${{ github.workspace }}/failures*.log 1> /dev/null 2>&1; then
          echo -e "Exist Failure logs"
          echo "Found Failure logs as below: "
          for file in ${{ github.workspace }}/failures*.log; do
            echo "  - $file"
            cp "$file" ${{ github.workspace }}/ut_log
          done
          echo -e "Failure logs Copied"
        else
          echo -e "No Failure logs"
        fi
        # Copied the passed logs
        if ls passed*.log 1> /dev/null 2>&1; then
          cp passed*.log ${{ github.workspace }}/ut_log
          echo -e "Passed logs Copied"
        else
          echo -e "No Passed logs"
        fi
        # Copied the full case universe (includes skipped cases), used by
        # ut_collect_evidence.py to classify a failure against its baseline.
        if ls all_cases_*.log 1> /dev/null 2>&1; then
          cp all_cases_*.log ${{ github.workspace }}/ut_log
          echo -e "All-cases logs Copied"
        else
          echo -e "No All-cases logs"
        fi
        # Copied the Summary logs
        if ls category*.log 1> /dev/null 2>&1; then
          cp category*.log ${{ github.workspace }}/ut_log
          echo -e "Category logs Copied"
        else
          echo -e "No Category logs"
        fi
        if [ -e ut_failure_list.csv ];then
            cp ut_failure_list.csv ${{ github.workspace }}/ut_log/ut_failure_list.csv || true
        fi
