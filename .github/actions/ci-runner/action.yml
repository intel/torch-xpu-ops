name: CI Runner
description: Select the Linux test runner labels and container image from .github/ci-config/defaults.yaml

inputs:
  runner:
    required: false
    default: ''
    description: Runner label override applied to every job type. Empty uses the `runner` entries of the config

outputs:
  ut:
    description: Runner for UT jobs
    value: ${{ steps.select.outputs.ut }}
  accuracy:
    description: Runner for E2E accuracy jobs
    value: ${{ steps.select.outputs.accuracy }}
  performance:
    description: Runner for E2E performance and microbench jobs
    value: ${{ steps.select.outputs.performance }}
  image:
    description: Container image for `runner` (or `ut` when empty), `image_bmg` for bmg runners and `image_pvc` otherwise
    value: ${{ steps.select.outputs.image }}
  options:
    description: Docker options to prepend to the container options
    value: ${{ steps.select.outputs.options }}

runs:
  using: composite
  steps:
    - name: Select runner and image
      id: select
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        OVERRIDE: ${{ inputs.runner }}
      with:
        script: |
          const { resolve } = require(`${process.env.ACTION_PATH}/../../ci-config/resolve.js`);
          const { runner, image } = resolve({ core: { setOutput() {}, exportVariable() {}, info() {} } });
          const override = process.env.OVERRIDE;
          for (const [key, value] of Object.entries(runner)) {
            core.setOutput(key.replace(/^runner_/, ''), override || value);
          }
          const label = override || runner.runner_ut;
          const bmg = label.includes('bmg');
          core.setOutput('image', bmg ? image.image_bmg : image.image_pvc);
          // the OMIX image entrypoint activates oneAPI
          core.setOutput('options', bmg ? '--entrypoint= ' : '');
          core.info(`override=${override} runner=${JSON.stringify(runner)} image=${bmg ? image.image_bmg : image.image_pvc}`);
