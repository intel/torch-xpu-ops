name: Setup Python
description: Setup uv python, clear the virtual environment, and export the virtual environment bin and lib to the global PATH and LD_LIBRARY_PATH

inputs:
  python:
    type: string
    default: ''
    description: Python version. Empty uses the `python` entry of .github/ci-config/defaults.yaml

runs:
  using: composite
  steps:
    - name: Resolve python version
      id: config
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        OVERRIDE_PYTHON: ${{ inputs.python }}
      with:
        script: |
          const { resolve } = require(`${process.env.ACTION_PATH}/../../ci-config/resolve.js`);
          resolve({ core, overrides: { python: process.env.OVERRIDE_PYTHON } });
    - name: Setup python-${{ steps.config.outputs.python }}
      shell: bash -xe {0}
      run: |
        if ! command -v uv >/dev/null 2>&1; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi
        export PATH="${HOME}/.local/bin:${PATH}"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        uv python install "${{ steps.config.outputs.python }}"
        VENV_DIR="${RUNNER_TEMP:-/tmp}/uv-venv"
        echo "VIRTUAL_ENV=${VENV_DIR}" >> "${GITHUB_ENV}"
        echo "UV_PROJECT_ENVIRONMENT=${VENV_DIR}" >> "${GITHUB_ENV}"
        echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"
    - name: Clear venv
      shell: bash -xe {0}
      run: |
        uv venv --clear --seed --python "${{ steps.config.outputs.python }}" "${VIRTUAL_ENV}"
        uv pip install -U pip wheel "setuptools<81"
    - name: Setup venv paths
      shell: bash -xe {0}
      run: |
        BIN_DIR="${VIRTUAL_ENV}/bin"
        VENV_ROOT="$(realpath "${VIRTUAL_ENV}")"
        PY_LIBDIR="$("${BIN_DIR}/python" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
        # ensure both python/python3 and pip/pip3 are available in the venv
        [ -e "${BIN_DIR}/python3" ] || ln -s python "${BIN_DIR}/python3"
        [ -e "${BIN_DIR}/python" ] || ln -s python3 "${BIN_DIR}/python"
        [ -e "${BIN_DIR}/pip3" ] || ln -s pip "${BIN_DIR}/pip3"
        [ -e "${BIN_DIR}/pip" ] || ln -s pip3 "${BIN_DIR}/pip"
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"
        echo "VENV_ROOT=${VENV_ROOT}" >> "${GITHUB_ENV}"
        NEW_LD="${VENV_ROOT}/lib${PY_LIBDIR:+:${PY_LIBDIR}}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        echo "LD_LIBRARY_PATH=${NEW_LD}" >> "${GITHUB_ENV}"
    - name: Check python and pip version
      shell: bash -xe {0}
      run: |
        which python && which python3 && which pip && which pip3
        python -V && python3 -V && pip -V && pip3 -V
        pip list
