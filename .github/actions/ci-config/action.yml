name: CI Config
description: Resolve the shared CI defaults from .github/ci-config/defaults.yaml (python, gcc, runner labels, container image), export PYTHON_VERSION and GCC_VERSION, and optionally install that gcc

inputs:
  python:
    default: ''
    description: Python version override. Empty resolves to the `python` entry of the config file
  config:
    default: ''
    description: Config file path. Defaults to $BASE_ENV, then .github/ci-config/defaults.yaml
  runner:
    default: ''
    description: Runner label override applied to every job type. Empty uses the `runner` entries of the config
  setup_gcc:
    default: 'false'
    description: Install the base packages with .ci/docker/common/install_base.sh and make the configured gcc the default (containers only)

outputs:
  python:
    description: Resolved python version
    value: ${{ steps.resolve.outputs.python }}
  gcc:
    description: Resolved gcc version
    value: ${{ steps.resolve.outputs.gcc }}
  json:
    description: Full resolved config as JSON, for use with fromJSON()
    value: ${{ steps.resolve.outputs.json }}
  ut:
    description: Runner for UT jobs
    value: ${{ steps.resolve.outputs.ut }}
  accuracy:
    description: Runner for E2E accuracy jobs
    value: ${{ steps.resolve.outputs.accuracy }}
  performance:
    description: Runner for E2E performance and microbench jobs
    value: ${{ steps.resolve.outputs.performance }}
  image:
    description: Container image for `runner` (or `ut` when empty), `image_bmg` for bmg runners and `image_pvc` otherwise
    value: ${{ steps.resolve.outputs.image }}
  options:
    description: Docker options to prepend to the container options
    value: ${{ steps.resolve.outputs.options }}

runs:
  using: composite
  steps:
    - name: Resolve CI defaults
      id: resolve
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_PATH: ${{ inputs.config }}
        OVERRIDE_PYTHON: ${{ inputs.python }}
        OVERRIDE_RUNNER: ${{ inputs.runner }}
      with:
        script: |
          const { resolve } = require(`${process.env.ACTION_PATH}/../../ci-config/resolve.js`);
          const { runner, image } = resolve({
            core,
            config: process.env.CONFIG_PATH,
            overrides: { python: process.env.OVERRIDE_PYTHON },
          });
          const override = process.env.OVERRIDE_RUNNER;
          for (const [key, value] of Object.entries(runner)) {
            core.setOutput(key.replace(/^runner_/, ''), override || value);
          }
          const bmg = (override || runner.runner_ut).includes('bmg');
          core.setOutput('image', bmg ? image.image_bmg : image.image_pvc);
          // the OMIX image entrypoint activates oneAPI
          core.setOutput('options', bmg ? '--entrypoint= ' : '');
    - name: Install gcc-${{ steps.resolve.outputs.gcc }}
      if: ${{ inputs.setup_gcc == 'true' }}
      shell: bash -xe {0}
      env:
        # keep the image's driver packages as shipped
        APT_UPGRADE: '0'
        INSTALL_BASE: ${{ github.action_path }}/../../../.ci/docker/common/install_base.sh
      run: |
        if [ ! -f /.dockerenv ]; then
          echo "Not in a container, keeping the host gcc"
          gcc -v
          exit 0
        fi
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo -E"
        ${SUDO} bash "${INSTALL_BASE}"
