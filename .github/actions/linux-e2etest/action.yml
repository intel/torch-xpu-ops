name: Linux E2E Test
description: Run Linux E2E benchmark suites with the merged benchmark runner.

inputs:
  suite:
    required: true
    default: 'huggingface'
    description: 'Dynamo benchmark suites. Comma-separated: huggingface,timm_models,torchbench'
  dt:
    required: true
    default: 'float32'
    description: 'Data precisions. Comma-separated: float32,bfloat16,float16,amp_bf16,amp_fp16'
  mode:
    required: true
    default: 'inference'
    description: 'Comma-separated execution modes: inference,training'
  scenario:
    required: true
    default: 'accuracy'
    description: 'Comma-separated scenarios: accuracy,performance'
  test_scope:
    required: false
    default: 'full'
    description: "Test scope: 'p0', 'p1', 'p2', or 'full' (runs p0, p1, p2 one by one). Comma-separated values allowed."

runs:
  using: composite
  steps:
    - name: Check Python
      shell: bash -xe {0}
      run: |
        which python && python -V
        uv pip list
    - name: E2E Test (${{ inputs.suite }} ${{ inputs.dt }} ${{ inputs.mode }} ${{ inputs.scenario }})
      shell: bash -xe {0}
      run: |
        set -o pipefail
        cd ./pytorch

        # Stage the merged benchmark runner inside the pytorch checkout so it
        # can see benchmarks/dynamo and run from the expected working tree.
        rsync -avz --delete ${GITHUB_WORKSPACE}/.github/scripts/run_benchmarks/ ./run_e2e/
        rsync -avz ${GITHUB_WORKSPACE}/.ci/benchmarks/ ./benchmarks/dynamo/

        task_files=""
        for tier in $(echo "${{ inputs.test_scope }}" | tr ',' ' '); do
          case "${tier}" in
            p0|p1|p2) task_files="${task_files:+$task_files,}./benchmarks/dynamo/${tier}/config.yaml" ;;
            full) task_files="${task_files:+$task_files,}./benchmarks/dynamo/p0/config.yaml,./benchmarks/dynamo/p1/config.yaml,./benchmarks/dynamo/p2/config.yaml" ;;
            *) echo "ERROR: unknown test_scope '${tier}'" >&2; exit 1 ;;
          esac
        done
        model_list_args=(--task-file "${task_files}")
        if [ -n "${MODEL_ONLY_NAME:-}" ]; then
          model_list_args+=(--model-only "${MODEL_ONLY_NAME}")
        fi

        rm -rf torch && mkdir -p inductor_log
        python -m run_e2e \
            --suite "${{ inputs.suite }}" \
            --dtype "${{ inputs.dt }}" \
            --mode "${{ inputs.mode }}" \
            --scenario "${{ inputs.scenario }}" \
            "${model_list_args[@]}" \
            2>&1 | tee inductor_log/run_e2e.log || true
