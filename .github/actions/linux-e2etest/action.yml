name: Linux E2E Test
description: Run Linux E2E benchmark suites with the merged benchmark runner.

inputs:
  suite:
    required: true
    default: 'huggingface'
    description: 'Dynamo benchmark suites. Comma-separated: huggingface,timm_models,torchbench'
  dt:
    required: false
    default: ''
    description: 'Data precisions filter. Comma-separated: float32,bfloat16,float16,amp_bf16,amp_fp16. Empty uses the tier config'
  mode:
    required: false
    default: ''
    description: 'Execution modes filter. Comma-separated: inference,training. Empty uses the tier config'
  scenario:
    required: true
    default: 'accuracy'
    description: accuracy,performance. Delimiter is comma
  overwrite_model_list:
    type: string
    default: 'true'
    description: "Model-list overlay: 'true' full .ci/benchmarks/ overlay (no -k filter), 'false' use pytorch default lists, 'p0' use the .ci/benchmarks/p0/ subset"

runs:
  using: composite
  steps:
    - name: Check Python
      shell: bash -xe {0}
      run: |
        which python && python -V
        uv pip list
    - name: E2E Test (${{ inputs.suite }} ${{ inputs.dt }} ${{ inputs.mode }} ${{ inputs.scenario }})
      shell: bash -xe {0}
      run: |
        set -o pipefail
        cd ./pytorch
        if [ "${{ inputs.overwrite_model_list }}" == "true" ];then
          # overlay torch-xpu-ops model lists for nightly / PR tests
          cp -av ../.ci/benchmarks/. benchmarks/dynamo/
        elif [ "${{ inputs.overwrite_model_list }}" == "p0" ];then
          # use upstream configs, only overlay the P0 model-list subset
          cp -av ../.ci/benchmarks/p0/. benchmarks/dynamo/
        fi
        rm -rf inductor_log torch
        sed -i 's/choices=range(1, 16),/choices=range(1, 17),/g' benchmarks/dynamo/common.py
        # check param
        contains() {
          local pattern="$1"
          local value="$2"
          if [[ "$pattern" =~ (^|,)"$value"($|,) ]]; then
            echo "Start $value ..."
            return 0  # match
          else
            echo "[Warning] $value is not supported type! Skipped!"
            return 1  # not match
          fi
        }
        run_with_shard() {
          # set models to run
          if [ ! -z "${MODEL_ONLY_NAME:-}" ]; then
            models_list_args=" -k ${MODEL_ONLY_NAME} "
          elif [ "${{ inputs.overwrite_model_list }}" != "true" ];then
            # 'false' -> pytorch default lists; 'p0' -> overlaid P0 subset
            models_list_args="$(awk -F ',|;| ' '{printf(" -k %s ", $1)}' benchmarks/dynamo/$(echo ${suite} |sed 's/_models//')_models_list.txt)"
          else
            models_list_args=""
          fi
          # shards to run
          # Such as NUMACTL_ARGS=' ZE_AFFINITY_MASK=0 OMP_NUM_THREADS=12 numactl -l -C 0-11 ; ZE_AFFINITY_MASK=1 OMP_NUM_THREADS=12 numactl -l -C 12-23 ;'
          delimiter=";"
          IFS="${delimiter}" read -ra numactl_args_list <<< "${NUMACTL_ARGS}"
          instances=${#numactl_args_list[@]}
          for i in $(seq 0 $[ ${instances} - 1 ])
          do
            xpu_id="$(echo ${numactl_args_list[$i]} |sed 's/.*ZE_AFFINITY_MASK=//;s/ .*//')"
            eval ${numactl_args_list[$i]} bash -x inductor_xpu_test.sh \
                    ${suite} ${dt} ${mode} ${scenario} \
                    xpu ${xpu_id} static ${instances} ${i} \
                    \"${models_list_args}\" \
                    &
          done
          wait
        }
        for suite in $(echo ${{ inputs.suite }} |sed 's/,/ /g')
        do
          if ! contains "huggingface,timm_models,torchbench" "$suite"; then
            continue
          fi
          for dt in $(echo ${{ inputs.dt }} |sed 's/,/ /g')
          do
            if ! contains "float32,bfloat16,float16,amp_bf16,amp_fp16" "$dt"; then
              continue
            fi
            for mode in $(echo ${{ inputs.mode }} |sed 's/,/ /g')
            do
              if ! contains "inference,training" "$mode"; then
                continue
              fi
              for scenario in $(echo ${{ inputs.scenario }} |sed 's/,/ /g')
              do
                if ! contains "accuracy,performance" "$scenario"; then
                  continue
                fi
                run_with_shard
                # summarize pass rate
                LOG_DIR="inductor_log/${suite}/${dt}"
                LOG_NAME=inductor_${suite}_${dt}_${mode}_xpu_${scenario}_all.log
                rm -f ${LOG_DIR}/${LOG_NAME}
                find ${LOG_DIR}/ -name "inductor_${suite}_${dt}_${mode}_xpu_${scenario}_card*.log" |xargs cat >> ${LOG_DIR}/${LOG_NAME} 2>&1
              done
            done
          done
        done

        # Stage the merged benchmark runner inside the pytorch checkout so it
        # can see benchmarks/dynamo and run from the expected working tree.
        rsync -avz --delete ${GITHUB_WORKSPACE}/.github/scripts/run_benchmarks/ ./run_e2e/
        rsync -avz ${GITHUB_WORKSPACE}/.ci/benchmarks/ ./benchmarks/dynamo/

        task_files=""
        for tier in $(echo "${{ inputs.test_scope }}" | tr ',' ' '); do
          case "${tier}" in
            p0|p1|p2) task_files="${task_files:+$task_files,}./benchmarks/dynamo/${tier}/config.yaml" ;;
            full) task_files="${task_files:+$task_files,}./benchmarks/dynamo/p0/config.yaml,./benchmarks/dynamo/p1/config.yaml,./benchmarks/dynamo/p2/config.yaml" ;;
            *) echo "ERROR: unknown test_scope '${tier}'" >&2; exit 1 ;;
          esac
        done
        model_list_args=(--task-file "${task_files}")
        if [ -n "${MODEL_ONLY_NAME:-}" ]; then
          model_list_args+=(--model-only "${MODEL_ONLY_NAME}")
        fi

        rm -rf torch && mkdir -p inductor_log
        python -m run_e2e \
            --suite "${{ inputs.suite }}" \
            --dtype "${{ inputs.dt }}" \
            --mode "${{ inputs.mode }}" \
            --scenario "${{ inputs.scenario }}" \
            "${model_list_args[@]}" \
            2>&1 | tee inductor_log/run_e2e.log || true
