name: Setup Test Environment

inputs:
  pytorch:
    type: string
    default: 'main'
    description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
  torch_xpu_ops:
    type: string
    default: 'main'
    description: Torch-xpu-ops version, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
  python:
    type: string
    default: '3.10'
    description: Python version
  suite:
    type: string
    default: 'None'
    description: Dynamo benchmarks test suite. `huggingface,timm_models,torchbench,pt2e`. Delimiter is comma
  category:
    type: string
    default: ''
    description: 'Optional tag (e.g. target/baseline) used to select the matching wheel artifact'

runs:
  using: composite
  steps:
    - name: Check runner
      shell: bash -xe {0}
      run: |
        hostname && id
        cat /etc/os-release
        gcc -v && g++ -v
        uname -a
        dpkg -l |grep -E 'libigc-dev|libze-dev|level-zero-dev|intel-opencl-icd'
        rm -rf ~/.triton /tmp/*inductor* /tmp/tmp*
        if [ ! -z ${AGENT_TOOLSDIRECTORY} ];then
          rm -rf ${AGENT_TOOLSDIRECTORY}
        fi
        rm -rf Torch-XPU-Wheel-*
    - name: Install DLE
      shell: bash -xe {0}
      run: |
        rm -rf /opt/intel/oneapi intel-deep-learning-essentials-2026.2.0.466_offline.sh linux_qa_release.tgz
        cp /home/jenkins/mengfeil/intel-deep-learning-essentials-2026.2.0.466_offline.sh .
        bash intel-deep-learning-essentials-2026.2.0.466_offline.sh -a -s --eula accept --install-dir /opt/intel/oneapi --action remove || true
        bash intel-deep-learning-essentials-2026.2.0.466_offline.sh -a -s --eula accept --install-dir /opt/intel/oneapi --action install
        bash intel-deep-learning-essentials-2026.2.0.466_offline.sh -a -s --eula accept --install-dir /opt/intel/oneapi --action repair
        cp /home/jenkins/mengfeil/linux_qa_release.tgz .
        rm -rf /opt/intel/oneapi/compiler/20260903_160000 && mkdir -p /opt/intel/oneapi/compiler/20260903_160000
        tar -xzf linux_qa_release.tgz -C /opt/intel/oneapi/compiler/20260903_160000
        rm -rf /opt/intel/oneapi/compiler/latest /opt/intel/oneapi/compiler/2026.2
        ln -sf /opt/intel/oneapi/compiler/20260903_160000 /opt/intel/oneapi/compiler/latest
        ln -sf /opt/intel/oneapi/compiler/20260903_160000 /opt/intel/oneapi/compiler/2026.2
        echo "XPU_ONEAPI_PATH=/opt/intel/oneapi" >> ${GITHUB_ENV}
        echo "source /opt/intel/oneapi/setvars.sh > /dev/null 2>&1" > ${RUNNER_TEMP}/oneapi_env.sh
        echo "BASH_ENV=${RUNNER_TEMP}/oneapi_env.sh" >> ${GITHUB_ENV}
    - name: Setup python-${{ inputs.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python }}
    - name: Check python
      shell: bash -xe {0}
      run: |
        which python && python -V
        which pip && pip list
        pip install -U pip wheel setuptools
    - name: Checkout torch-xpu-ops
      uses: actions/checkout@v4
      with:
        path: torch-xpu-ops
    - name: Download dpclang
      if: ${{ inputs.category == 'dpclang' }}
      uses: actions/download-artifact@v8
      with:
        name: dpclang
    # NOTE: placement of this step is important as some environment variables it sets
    # might be overriden or reset by certain actions. For example, PKG_CONFIG_PATH is
    # overriden by actions/setup-python.
    - name: Setup dpclang
      if: ${{ inputs.category == 'dpclang' }}
      shell: bash -xe {0}
      run: |
        rm -rf install-dpclang && mkdir install-dpclang
        tar xzvf install-dpclang.tgz -C install-dpclang
        echo "CMAKE_PREFIX_PATH=$(pwd)/install-dpclang" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=$(pwd)/install-dpclang/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$(pwd)/install-dpclang/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PATH=$(pwd)/install-dpclang/bin:$PATH" >> $GITHUB_ENV
        echo "$(pwd)/install-dpclang/bin" >> $GITHUB_PATH
    - name: Download Pytorch wheel
      uses: actions/download-artifact@v4
      with:
        name: Torch-XPU-Wheel-8cd50b4bc9722a87c60363e4c3434e1e6281eb64-34023316096-1
        github-token: ${{ github.token }}
        repository: mengfei25/torch-xpu-ops
        run-id: 34023316096
        path: ${{ github.workspace }}/wheels
    - name: Download Pytorch wheel
      if: ${{ ! endsWith(inputs.pytorch, '_wheel') }}
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.category != '' && format('Torch-XPU-Wheel-*-{0}', inputs.category) || 'Torch-XPU-Wheel-*' }}
    - name: Prepare Stock Pytorch
      shell: bash -xe {0}
      run: |
        which icpx
        icpx --version
        # install pytorch
        latest_whl="$(find ./wheels -type f -name "torch-*.whl" |sort -V |tail -n 1)"
        pip install --force-reinstall ${latest_whl}
        pip install triton-xpu --pre --index-url https://download.pytorch.org/whl/nightly/xpu
        TORCH_COMMIT_ID=$(python -c 'import torch; print(torch.version.git_version)')
        if [[ "${{ inputs.pytorch }}" == *"https://"* ]];then
          PYTORCH_REPO="$(echo ${{ inputs.pytorch }} |sed 's/@.*//')"
        else
          PYTORCH_REPO="https://github.com/pytorch/pytorch.git"
        fi
        git clone ${PYTORCH_REPO} pytorch
        cd pytorch
        git checkout 5b60cffe35
        # apply extra PRs for stock pytorch
        pip install requests
        python ../torch-xpu-ops/.github/scripts/apply_torch_pr.py
        git status && git diff && git show -s
        echo "TORCH_COMMIT_ID=${TORCH_COMMIT_ID}" >> ${GITHUB_ENV}
    - name: Install test target
      shell: bash -xe {0}
      run: |
        VISION_COMMIT_ID="$(cat pytorch/.github/ci_commit_pins/vision.txt)"
        AUDIO_COMMIT_ID="$(cat pytorch/.github/ci_commit_pins/audio.txt)"
        rm -rf torchvision torchaudio

        git clone --recursive https://github.com/pytorch/vision torchvision
        cd torchvision
        git checkout ${VISION_COMMIT_ID}
        git submodule update --init --recursive
        python setup.py clean
        python -m pip install -v --no-build-isolation --no-deps .
        cd ..

        git clone --recursive https://github.com/pytorch/audio torchaudio
        cd torchaudio
        git checkout ${AUDIO_COMMIT_ID}
        git submodule update --init --recursive
        python setup.py clean
        python -m pip install -v --no-build-isolation --no-deps .
        cd ..

        python -c "import torch; print(torch.__version__, torch.version.git_version)"
        python -c "import torchvision; print(torchvision.__version__)"
        python -c "import torchaudio; print(torchaudio.__version__)"
        pip list |grep -E 'intel|torch|triton'

    - name: Prepare Torch-xpu-ops
      shell: bash -xe {0}
      run: |
        cd pytorch
        cp /home/jenkins/mengfeil/tmp-file ~/.netrc
        rm -rf third_party/torch-xpu-ops
        git clone https://github.com/intel-innersource/frameworks.ai.pytorch.torch-xpu-ops third_party/torch-xpu-ops
        cd third_party/torch-xpu-ops
        git checkout e12bf65e4eb0445bedf965ee84e0ce75d43b2a00
        git status && git diff && git show -s
    - name: Install E2E Requirements
      shell: bash -xe {0}
      run: |
        # common
        pip install pandas psutil scipy pyyaml
        cd pytorch
        if [[ "${{ inputs.suite }}" == *"huggingface"* ]];then
          # for new LLM models
          pip install accelerate
          pip install -r .ci/docker/ci_commit_pins/huggingface-requirements.txt || pip install transformers==4.54.0 soxr==0.5.0
          TRANSFORMERS_VERSION_ID="$(python -c 'import os; os.chdir("/tmp"); import transformers; print(transformers.__version__)')"
        elif [[ "${{ inputs.suite }}" == *"timm_models"* ]];then
          TIMM_COMMIT_ID="$(cat .ci/docker/ci_commit_pins/timm.txt 2> /dev/null || echo 'v1.0.14')"
          pip install git+https://github.com/huggingface/pytorch-image-models@${TIMM_COMMIT_ID}
        elif [[ "${{ inputs.suite }}" == *"torchbench"* ]];then
          TORCHBENCH_COMMIT_ID="$(cat .ci/docker/ci_commit_pins/torchbench.txt 2> /dev/null || echo 'e03a63be')"
          cd ../
          rm -rf ./benchmark
          git clone https://github.com/pytorch/benchmark benchmark
          cd benchmark
          git checkout ${TORCHBENCH_COMMIT_ID}
          sed -i 's/^ *pynvml.*//' requirements.txt
          # Work around legacy deps (e.g. visdom) that still import
          # pkg_resources during build on newer Python toolchains.
          CONSTRAINT_FILE=/tmp/pip-constraints.txt
          echo 'setuptools<81' > ${CONSTRAINT_FILE}
          export PIP_CONSTRAINT=${CONSTRAINT_FILE}
          export PIP_NO_BUILD_ISOLATION=1
          pip install -U "pip" "setuptools<81" "wheel"
          # Follow with standard installation path
          pip install -r requirements.txt
          if [ "${{ github.event_name }}" == "pull_request" ];then
            while read line; do
              python install.py $(echo $line |awk -F, '{printf $1}')
            done < ../pytorch/benchmarks/dynamo/torchbench_models_list.txt
          else
            python install.py --continue_on_fail
          fi
          echo "PYTHONPATH=${PWD}:${PYTHONPATH}" >> ${GITHUB_ENV}
          # for dlrm
          pip install pyre-extensions
          curl -fsSL https://raw.githubusercontent.com/facebookresearch/dlrm/refs/heads/torchrec-dlrm/requirements.txt |xargs pip install
          pip uninstall -y fbgemm_gpu_nightly-cpu
          # for soft_actor_critic, temp fix
          pip install git+https://github.com/nocoding03/gym@fix-np
          cd ../pytorch
        elif [[ "${{ inputs.suite }}" == *"pt2e"* ]];then
          cd ../
          rm -rf ./pt2e-performance ./pt2e-accuracy
          git clone -b main https://github.com/chuanqi129/inductor-tools pt2e-accuracy
          git clone -b yifeng/pt2e_xpu https://github.com/zxd1997066/benchmark pt2e-performance
          cd pt2e-performance
          TORCHBENCH_COMMIT_ID="$(git rev-parse --short  HEAD)"
          sed -i 's/^ *pynvml.*//' requirements.txt
          pip install -r requirements.txt
          # python install.py --continue_on_fail
          echo "PYTHONPATH=${PWD}:${PYTHONPATH}" >> ${GITHUB_ENV}
          pip install dominate
          python install.py Super_SloMo
          # for dlrm
          pip install pyre-extensions
          curl -fsSL https://raw.githubusercontent.com/facebookresearch/dlrm/refs/heads/torchrec-dlrm/requirements.txt |xargs pip install
          pip uninstall -y fbgemm_gpu_nightly-cpu
          cd ../pytorch
        else
          # Remove mkl hardcode installation to avoid potential conflicts with torch xpu wheel 
          sed -i '/mkl/d' .ci/docker/requirements-ci.txt
          pip install -r .ci/docker/requirements-ci.txt
          pip install pytest pytest-timeout pytest-xdist pytest-rerunfailures
        fi
        # install the corresponding torchao
        pip uninstall -y torchao
        if [ $(echo "${{ inputs.pytorch }}" |grep -w "release_wheel" -c) -ne 0 ];then
          pip install torchao --pre --index-url https://download.pytorch.org/whl/xpu
        elif [ $(echo "${{ inputs.pytorch }}" |grep -w "test_wheel" -c) -ne 0 ];then
          pip install torchao --pre --index-url https://download.pytorch.org/whl/test/xpu
        else
          pip install torchao --pre --index-url https://download.pytorch.org/whl/nightly/xpu
        fi
        if [ "${{ inputs.suite }}" != "None" ];then
          # To install numpy 1.x for benchmarks as CUDA
          # yolov requires numpy>=1.23
          pip install -U numpy==1.26.4
        fi
    - name: Update numpy
      shell: bash -xe {0}
      run: |
        # TODO: Remove this step once Python 3.10 is no longer supported.
        if [[ "${{ inputs.python }}" == "3.10" ]]; then
          CURRENT_NUMPY=$(python -c "import numpy as np; print(np.__version__)")
          if [[ "${CURRENT_NUMPY}" == 1.23.* ]]; then
            echo "Detected numpy ${CURRENT_NUMPY}; upgrading to 1.24.4"
            pip install -U "numpy==1.24.4"
            python -c "import numpy as np; print(f'numpy version after conditional upgrade: {np.__version__}')"
          else
            echo "numpy is ${CURRENT_NUMPY}; skipping upgrade because version is not 1.23.*"
          fi
        else
          echo "Skipping Update numpy because python is not 3.10 (python=${{ inputs.python }})"
        fi
    - name: Detect devices
      shell: bash -euo pipefail {0}
      run: ${{ github.workspace }}/.github/scripts/detect-devices.sh --pytest-others-args '-v -rfEsxw '
    - name: Torch Config
      shell: bash -xe {0}
      run: |
        printenv
        python -c "import torch; print(torch.__config__.show())"
        python -c "import torch; print(torch.__config__.parallel_info())"
        python -c "import torch; print(torch.__config__.torch.xpu.device_count())"
        python -c "import torchvision; print(torchvision.__version__)"
        python -c "import torchaudio; print(torchaudio.__version__)"
        python -c "import triton; print(triton.__version__)"
        python pytorch/torch/utils/collect_env.py
        pip list |grep -E 'torch|intel'
        TORCH_CHECK_ID=$(python -c 'import torch; print(torch.version.git_version)')
        if [ "${TORCH_CHECK_ID}" != "${TORCH_COMMIT_ID}" ];then
          echo "Torch is re-installed when installing deps, please check"
          exit 1
        fi
