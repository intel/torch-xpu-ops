name: Windows Unit Test
description: Run one Windows UT scope; junit reports land in ut_log/junit

inputs:
  ut_name:
    required: true
    description: Which ut to launch, one of op_extended, test_xpu, test_cpp_extensions_aot_xpu, op_ut

runs:
  using: composite
  steps:
    - name: Run XPU OP Extended UT
      if: ${{ inputs.ut_name == 'op_extended' }}
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\ProgramData\miniforge3\Scripts\activate.bat"
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        call conda activate windows_ut
        set PYTORCH_TEST_WITH_SLOW=1
        cd ../pytorch/third_party/torch-xpu-ops/test/xpu/extended/
        python run_test_with_skip_mtl.py

        if not exist "%GITHUB_WORKSPACE%\ut_log\junit" mkdir "%GITHUB_WORKSPACE%\ut_log\junit"
        copy op_extended.xml %GITHUB_WORKSPACE%\ut_log\junit /Y
    - name: Run CPP Extensions AOT SYCL UT
      if: ${{ inputs.ut_name == 'test_cpp_extensions_aot_xpu' }}
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\ProgramData\miniforge3\Scripts\activate.bat"
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        call "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\env\vars.bat"
        call "C:\Program Files (x86)\Intel\oneAPI\ocloc\latest\env\vars.bat"
        call "C:\Program Files (x86)\Intel\oneAPI\pti\latest\env\vars.bat"
        call conda activate windows_ut
        cd ../pytorch/third_party/torch-xpu-ops/test/xpu/
        python -m pytest test_cpp_extensions_aot_xpu.py -v --junit-xml=test_cpp_extensions_aot_xpu.xml

        if not exist "%GITHUB_WORKSPACE%\ut_log\junit" mkdir "%GITHUB_WORKSPACE%\ut_log\junit"
        copy test_cpp_extensions_aot_xpu.xml %GITHUB_WORKSPACE%\ut_log\junit /Y
    - name: Run Test XPU UT
      if: ${{ inputs.ut_name == 'test_xpu' }}
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\ProgramData\miniforge3\Scripts\activate.bat"
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        call conda activate windows_ut
        cd ../pytorch/third_party/torch-xpu-ops/test/xpu/
        python run_test_win_with_skip_mtl.py

        if not exist "%GITHUB_WORKSPACE%\ut_log\junit" mkdir "%GITHUB_WORKSPACE%\ut_log\junit"
        copy test_xpu.xml %GITHUB_WORKSPACE%\ut_log\junit /Y
    - name: Run OP UT
      if: ${{ inputs.ut_name == 'op_ut' }}
      shell: cmd
      continue-on-error: true
      run: |
        call "C:\ProgramData\miniforge3\Scripts\activate.bat"
        call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        call conda activate windows_ut
        set PYTORCH_TEST_WITH_SLOW=1
        set PYTEST_ADDOPTS=-v --timeout 600 --timeout_method=thread --max-worker-restart 1000000 -n 1 --only-rerun crashed.*while.*running --reruns 2
        cd ../pytorch/third_party/torch-xpu-ops/test/xpu/
        python run_test_with_windows_nightly.py
        if not exist "%GITHUB_WORKSPACE%\ut_log\junit" mkdir "%GITHUB_WORKSPACE%\ut_log\junit"
        for /r . %%f in (test*.xml op_ut_with_*.xml) do move "%%f" "%GITHUB_WORKSPACE%\ut_log\junit\" >nul 2>&1 || echo "File move completed"
