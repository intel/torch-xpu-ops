name: 🐛 Dynamic skip
description: Create an issue to skip PR unrelated failures dynamically
title: "[Bug Skip]: "
labels: ["skipped"]

# This form defines the shape of a skip issue for both a human and the nightly
# bot: ut_create_issues.py renders the same `label:` headings, in this order,
# and reads the `labels:` above rather than hardcoding them. The labels that
# depend on the run - skipped_bmg, regression, new_case_failure - cannot come
# from here, because a form cannot set a label from what a field contains.
#
# The `Cases:` block is parsed by fetch_issues.sh, by the awk filter in
# _linux_ut.yml and by mark_passed_issue in ut_result_check.sh. Between them
# the contract is: a line starting with `Cases:`, one case per line with no
# blank lines inside, and a blank line to end it. Nothing else in a body may
# contain the string `Cases:`, or the awk filter starts collecting again there.

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting a bug, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/pytorch/pytorch/issues?q=is%3Aissue+sort%3Acreated-desc+).
- type: textarea
  attributes:
    label: 🐛 Describe the bug with skip template
    description: |
      Please provide a clear and concise description of what the bug is.
      The template for dynamic skip as below:
      
      ```python
      # Template(Check in the github action summary)
      Cases:
      [Category],[Class name],[Test name]
      ```

      ```python
      # example
      Cases:
      op_ut,third_party.torch-xpu-ops.test.xpu.test_transformers_xpu.TestTransformersXPU,test_scaled
      ```

      If the code is too long (hopefully, it isn't), feel free to put it in a public gist and link it in the issue: https://gist.github.com.

      Please also paste or describe the results you observe instead of the expected results. If you observe an error, please paste the error message including the **full** traceback of the exception. It may be relevant to wrap error messages in ```` ```triple quotes blocks``` ````.
    placeholder: |
      A clear and concise description of what the bug is and also align the dynamic template.
      ```
      # Skippped cases with dynamic template
      ```

      ```python
      # Sample code to reproduce the problem
      ```

      ```
      The error message you got, with the full traceback.
      ```
  validations:
    required: true
- type: textarea
  attributes:
    label: Summary
    description: One to three sentences on what is failing and why these cases are one bug.
  validations:
    required: false
- type: textarea
  attributes:
    label: ErrorLog
    description: The failure message, and the traceback if you have it.
  validations:
    required: false
- type: textarea
  attributes:
    label: Reproduce
    description: The directory to run from and the pytest invocation.
  validations:
    required: false
- type: textarea
  attributes:
    label: Pytorch Version
    description: |
      Where the failure started, if you know: the last run that passed these
      cases and the first that did not, with their torch and torch-xpu-ops
      commits.
  validations:
    required: false
- type: textarea
  attributes:
    label: Versions
    description: |
      Please run the following and paste the output below.
      ```sh
      wget https://raw.githubusercontent.com/pytorch/pytorch/main/torch/utils/collect_env.py
      # For security purposes, please check the contents of collect_env.py before running it.
      python collect_env.py
      ```
  validations:
    required: true
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
