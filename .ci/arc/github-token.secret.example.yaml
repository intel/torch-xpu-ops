apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: arc-runners
type: Opaque
stringData:
  github_token: REPLACE_WITH_TOKEN_AT_APPLY_TIME
  # Or use a GitHub App, which does not expire, instead of github_token:
  # github_app_id: "123456"
  # github_app_installation_id: "654321"
  # github_app_private_key: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   ...
  #   -----END RSA PRIVATE KEY-----
