# Models excluded from specific test cases for priority p0.
#
# config.yaml in this folder contains the full model set for this priority.
# A model listed under a given suite/scenario/mode here is skipped at launch
# for that run configuration (in addition to suite-level skips in <suite>.yaml).
skip:
  huggingface:
    accuracy:
      inference:
        # OOM on 24 GB VRAM (BMG B60)
        - google/gemma-2-2b
      training:
        # OOM on 24 GB VRAM (BMG B60); large model skipped in huggingface.yaml
        - BlenderbotForCausalLM
        # Inference-only model in huggingface.yaml (only_inference)
        - M2M100ForConditionalGeneration
    performance:
      inference: []
      training:
        # Inference-only model in huggingface.yaml (only_inference)
        - M2M100ForConditionalGeneration
  timm:
    accuracy:
      inference: []
      training: []
    performance:
      inference: []
      training: []
  torchbench:
    accuracy:
      inference:
        # Generate-only model, not run in accuracy
        - cm3leon_generate
        # OOM on 24 GB VRAM (BMG B60); large model skipped in torchbench.yaml
        - llama_v2_7b_16h
      training:
        # Excluded from training in torchbench.yaml (skip.test.training)
        - cm3leon_generate
        - detectron2_fcos_r_50_fpn
        - llama_v2_7b_16h
        - moondream
    performance:
      inference:
        # OOM on 24 GB VRAM (BMG B60)
        - llama_v2_7b_16h
      training:
        # Excluded from training in torchbench.yaml (skip.test.training)
        - cm3leon_generate
        - detectron2_fcos_r_50_fpn
        - llama_v2_7b_16h
        - moondream
