# Models excluded from specific test cases for priority p1.
#
# torchbench_models_list.txt, huggingface_models_list.txt and
# timm_models_list.txt in this folder contain the full model set for this
# priority. A model listed under a given suite/scenario/mode here is skipped for
# that run configuration.
#
# p1 currently runs the same model set across all scenarios and modes, so no
# skips are defined.
skip:
  huggingface:
    accuracy:
      inference: []
      training: []
    performance:
      inference: []
      training: []
  timm:
    accuracy:
      inference: []
      training: []
    performance:
      inference: []
      training: []
  torchbench:
    accuracy:
      inference: []
      training: []
    performance:
      inference: []
      training: []

# Models excluded on Linux for priority p1 (in addition to <suite>.yaml skips).
linux:
  huggingface:
    accuracy:
      inference:
        # OOM on 24 GB VRAM (BMG B60)
        - google/gemma-2-2b
      training:
        # OOM on 24 GB VRAM (BMG B60); large model skipped in huggingface.yaml
        - BlenderbotForCausalLM
    performance:
      inference: []
      training: []
  timm:
    accuracy:
      inference: []
      training: []
    performance:
      inference: []
      training: []
  torchbench:
    accuracy:
      inference:
        # OOM on 24 GB VRAM (BMG B60); large model skipped in torchbench.yaml
        - llama_v2_7b_16h
      training: []
    performance:
      inference:
        # OOM on 24 GB VRAM (BMG B60)
        - llama_v2_7b_16h
      training: []
