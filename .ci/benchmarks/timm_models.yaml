# removing this file prevents the TimmRunner from dynamically skipping models
skip:
  all:
    - ~
  device:
    cpu:
      - ~
    # Skip these additional models when running on aarch64
    cpu_aarch64:
      # timeout on aarch64
      - dm_nfnet_f0
      - nfnet_l0
      - visformer_small


# TODO - Figure out the reason of cold start memory spike
batch_size:
  # Use lower CUDA Inductor CI accuracy batch sizes where fp64 golden refs OOM
  # at the default TIMM accuracy batch size.
  ci_accuracy:
    vit_base_patch14_dinov2.lvd142m: 4
  divisors:
    beit_base_patch16_224: 2
    deit_base_distilled_patch16_224: 2
    gluon_xception65: 2
    mobilevit_s: 2
    swin_base_patch4_window7_224: 2


tolerance:
  higher_training:
    - inception_v3
    - mobilenetv3_large_100

  higher_fp16_xpu:
    - botnet26t_256

  higher_amp:
    - poolformer_m36

  even_higher:
    - deit_base_distilled_patch16_224
    - vit_base_patch16_siglip_256
    - levit_128
    - sebotnet33ts_256
    - cspdarknet53

  # These models need higher tolerance in MaxAutotune mode
  even_higher_max_autotune:
    - gluon_inception_v3

  # beit_base_patch16_224 needs 16 * 1e-2 tolerance in training
  highest_training:
    - beit_base_patch16_224

  freezing:
    # the conv-batchnorm fusion used under freezing may cause relatively
    # large numerical difference. We need a larger tolerance.
    # Check https://github.com/pytorch/pytorch/issues/120545 for context
    - adv_inception_v3
    - botnet26t_256
    - gluon_inception_v3
    - selecsls42b
    - swsl_resnext101_32x16d

  cosine: []


scaled_compute_loss:
  - mobilevit_s
  - ese_vovnet19b_dw
  - fbnetc_100
  - mnasnet_100
  - sebotnet33ts_256


require_larger_multiplier_for_smaller_tensor:
  - inception_v3
  - mobilenetv3_large_100
  - vit_base_patch14_dinov2.lvd142m
  - cspdarknet53
  - gluon_inception_v3
  - cait_m36_384


# Models that need torch._inductor.config.emulate_precision_casts=True to match
# eager autocast rounding semantics (bf16 and fp16; e.g. mobilenetv2_100
# fails only under fp16). Without this, inductor
# pointwise fusion can elide a low-precision round-trip that eager performs
# (e.g. conv-bias-add fused across a bf16->fp32 cat boundary), producing a
# ~1 ULP forward divergence that amplifies through gradients in models with
# very small natural gradient magnitudes (e.g. vit LayerScale init=1e-5; the
# fp16 mobilenetv2_100 case is BatchNorm-gradient driven, its near-zero BN
# weight/bias grads).
emulate_precision_casts:
  - vit_base_patch14_dinov2.lvd142m
  - levit_128
  - mobilenetv2_100


dtype:
  force_amp_for_fp16_bf16_models:
    - convit_base
    - xcit_large_24_p8_224


accuracy:
  skip:
    eager_not_deterministic:
      # Non-deterministic cuDNN conv/batchnorm backward in eager mode.
      - xcit_large_24_p8_224
      - mobilenetv2_100
