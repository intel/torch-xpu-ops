# Test scope for priority p2. A precision without mode runs in both training and inference.
backends:
  - default
precision:
  - dtype: float32
  - dtype: float16
  - dtype: bfloat16
  - dtype: amp_fp16
  - dtype: amp_bf16
suite:
  - huggingface
  - timm_models
  - torchbench
scenario:
  - accuracy
  - performance
