# machines.yaml - benchmark host layout and protocol.
#
# `default` applies to every host; a `hosts` entry whose key (a regex) matches
# the hostname overrides it. Without `cards`, the layout is autodetected from
# sysfs: Intel display-class DRM devices in PCI order (= ZE_AFFINITY_MASK
# index), the NUMA node of each card, and an even split of the node's CPUs,
# restricted to the cards in ZE_AFFINITY_MASK when it is set (shared CI
# runners such as bmg-test own a subset of the host's cards).
default:
  # protocol overrides (measure.py ProtocolConfig)
  protocol:
    l2_bytes: 33554432  # BMG G31; set per GPU model
    flush_bytes: 536870912
    warmup_ms: 200
    min_iters: 50
    max_iters: 400
    min_total_ms: 40
  # pre-run checks (python -m microbench env check)
  limits:
    require_idle: true
    # bmg-test hosts set the frequency range themselves (e.g. min 1200,
    # max 2400 MHz), not min == max; the range is recorded in run_meta.json
    # and the report. Enable on dedicated machines with a fixed frequency.
    require_freq_lock: false
    # the CPU governor of shared bmg-test hosts is not ours to set; it is
    # still recorded in run_meta.json. Enable on dedicated machines.
    require_cpu_performance: false
    max_temp_c: 85
hosts: {}
# Example:
#   hosts:
#     "bmg-mb-0[0-9]":
#       protocol: {l2_bytes: 33554432}
#       cards:
#         - {index: 0, drm: card1, numa: 0, cpus: "0-15"}
#         - {index: 1, drm: card2, numa: 0, cpus: "16-31"}
#         - {index: 2, drm: card3, numa: 1, cpus: "64-79"}
#         - {index: 3, drm: card4, numa: 1, cpus: "80-95"}
