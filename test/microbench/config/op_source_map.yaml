# op_source_map.yaml - which microbench ops a changed source file selects.
#
# Generated from kernel file names (local tooling, see plan 6) and reviewed
# by hand. Paths are fnmatch globs relative to the repository root ('*' also
# matches '/').
#
#   global          build-wide files: run the full core set
#   common_groups   shared kernel paths (plan 6.1.1), one group per code path:
#                   one group touched -> its ops' PR cases + core set;
#                   several groups -> full core set. Keep in sync with core_set.yaml.
#   no_bench        files whose changes never run microbench
#   ops             microbench op -> source files; a change runs the op's PR-tier cases
#
# Kernel files matching nothing are "unmapped": they run the core set and are
# listed by `python -m microbench srcmap` (report only).
global:
- CMakeLists.txt
- cmake/**
- src/CMakeLists.txt
- src/BuildOnLinux.cmake
- src/BuildOnWindows.cmake
- src/ATen/CMakeLists.txt
- src/comm/SYCLHelpers.h
- src/comm/DeviceProperties.h
