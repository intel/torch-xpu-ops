# op_source_map.yaml - which source files can move the cases of a microbench op.
#
# Generated from kernel file names (local tooling) and reviewed
# by hand. Paths are fnmatch globs relative to the repository root ('*' also
# matches '/'). The commits between two nightlies that touch the files of an
# op (its `ops` entry, every common group and the global files) are the
# candidate commits of a regression of that op.
#
#   global          build-wide files
#   common_groups   shared kernel paths, one group per code path
#   core_set        the core representative set, per common group: the ops of
#                   the group and its 1-2 core cases (one per major branch;
#                   bf16, noise_class normal, PR tier, device time ~50us-5ms),
#                   run by `microbench_cases=core`. Refresh after nightly A/A
#                   data (quarantine, header split/rename, group change);
#                   changes need maintainer review.
#   no_bench        files that never move a microbench case
#   ops             microbench op -> source files
#
# Kernel files matching nothing are "unmapped" and are listed by
# `python -m microbench srcmap` (report only).
global:
- CMakeLists.txt
- cmake/**
- src/CMakeLists.txt
- src/BuildOnLinux.cmake
- src/BuildOnWindows.cmake
- src/ATen/CMakeLists.txt
- src/comm/SYCLHelpers.h
- src/comm/DeviceProperties.h
- src/comm/Macros.h
